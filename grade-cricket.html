     which is the whole reason defending a big total feels different from
     defending a small one. */
  requiredRate() {
    const b = M.bowl;
    if (!b.target) return 7.5;
    const left = Math.max(1, b.overs * 6 - b.balls);
    return Math.max(0, (b.target - b.runs)) / left * 6;
  },
  variUsable() { return !M.style.vari.limited || M.bowl.variLeft > 0; },

  buttons() {
    const y = VH - 92;
    return {
      vari: { x: 40, y: y, w: 300, h: 62,
              label: this.vari ? M.style.vari.label : M.style.stock.label,
              sub: M.style.vari.limited ? M.bowl.variLeft + ' LEFT THIS OVER' : 'TAP TO SWITCH' },
      bowl: { x: VW - 300, y: y, w: 260, h: 62, label: 'BOWL', sub: null },
    };
  },
  inBtn(b, p) { return p.x > b.x && p.x < b.x + b.w && p.y > b.y && p.y < b.y + b.h; },

  update(dt) {
    this.t += dt;

    if (this.phase === 'setup') {
      const B = this.buttons();
      let tap;
      while ((tap = Input.takeTap())) {
        if (this.inBtn(B.vari, tap)) { if (this.variUsable() || this.vari) this.vari = !this.vari; }
        else if (this.inBtn(B.bowl, tap)) { this.startRunup(); return; }
      }
      // drag anywhere on the pitch to move the target
      if (Input.down && Input.y < VH - 110) {
        const g = unprojectGround(Input.x, Input.y);
        if (g) {
          this.target.x = clamp(g.x, 10.4, 20.0);
          this.target.z = clamp(g.z, -1.9, 1.9);
        }
      }
      if (Input.keys.ArrowUp) this.target.x = clamp(this.target.x + dt * 5.5, 10.4, 20.0);
      if (Input.keys.ArrowDown) this.target.x = clamp(this.target.x - dt * 5.5, 10.4, 20.0);
      if (Input.keys.ArrowLeft) this.target.z = clamp(this.target.z + dt * 2.2, -1.9, 1.9);
      if (Input.keys.ArrowRight) this.target.z = clamp(this.target.z - dt * 2.2, -1.9, 1.9);
      if (Input.keys.KeyV && !this.variHeld) { if (this.variUsable() || this.vari) this.vari = !this.vari; }
      this.variHeld = !!Input.keys.KeyV;
      if (Input.keys.Space && this.t > 0.25) this.startRunup();
      return;
    }

    if (this.phase === 'runup') {
      // one cursor, one green band, one tap. Quicker bowlers sweep faster.
      const speed = 1.15 * (this.pace / 19);
      this.sweep += this.sweepDir * speed * dt;
      if (this.sweep > 1) { this.sweep = 1; this.sweepDir = -1; }
      if (this.sweep < 0) { this.sweep = 0; this.sweepDir = 1; }
      if (Input.takeTap() || Input.keys.Space) {
        this.tapErr = clamp(Math.abs(this.sweep - 0.5) * 2, 0, 1);
        this.tapped = true;
        this.release();
        return;
      }
      if (this.t > 2.4) { this.tapErr = 1; this.release(); }
      return;
    }

    if (this.phase === 'flight') {
      Ball.step(dt);
      if (!this.ai.played && now() >= this.ai.swingAt) this.playAI();
      if (this.ai.played && Ball.hit && this.outcome === null) {
        const r = resolveTravel(M.field, { sharpCatching: true, edged: this.aiQuality === 'edge' });
        if (r) this.finish(r);
        Snd.travelTo(200 + Ball.distFromCentre() * 9);
        Cam.chase(Ball.x, Ball.y, Ball.z);
      }
      if (!Ball.hit && !this.pastStumps && Ball.x >= PITCH_LEN) {
        this.pastStumps = { z: Ball.z, y: Ball.y };
      }
      if (!Ball.hit && Ball.x > Bat.keeperX() - 0.3) this.finish({ type: 'through' });
      if (this.t > 6) this.finish({ type: 'runs', runs: 0 });
      if (this.flinch > 0) this.flinch -= dt;
      return;
    }

    if (this.phase === 'result') {
      if (Take.on) Take.update(dt);
      else if (Chase.on) { Chase.update(dt); Cam.chase(Ball.x, Ball.y, Ball.z); }
      else if (Ball.live) Ball.step(dt);
      const wait = this.outcome && this.outcome.wicket ? 2.2 : 1.1;
      if (!Chase.on && this.t > wait) this.after();
    }
  },

  startRunup() {
    const S = M.style, del = this.delivery();
    this.pace = rnd(S.pace[0], S.pace[1]) * M.tier.paceMul * (del.paceMul || 1);
    this.phase = 'runup'; this.t = 0;
    this.sweep = 0; this.sweepDir = 1;
    Input.flush();
  },

  release() {
    const S = M.style, del = this.delivery();
    const err = this.tapErr;
    // Accuracy is the tap, not a die roll: the further off the beat, the
    // further the ball lands from where you put the marker.
    const spread = (0.24 + err * err * 2.2) * S.scatter;
    const pitchX = del.bouncer ? BOUNCER_BAND.px + randn() * (0.4 + err)
                               : this.target.x + randn() * spread;
    const pitchZ = this.target.z + randn() * spread * 0.42;
    const band = del.bouncer ? BOUNCER_BAND : bandFor(pitchX);
    if (del.limited && this.vari) M.bowl.variLeft = Math.max(0, M.bowl.variLeft - 1);

    this.band = band;
    this.d = {
      pace: this.pace,
      pitchX: clamp(pitchX, 9.0, 20.1),
      pitchZ: clamp(pitchZ, -2.4, 2.4),
      releaseZ: clamp(pitchZ, -1.6, 1.6) * 0.30 + 0.34,
      rest: band.rest * S.restMul,
      az: (del.swing || 0) * (1 - err * 0.5) + randn() * 0.14,
      turn: (del.turn || 0) * (1 - err * 0.35) * rnd(0.85, 1.1)
            + randn() * ((del.wobble || 0) + 0.22 + err * 0.5),
      band: band, style: S, del: del,
      spinAxis: isSpin(S) ? 1.2 : 0,
    };
    this.pred = Ball.predict(this.d);
    Ball.deliver(this.d);
    this.releaseT = now();

    // Composition: purposeful variation is rewarded, random variation is
    // punished. The ball has to differ from the last two along one axis.
    const hist = M.bowl.lastBands;
    this.surprise = 0;
    if (hist.length >= 2) {
      const differsLen = hist.every(h => h.band !== band.key);
      const differsLine = hist.every(h => Math.abs(h.z - this.d.pitchZ) > 0.55);
      const sameOther = hist.every(h => h.band === hist[0].band) || hist.every(h => Math.abs(h.z - hist[0].z) < 0.6);
      if ((differsLen || differsLine) && sameOther) this.surprise = 1;
    }
    hist.push({ band: band.key, z: this.d.pitchZ });
    if (hist.length > 2) hist.shift();

    // Hostility: pace at the body, a tight corridor, and the batter flinching.
    let gain = -0.03;                    // it decays if you stop earning it
    if (del.bouncer) gain += 0.16;
    if ((band.key === 'short' || band.key === 'bouncer') && Math.abs(this.d.pitchZ) < 0.7) gain += 0.08 * S.hostile;
    if (Math.abs(this.d.pitchZ - 0.35) < 0.45 && band.key === 'good') {
      M.bowl.corridor++;
      gain += 0.03 * Math.min(3, M.bowl.corridor) * S.hostile;
    } else M.bowl.corridor = 0;
    if (err < 0.2) gain += 0.03;
    if (err > 0.7) gain -= 0.06;
    M.hostility = clamp(M.hostility + gain, 0, 1);

    this.prepAI();
    this.phase = 'flight'; this.t = 0;
    Snd.intensity = M.hostility;
  },

  /* The AI batter. Hostility narrows their window; it does not roll their
     dismissal. You can see them getting worse. */
  prepAI() {
    const T = M.tier;
    const contactT = this.releaseT + this.pred.t;
    const h = M.hostility;
    let best = 2, bs = -9;
    for (let i = 0; i < 6; i++) {
      const s = shotAppropriate(SHOTS[i], this.pred.y, this.band.key) + rnd(0, 0.25);
      if (s > bs) { bs = s; best = i; }
    }
    if (Math.random() < h * 0.30) best = (best + (Math.random() < 0.5 ? 1 : 5)) % 6;  // across the line
    // he plays the line he saw, not the one it ended on: movement is what
    // beats him, and how much moved is exactly how much he is off by.
    const moved = Math.abs(this.d.turn) * 0.055 + Math.abs(this.d.az) * 0.030;
    // A ball released on the beat is harder to pick than one that slipped
    // out: accuracy widens his error, it does not narrow it.
    const sigma = T.aiSigma * (1 + h * 0.45 + this.surprise * 0.25 + moved)
                * (1.15 - this.tapErr * 0.40);
    const px = this.d.pitchX, pz = this.d.pitchZ;
    this.loose = (Math.abs(pz) > 1.25) || ((px < 13.2 || px > 19.7) && Math.abs(pz) > 0.95);
    const shy = h > 0.55 && (this.band.key === 'short' || this.band.key === 'bouncer') && Math.random() < h * 0.45;
    this.ai = {
      zone: best, err: randn() * sigma, played: false,
      swingAt: contactT + randn() * sigma,
      leave: shy || Math.random() < 0.04 + h * 0.06,
      contactT: contactT, sigma: sigma,
    };
    this.ai.err = this.ai.swingAt - contactT;
    if (shy) this.flinch = 0.6;
  },

  playAI() {
    const T = M.tier;
    this.ai.played = true;
    this.aiSwingT = now();
    if (this.ai.leave) { Snd.bat('miss'); this.aiSwingT = -9; return; }
    const shot = SHOTS[this.ai.zone];
    const approp = shotAppropriate(shot, this.pred.y, this.band.key);
    const widen = T.aiWindow * (0.72 + approp * 0.34) * (1 - M.hostility * 0.14)
                * (this.loose ? 1.3 : 1);
    const w = timingWindows({ widen: widen });
    const e = Math.abs(this.ai.err);
    const quality = e < w.middle ? 'middle' : e < w.good ? 'good' : e < w.edge ? 'edge' : 'air';
    if (quality === 'air') { Snd.bat('miss'); M.hostility = clamp(M.hostility + 0.06, 0, 1); return; }
    const need = clamp((this.requiredRate() - 7) / 9, 0, 1);
    const aggressive = Math.random() < 0.44 + M.batterConf * 0.34 + (this.loose ? 0.35 : 0) + need * 0.45;
    const type = !aggressive ? 'control' : (Math.random() < need * 0.7 ? 'slog' : 'attack');
    const cone = CFG.cone[quality] * (2 - approp);
    // He looks for a gap too — three glances at the field and he takes the
    // best of them — but he is worse at it than you are, and worse still
    // when you have him hurrying.
    const looks = M.batterConf > 0.4 ? 4 : 2;
    let aim = shot.ang, bestGap = -1;
    for (let k = 0; k < looks; k++) {
      const a = shot.ang + rnd(-20, 20);
      const px = CONTACT_X - Math.cos(deg(a)) * 24, pz = -Math.sin(deg(a)) * 24;
      let near = 999;
      for (const f of M.field) near = Math.min(near, Math.hypot(px - f.x, pz - f.z));
      if (near > bestGap) { bestGap = near; aim = a; }
    }
    const angle = aim + randn() * cone * (1 + M.hostility * 0.5);
    const power = CFG.swingSpeed[type] * CFG.qualityMult[quality] * shot.power * approp;
    const lift = shot.lift * CFG.typeLift[type] * CFG.qualityLift[quality]
               + (quality === 'edge' ? rnd(0, 0.45) : 0);
    this.ghost = { intended: aim, actual: angle };
    this.aiQuality = quality;
    playShot({ quality: quality, power: power, angleDeg: angle, lift: lift, contactY: this.pred.y });
    Snd.bat(quality === 'edge' ? 'edge' : 'middle');
    Snd.travel(220);
  },

  finish(r) {
    if (this.outcome) return;
    Snd.travelEnd();
    const b = M.bowl;
    b.balls++;
    const o = { wicket: false, runs: 0, label: '' };
    if (r.type === 'caught' || r.type === 'caughtBehind') {
      o.wicket = true; o.label = r.type === 'caughtBehind' ? 'CAUGHT BEHIND' : 'CAUGHT';
      const taker = r.type === 'caughtBehind' ? keeperOf(M.field) : r.by;
      if (Take.start(taker, Ball.y)) Cam.chase(Take.x, 1.5, Take.z);
    } else if (r.type === 'six') { o.runs = 6; o.label = 'SIX'; }
    else if (r.type === 'four') { o.runs = 4; o.label = 'FOUR'; }
    else if (r.type === 'runs') {
      o.runs = r.runs;
      o.label = r.runs === 0 ? 'DOT' : r.runs + (r.runs === 1 ? ' RUN' : ' RUNS');
      if (r.plan) Chase.start(r.plan, r.runs);
    } else {
      const ps = this.pastStumps || { z: Ball.z, y: this.pred.y };
      const hit = Math.abs(ps.z) < STUMP_HALF_W + 0.05 && ps.y < STUMP_H + 0.06;
      if (hit) { o.wicket = true; o.label = 'BOWLED'; }
      else {
        o.label = this.ai.leave ? 'LEFT' : 'BEATEN';
        Take.start(keeperOf(M.field), Ball.y, true);
      }
    }
    if (o.label === 'BEATEN') { M.hostility = clamp(M.hostility + 0.08, 0, 1); M.batterConf = clamp(M.batterConf - 0.06, 0, 1); }
    if (o.runs > 0 && o.runs < 4) M.batterConf = clamp(M.batterConf + 0.04, 0, 1);
    if (o.runs >= 4) { M.hostility = clamp(M.hostility - 0.16, 0, 1); M.batterConf = clamp(M.batterConf + 0.12, 0, 1); Snd.sting(o.runs === 6 ? 'six' : 'four'); }
    if (o.wicket) {
      b.wickets++; M.hostility = clamp(M.hostility + 0.14, 0, 1);
      M.batterConf = 0.4; Snd.sting('wicket'); Cam.kick(0.7);
      b.corridor = 0;
    }
    b.runs += o.runs;
    if (b.balls % 6 === 0) b.variLeft = 2;
    M.say(o.label, o.runs >= 4 || o.wicket);
    this.outcome = o;
    this.phase = 'result'; this.t = 0;
    Snd.intensity = M.hostility;
    if (!Chase.on && !Take.on) Cam.home(false);
  },

  after() {
    const b = M.bowl;
    const done = (M.mode !== 'bowlPractice')
      && (b.balls >= b.overs * 6 || b.wickets >= b.maxWickets
          || (b.target > 0 && b.runs >= b.target));
    if (done) Match.finish();
    else this.nextBall();
  },
};

/* ===================== MATCH FLOW =====================
   Five overs a side. You face every ball of your innings; if you go early
   the rest is simmed and you are bowling inside ten seconds. */
const Match = {
  screen: 'menu', tier: TIERS[0],
  simTarget: 0, simShown: 0, breakT: 0, note: '', won: false, margin: '',

  toGear(tier, mode) {
    this.tier = tier;
    M.reset(tier, mode);
    this.screen = 'gear';
  },
  begin() {
    this.screen = 'match';
    Snd.intensity = 0;
    Portal.playStart();
    if (M.phase === 'bat') { Snd.mode = 'bat'; Bat.lastBackliftZone = -1; Bat.nextBall(); }
    else { Snd.mode = 'bowl'; Bowl.nextBall(); }
    Cam.home(true);
  },
  endInnings() {
    Chase.stop();
    if (M.mode === 'batPractice') { this.finish(); return; }
    const rate = M.tier.key === 'club' ? 1.05 : 1.2;
    const left = Math.max(0, M.bat.overs * 6 - M.bat.balls);
    M.bat.teamRuns = M.bat.runs + Math.round(left * rate * rnd(0.6, 1.5)) + Math.round(rnd(6, 26));
    this.simTarget = M.bat.teamRuns; this.simShown = M.bat.runs;
    this.screen = 'break'; this.breakT = 0;
    Snd.mode = 'bowl'; Snd.intensity = 0;
  },
  startBowling() {
    M.phase = 'bowl';
    M.bowl.target = M.bat.teamRuns + 1;
    M.field = buildField(M.tier, null);
    this.screen = 'match';
    Bowl.nextBall();
    Cam.home(true);
  },
  finish() {
    Chase.stop();
    this.screen = 'result';
    Portal.playStop();
    const b = M.bat, w = M.bowl;
    if (M.mode === 'match') {
      this.won = w.runs <= b.teamRuns;
      this.margin = this.won ? (b.teamRuns - w.runs) + ' RUNS' : (w.maxWickets - w.wickets) + ' WICKETS';
    }
    this.note = selectorNote();
    if (b.runs > Save.data.bestRuns) Save.data.bestRuns = b.runs;
    Save.data.played++; Save.data.seen = true; Save.save();
    if (b.runs >= 30 || w.wickets >= 3) Portal.happy();
  },
};

function selectorNote() {
  const b = M.bat, w = M.bowl;
  if (b.runs === 0 && b.balls <= 1) return '"Everyone gets one of those. Not everyone gets two."';
  if (b.sixes >= 2) return '"He didn\'t look at the bowler once. Not once."';
  if (w.wickets >= 3) return '"Bowled like he meant it. Keep him on."';
  if (b.runs >= 40) return '"Made it look like a different game."';
  if (b.runs < 8 && w.wickets === 0) return '"Quiet day. There\'s a fixture next week."';
  return '"Useful. We\'ll see him again."';
}
/* ===================== SCENE ===================== */
function drawLengthMarker(x, z, colour, alpha, w, len) {
  const hw = w || 0.60, hl = len || 0.45;
  const a = proj(x - hl, 0.012, z - hw), b = proj(x + hl, 0.012, z - hw);
  const c = proj(x + hl, 0.012, z + hw), d = proj(x - hl, 0.012, z + hw);
  if (a.behind || b.behind || c.behind || d.behind) return;
  ctx.globalAlpha = alpha === undefined ? 0.75 : alpha;
  Art.poly([a, b, c, d], colour);
  ctx.globalAlpha = 1;
}

/* The fan. Drawn in screen space around the striker, because from behind
   him half the field is off the edge of the picture and a fan painted on
   the grass would put CUT and GLANCE behind the lens. What you flick is
   exactly what you see. */
function drawShotFan(active, dim, aimDeg) {
  const b = batterScreen();
  if (aimDeg !== undefined && !dim) {    // where you are actually pointing
    const a = deg(aimDeg);
    const dx = Math.sin(a), dy = -Math.cos(a);
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 20; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(b.x + dx * 60, b.y + dy * 60);
    ctx.lineTo(b.x + dx * 200, b.y + dy * 200);
    ctx.stroke();
  }
  for (let i = 0; i < 6; i++) {
    const a = deg(SHOTS[i].sdeg);
    const dx = Math.sin(a), dy = -Math.cos(a);
    const on = i === active;
    const r0 = 66, r1 = on ? 186 : 148;
    ctx.globalAlpha = (on ? 0.95 : 0.30) * (dim ? 0.45 : 1);
    ctx.strokeStyle = on ? PAL.gold : 'rgba(255,255,255,0.8)';
    ctx.lineWidth = on ? 8 : 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(b.x + dx * r0, b.y + dy * r0);
    ctx.lineTo(b.x + dx * r1, b.y + dy * r1);
    ctx.stroke();
    if (on) {
      const tx = b.x + dx * (r1 + 34), ty = b.y + dy * (r1 + 34) + 7;
      Art.poly([
        { x: b.x + dx * r1, y: b.y + dy * r1 },
        { x: b.x + dx * (r1 - 22) - dy * 11, y: b.y + dy * (r1 - 22) + dx * 11 },
        { x: b.x + dx * (r1 - 22) + dy * 11, y: b.y + dy * (r1 - 22) - dx * 11 },
      ], PAL.gold);
      Art.text(SHOTS[i].name, clamp(tx, 70, VW - 70), clamp(ty, 40, VH - 120), 22, PAL.gold);
    }
    ctx.globalAlpha = 1;
  }
}

/* Intended against actual, so error is attributable to the input. */
function drawGhost(g) {
  if (!g) return;
  const from = proj(CONTACT_X, 0.5, 0);
  if (from.behind) return;
  const draw = (angDeg, colour, dash) => {
    const a = deg(angDeg);
    const to = proj(CONTACT_X - Math.cos(a) * 26, 0.5, -Math.sin(a) * 26);
    if (to.behind) return;
    ctx.save();
    ctx.setLineDash(dash ? [10, 8] : []);
    ctx.strokeStyle = colour; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y); ctx.stroke();
    ctx.restore();
  };
  draw(g.intended, 'rgba(255,255,255,0.5)', true);
  draw(g.actual, 'rgba(232,185,35,0.85)', false);
}

/* The bowler, seen head on as he runs at you. Legs scissor, and in the
   last stretch the arm goes over the top — with no faces and no fingers
   that arm and the seam on the ball are the whole tell. */
function drawBowlerRunup(p, shirt, style, awayFromCamera) {
  const startX = awayFromCamera ? -7.0 : -8.0;
  const x = lerp(startX, RELEASE_X, Math.pow(p, 0.85));
  const cyc = Math.sin(p * (isSpin(style) ? 26 : 36)) * 30;
  const del = clamp((p - 0.80) / 0.20, 0, 1);
  // the arm sweeps up behind, over the top, and through
  const armOver = lerp(-40, -300, del);
  Art.shadow(x, 0.45, 0.42, 0.2);
  const f = drawFigure(x, 0.45, {
    view: 'front', shirt: shirt, cap: 'cap',
    legL: 16 + cyc, legR: 16 - cyc,
    armL: del > 0 ? armOver : -34 + cyc * 0.9,
    armR: 30 - cyc * 0.7,
    lean: (awayFromCamera ? -1 : 1) * (0.8 + p * 1.6),
    tilt: -del * 2,
  });
  if (f && del < 0.9) {                  // the ball, in the hand, seam showing
    const hb = f.handL;
    const r = Math.max(1.6, f.u * 0.085);
    Art.disc(hb, r, PAL.ball);
    ctx.save();
    ctx.translate(hb.x, hb.y); ctx.rotate(now() * 9);
    ctx.strokeStyle = PAL.white; ctx.lineWidth = Math.max(1, r * 0.35);
    ctx.beginPath(); ctx.moveTo(-r * 0.9, 0); ctx.lineTo(r * 0.9, 0); ctx.stroke();
    ctx.restore();
  }
  return f;
}

/* He reacts, visibly, every ball. Beating an opponent is more fun than
   beating a difficulty curve. */
function drawBowlerReaction(mood, shirt) {
  const x = 2.6;
  Art.shadow(x, 0.5, 0.42, 0.2);
  const base = { view: 'front', shirt: shirt, cap: 'cap' };
  if (mood > 0.35) {                     // hands on head
    drawFigure(x, 0.5, Object.assign({}, base, { armL: -168, armR: 168, legL: 10, legR: 10 }));
  } else if (mood < -0.3) {              // a stare down the pitch
    drawFigure(x, 0.5, Object.assign({}, base, { armL: -8, armR: 8, legL: 22, legR: 22, lean: 1.6 }));
  } else {
    drawFigure(x, 0.5, Object.assign({}, base, { armL: 16, armR: 16, legL: 13, legR: 13 }));
  }
}

/* The striker, from behind. His stance is the Swagger readout — pure
   feedback, no mechanical effect, and it is the thing players talk about. */
const STRIKER_X = CREASE_X + 0.45, STRIKER_Z = -0.72;

/* The whole shot, as a pose. Stance and pick-up when he is waiting, then
   the swing runs on its own clock from the moment he commits: down through
   the line, out the far side, and held there. The hold is the point — a
   stroke you watch finish reads as a stroke, and a bat that snaps back to
   the stance reads as a sprite. */
function strikerPose(zone, swingT, info, shirt, cap, viewBack) {
  const sw = M.swagger;
  const idle = Math.sin(now() * (2.4 - sw * 1.1)) * (2 + sw * 4);
  const o = {
    view: viewBack ? 'back' : 'front', shirt: shirt, pads: true, bat: true, cap: cap,
    legL: 17 + sw * 4, legR: 17 + sw * 4,
    armL: 26, armR: 30, lean: -0.6 + sw * 1.6, crouch: 0,
    batAng: 18 + sw * 26 + idle, blur: 0, zone: zone,
  };

  const t = swingT > 0 ? now() - swingT : -1;
  if (!info || t < 0 || t > 1.15) {
    // waiting. The pick-up comes up as soon as he commits, and it comes up
    // high — that shape is the house style before a ball has been bowled.
    if (viewBack && Input.charging() && Bat.phase !== 'result') {
      o.batAng = 174 + idle * 0.4; o.armL = 44; o.armR = 50; o.lean = -1.6;
    }
    return o;
  }

  const A = SHOT_ANIM[zone];
  const beaten = info.quality === 'miss';
  const finish = beaten ? A.finish - 40 : A.finish;   // beaten, he over-rotates
  let ang;
  if (t < SWING_DOWN) {
    ang = lerp(A.lift, A.contact, (t / SWING_DOWN) * (t / SWING_DOWN));
    o.blur = 1;
  } else if (t < SWING_DOWN + SWING_THROUGH) {
    const p = (t - SWING_DOWN) / SWING_THROUGH;
    ang = lerp(A.contact, finish, 1 - Math.pow(1 - p, 2));
    o.blur = 1 - p;
  } else {
    const rel = clamp((t - SWING_DOWN - SWING_THROUGH - A.hold) / 0.28, 0, 1);
    ang = lerp(finish, o.batAng, rel * rel);
  }

  const k = clamp(t / (SWING_DOWN + SWING_THROUGH), 0, 1);
  o.batAng = ang;
  o.lean = lerp(o.lean, A.lean + (beaten ? -1.8 : 0), k);
  o.crouch = A.crouch * k;
  // the hands go with the bat, and the legs say front foot or back
  o.armL = lerp(26, A.back ? 46 : 62, k);
  o.armR = lerp(30, A.back ? 52 : 70, k);
  o.legL = o.legL + (A.back ? 15 : -5) * k;
  o.legR = o.legR + (A.back ? -3 : 21) * k;
  return o;
}

/* The bat drawn back along its own arc, so a middled shot is a wedge rather
   than a stick that teleported. */
function drawBatBlur(anchors, o) {
  if (!anchors || o.blur < 0.06) return;
  for (let i = 1; i <= 3; i++) {
    ctx.globalAlpha = 0.22 * o.blur * (4 - i) / 3;
    drawBat(anchors.handR, o.batAng + i * 19, anchors.H, 1, '#efe3c0');
  }
  ctx.globalAlpha = 1;
}

function drawStriker() {
  const o = strikerPose(Bat.zone, Bat.swung ? Bat.swingT : -1, Bat.swingInfo,
                        PAL.maroon, M.gear === 'cap' ? 'cap' : 'helmet', true);
  Art.shadow(STRIKER_X, STRIKER_Z, 0.44, 0.26);
  drawBatBlur(drawFigure(STRIKER_X, STRIKER_Z, o), o);
}

/* The batter you are bowling at, seen from behind your own arm. */
/* The batter you are bowling at, seen from behind your own arm. He plays
   the same six shots off the same table — you are watching him middle them
   or not, which is what Hostility is for. */
function drawFacingBatter() {
  const fl = Bowl.flinch > 0;
  Art.shadow(STRIKER_X, STRIKER_Z, 0.44, 0.26);
  if (fl) {
    drawFigure(STRIKER_X, STRIKER_Z, {
      view: 'front', shirt: PAL.them, pads: true, bat: true, cap: 'helmet',
      legL: 30, legR: 8, armL: -150, armR: 140, lean: -2.4, crouch: 1.6, batAng: -150,
    });
    return;
  }
  const played = Bowl.ai && Bowl.ai.played && Bowl.aiSwingT > 0;
  const o = strikerPose(played ? Bowl.ai.zone : 2, played ? Bowl.aiSwingT : -1,
                        played ? { quality: Bowl.aiQuality } : null,
                        PAL.them, 'helmet', false);
  if (!played) o.lean = -0.4 + M.batterConf * 1.2;
  drawBatBlur(drawFigure(STRIKER_X, STRIKER_Z, o), o);
}

/* The bowler comes over the wicket from the off side, at z = +0.45. Both of
   these used to stand in that lane — the non-striker on the off side of the
   stumps and the umpire directly in it — so the delivery ran through them.
   They now stand where they actually stand: the umpire a step off to the
   leg side of the bowler's stumps, and the non-striker backing up on the
   other side from the arm. */
const UMPIRE_X = -2.4, UMPIRE_Z = -1.05;
const NONSTRIKER_Z = -1.55;

function drawUmpire() {
  Art.shadow(UMPIRE_X, UMPIRE_Z, 0.4, 0.18);
  drawFigure(UMPIRE_X, UMPIRE_Z, {
    view: 'front', shirt: '#e6e2d6', cap: 'cap', legL: 11, legR: 11, armL: 10, armR: 10, scale: 0.98,
  });
}

/* He backs up as the ball is released, which is both correct and the only
   movement in that half of the picture. */
function drawNonStriker(shirt) {
  const live = (M.phase === 'bat' && Bat.phase === 'flight') ||
               (M.phase === 'bowl' && (Bowl.phase === 'flight' || Bowl.phase === 'result'));
  const back = live ? clamp((M.phase === 'bat' ? Bat.t : Bowl.t) * 1.5, 0, 1) : 0;
  const x = FAR_CREASE_X - 0.3 + back * 1.9;
  Art.shadow(x, NONSTRIKER_Z, 0.4, 0.2);
  drawFigure(x, NONSTRIKER_Z, {
    view: 'front', shirt: shirt, pads: true, bat: true, cap: 'cap',
    legL: 15 + back * 9, legR: 15 - back * 5,
    armL: 24, armR: 26, batAng: 22, lean: back * 0.9, scale: 0.98,
  });
}

/* One fielder. Standing, chasing, or taking it — and when he is taking it
   his hands go where the ball is, so the catch is a thing that happens
   rather than a caption over a ball still travelling. */
function drawFielder(p, shirt, labels) {
  const x = p.chase ? p.cx : p.x, z = p.chase ? p.cz : p.z;
  const g = proj(x, 0, z);
  if (g.behind || g.d < 3.4 || g.x < -260 || g.x > VW + 260) return;
  Art.shadow(x, z, 0.42, 0.18);

  if (p.taking) {
    // arms up for one over his head, out in front for one at the chest,
    // and he straightens up out of it over the next half second
    const th = now() - p.taking;
    const high = Take.y > 1.5;
    const settle = clamp(th / 0.45, 0, 1);
    const arm = lerp(high ? 158 : 104, high ? 130 : 70, settle);
    drawFigure(x, z, {
      view: 'front', shirt: shirt, cap: 'cap',
      armL: arm, armR: arm,
      legL: p.keeper ? 26 - settle * 12 : 15, legR: p.keeper ? 26 - settle * 12 : 15,
      crouch: p.keeper ? 1.2 * (1 - settle) : 0.3 * (1 - settle),
      lean: 0.5, scale: 0.96,
    });
  } else if (p.keeper) {
    drawFigure(x, z, {
      view: M.phase === 'bat' ? 'front' : 'back', shirt: shirt, cap: 'cap',
      crouch: 2.2, legL: 40, legR: 40, armL: 44, armR: 44, scale: 0.96,
    });
  } else if (p.chase) {
    const cyc = Math.sin(now() * 14) * 28;
    drawFigure(x, z, {
      view: 'front', shirt: shirt, cap: 'cap', lean: 1.4,
      legL: 16 + cyc, legR: 16 - cyc, armL: 30 - cyc * 0.6, armR: 30 + cyc * 0.6, scale: 0.96,
    });
  } else {
    const w = Math.sin(now() * 1.6 + p.a) * 4;
    drawFigure(x, z, {
      view: 'front', shirt: shirt, cap: 'cap',
      legL: 14, legR: 14, armL: 18 + w, armR: 18 - w, scale: 0.96,
    });
  }

  if (labels || p.chase) {
    const size = clamp(15 * g.s * 2.4, 9, 17);
    ctx.globalAlpha = p.flagged ? 0.95 : 0.6;
    Art.text(p.name, g.x, g.y + size + 6, size, p.flagged ? PAL.gold : 'rgba(255,255,255,0.9)', 'center', '700');
    ctx.globalAlpha = 1;
  } else if (p.flagged) {
    const q = proj(x, 2.8, z);
    if (!q.behind) Art.text('!', q.x, q.y, clamp(26 * q.s * 2, 12, 28), PAL.gold);
  }
}

/* Everyone on the field, drawn back to front.

   Painter's order matters now that the camera stands behind the striker:
   the keeper is between the lens and the batter, and a fixed draw order put
   whoever was written last on top regardless of who was actually nearer. So
   each figure is queued with its own distance from the lens and the queue
   is sorted before anything is drawn. */
function sceneActors(theirShirt, labels) {
  const out = [];
  const add = (x, z, fn) => {
    const p = proj(x, 0, z);
    if (!p.behind && p.d > 1.6) out.push({ d: p.d, fn: fn });
  };
  for (const p of M.field) {
    if (p.bowler) continue;              // he is drawn running or reacting
    add(p.chase ? p.cx : p.x, p.chase ? p.cz : p.z, () => drawFielder(p, theirShirt, labels));
  }
  add(UMPIRE_X, UMPIRE_Z, drawUmpire);
  return out;
}

function drawScene() {
  const T = M.tier;
  drawGround(T);
  drawSightscreen(T);
  drawCrowd(T);
  drawStumps(0, false);
  drawStumps(PITCH_LEN, true);

  const theirShirt = M.phase === 'bat' ? PAL.them : PAL.maroonLite;
  const ourShirt = M.phase === 'bat' ? PAL.maroon : PAL.them;
  const labels = M.showNames && (
    (M.phase === 'bowl' && Bowl.phase === 'setup') ||
    (M.phase === 'bat' && (Bat.phase === 'ready' || Bat.phase === 'runup')));
  const actors = sceneActors(theirShirt, labels);

  if (M.phase === 'bat') {
    const style = Bat.bowler ? Bat.bowler.style : STYLES[0];
    if (Bat.marker) drawLengthMarker(Bat.marker.x, Bat.marker.z, PAL.gold, 0.55);
    if (Bat.phase === 'runup') {
      const q = clamp(Bat.t / Bat.runup, 0, 1);
      actors.push({ d: 99, fn: () => drawBowlerRunup(q, theirShirt, style, false) });
    } else if (Bat.phase === 'flight') {
      actors.push({ d: 99, fn: () => drawBowlerRunup(1, theirShirt, style, false) });
    } else {
      actors.push({ d: 99, fn: () => drawBowlerReaction(M.bowlerMood, theirShirt) });
    }
    if (Chase.on) actors.push({ d: 12, fn: () => Chase.draw(ourShirt) });
    else {
      actors.push({ d: 60, fn: () => drawNonStriker(ourShirt) });
      actors.push({ d: proj(STRIKER_X, 0, STRIKER_Z).d, fn: drawStriker });
    }
    actors.sort((a, b) => b.d - a.d);
    actors.forEach(a => a.fn());

    if (!Bat.swung && Bat.phase !== 'result') {
      drawShotFan(Bat.zone, Bat.phase === 'ready', screenFromAim(Bat.aim.ang));
    }
    if (Bat.ghost && Bat.phase === 'result') drawGhost(Bat.ghost);
  } else {
    if (Chase.on) actors.push({ d: 12, fn: () => Chase.draw(ourShirt) });
    else {
      actors.push({ d: proj(STRIKER_X, 0, STRIKER_Z).d, fn: drawFacingBatter });
      actors.push({ d: 60, fn: () => drawNonStriker(theirShirt) });
    }
    if (Bowl.phase === 'runup') {
      const q = clamp(Bowl.t / 1.6, 0, 1);
      actors.push({ d: 1, fn: () => drawBowlerRunup(q, PAL.maroonLite, M.style, true) });
    } else if (Bowl.phase === 'flight' || Bowl.phase === 'result') {
      actors.push({ d: 1, fn: () => drawBowlerRunup(1, PAL.maroonLite, M.style, true) });
    } else {
      actors.push({ d: 1, fn: () => drawBowlerReaction(0, PAL.maroonLite) });
    }
    actors.sort((a, b) => b.d - a.d);
    actors.forEach(a => a.fn());

    if (Bowl.phase === 'setup') {
      const band = Bowl.delivery().bouncer ? BOUNCER_BAND : bandFor(Bowl.target.x);
      drawLengthMarker(Bowl.target.x, Bowl.target.z, PAL.gold, 0.55, 0.45, 0.55);
      const a = proj(Bowl.target.x - 0.45, 0.02, Bowl.target.z);
      const b = proj(19.6, 0.02, Bowl.target.z);
      if (!a.behind && !b.behind) {
        ctx.save();
        ctx.strokeStyle = 'rgba(232,185,35,0.75)'; ctx.lineWidth = 3; ctx.setLineDash([12, 10]);
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        ctx.restore();
      }
      const lp = proj(Bowl.target.x, 0.9, Bowl.target.z);
      if (!lp.behind) Art.text(band.label, lp.x, lp.y, 22, PAL.gold);
    }
    if (Bowl.ghost && Bowl.phase === 'result') drawGhost(Bowl.ghost);
  }
  Ball.draw();
}

/* ===================== HUD ===================== */
function meterColour(v) {
  const h = lerp(48, 0, clamp(v, 0, 1) * (v > 0.85 ? 1 : 0.7));
  return 'hsl(' + h + ',85%,' + lerp(48, 58, v) + '%)';
}

function drawMeter(x, y, w, h, v, label, full) {
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = meterColour(v);
  ctx.fillRect(x, y, w * clamp(v, 0, 1), h);
  if (full) {
    const pulse = 0.55 + Math.sin(now() * 9) * 0.45;
    ctx.globalAlpha = pulse;
    ctx.strokeStyle = PAL.white; ctx.lineWidth = 3;
    ctx.strokeRect(x - 2, y - 2, w + 4, h + 4);
    ctx.globalAlpha = 1;
  }
  Art.text(label, x, y - 9, 19, full ? PAL.gold : 'rgba(255,255,255,0.85)', 'left');
}

function shade(x, y, w, h) {
  ctx.fillStyle = 'rgba(0,0,0,0.32)';
  ctx.fillRect(x, y, w, h);
}

function drawHUD() {
  const b = M.bat, w = M.bowl;
  ctx.save();
  if (M.phase === 'bat') {
    const ov = Math.floor(b.balls / 6) + '.' + (b.balls % 6);
    Art.text(b.runs + ' (' + b.balls + ')', VW / 2, 62, 58, PAL.white);
    Art.text(M.mode === 'batPractice' ? 'PRACTICE  ' + ov + ' OV'
      : ov + ' / ' + b.overs + ' OV   ·   ' + b.fours + 'x4  ' + b.sixes + 'x6',
      VW / 2, 92, 21, 'rgba(255,255,255,0.8)');
    drawMeter(40, 68, 300, 22, M.swagger, 'SWAGGER', M.swagger >= 0.999);
    if (M.swagger >= 0.999) Art.text('HOLD FOR THE FLOURISH', 40, 116, 17, PAL.gold, 'left');
    if (Bat.bowler) {
      Art.text(Bat.bowler.name, VW - 40, 58, 24, PAL.white, 'right');
      Art.text(Bat.bowler.style.name, VW - 40, 82, 19, PAL.gold, 'right');
    }
    Art.text(M.gear === 'cap' ? 'CAP' : 'HELMET', VW - 40, 108, 17,
             M.gear === 'cap' ? PAL.gold : 'rgba(255,255,255,0.6)', 'right');
    if (Bat.phase === 'runup' && Input.charging()) {
      Art.text('BACKLIFT UP', VW / 2, VH - 34, 22, PAL.gold);
    }
    if (Chase.on && Chase.shown > 0) {
      Art.text(Chase.shown + (Chase.shown === 1 ? ' RUN' : ' RUNS'), VW / 2, VH - 40, 34, PAL.gold);
    }
  } else {
    const ov = Math.floor(w.balls / 6) + '.' + (w.balls % 6);
    Art.text(w.runs + '-' + w.wickets, VW / 2, 62, 58, PAL.white);
    Art.text(ov + (M.mode === 'bowlPractice' ? ' OV  PRACTICE' : ' / ' + w.overs + ' OV'
      + (w.target ? '   ·   NEED ' + Math.max(0, w.target - w.runs) : '')),
      VW / 2, 92, 21, 'rgba(255,255,255,0.8)');
    drawMeter(40, 68, 300, 22, M.hostility, 'HOSTILITY', M.hostility >= 0.85);
    Art.text(M.style.name, VW - 40, 58, 24, PAL.gold, 'right');
    Art.text('BATTER', VW - 178, 92, 15, 'rgba(255,255,255,0.6)', 'left');
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(VW - 178, 100, 138, 12);
    ctx.fillStyle = M.batterConf > 0.55 ? '#5fd07a' : M.batterConf > 0.3 ? '#e8b923' : '#d0483f';
    ctx.fillRect(VW - 178, 100, 138 * clamp(M.batterConf, 0, 1), 12);
    if (Chase.on && Chase.shown > 0) {
      Art.text(Chase.shown + (Chase.shown === 1 ? ' RUN' : ' RUNS'), VW / 2, VH - 40, 34, PAL.gold);
    }
  }
  ctx.restore();
}

function drawBanner() {
  if (!M.msg) return;
  const age = now() - M.msgT;
  if (age > 1.5) return;
  const pop = age < 0.12 ? 1 + (0.12 - age) * 4 : 1;
  const alpha = age > 1.1 ? 1 - (age - 1.1) / 0.4 : 1;
  ctx.save();
  ctx.globalAlpha = clamp(alpha, 0, 1);
  ctx.translate(VW / 2, VH * 0.30);
  ctx.scale(pop, pop);
  const size = M.msgBig ? 92 : 52;
  ctx.lineWidth = 10; ctx.strokeStyle = 'rgba(0,0,0,0.55)';
  ctx.font = '900 ' + size + 'px "Arial Black", Impact, sans-serif';
  ctx.textAlign = 'center';
  ctx.strokeText(M.msg, 0, 0);
  Art.text(M.msg, 0, 0, size, M.msgBig ? PAL.gold : PAL.white);
  ctx.restore();
}

/* The two bowling inputs, painted where the action is. Drag, then tap. */
function drawBowlUI() {
  if (M.phase !== 'bowl') return;
  const btn = (r, on) => {
    ctx.fillStyle = on ? PAL.gold : 'rgba(0,0,0,0.5)';
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = on ? PAL.gold : 'rgba(255,255,255,0.75)';
    ctx.lineWidth = 3; ctx.strokeRect(r.x, r.y, r.w, r.h);
    Art.text(r.label, r.x + r.w / 2, r.y + (r.sub ? 30 : 40), 24, on ? PAL.ink : PAL.white);
    if (r.sub) Art.text(r.sub, r.x + r.w / 2, r.y + 50, 14, on ? 'rgba(0,0,0,0.7)' : 'rgba(255,255,255,0.65)', 'center', '700');
  };
  if (Bowl.phase === 'setup') {
    const B = Bowl.buttons();
    btn(B.vari, Bowl.vari);
    btn(B.bowl, false);
    Art.text('DRAG ON THE PITCH TO AIM', VW / 2, VH - 104, 22, 'rgba(255,255,255,0.9)');
  }
  if (Bowl.phase === 'runup') {
    const x0 = VW * 0.22, x1 = VW * 0.78, y = VH - 108, h = 44, w = x1 - x0;
    shade(x0 - 6, y - 6, w + 12, h + 12);
    ctx.fillStyle = 'rgba(255,255,255,0.14)'; ctx.fillRect(x0, y, w, h);
    ctx.fillStyle = 'rgba(95,208,122,0.55)'; ctx.fillRect(x0 + w * 0.40, y, w * 0.20, h);
    ctx.fillStyle = 'rgba(232,185,35,0.30)';
    ctx.fillRect(x0 + w * 0.26, y, w * 0.14, h); ctx.fillRect(x0 + w * 0.60, y, w * 0.14, h);
    ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2; ctx.strokeRect(x0, y, w, h);
    const px = x0 + w * Bowl.sweep;
    ctx.fillStyle = PAL.white; ctx.fillRect(px - 4, y - 10, 8, h + 20);
    Art.text('RELEASE', VW / 2, y - 20, 24, PAL.white);
  }
}
/* ===================== SCREENS ===================== */
const UI = { hits: [], rotateDismissed: false };
function uiBtn(x, y, w, h, label, sub, hot) {
  UI.hits.push({ x: x, y: y, w: w, h: h, id: label });
  ctx.fillStyle = hot ? PAL.gold : 'rgba(0,0,0,0.45)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = hot ? PAL.gold : PAL.white; ctx.lineWidth = 3;
  ctx.strokeRect(x, y, w, h);
  Art.text(label, x + w / 2, y + (sub ? h / 2 : h / 2 + 11), Math.min(30, w / (label.length * 0.62)),
           hot ? PAL.ink : PAL.white);
  if (sub) Art.text(sub, x + w / 2, y + h / 2 + 28, 16, hot ? 'rgba(0,0,0,0.7)' : 'rgba(255,255,255,0.7)', 'center', '700');
  return label;
}
function uiTake() {
  const t = Input.takeTap();
  if (!t) return null;
  for (const h of UI.hits) {
    if (t.x > h.x && t.x < h.x + h.w && t.y > h.y && t.y < h.y + h.h) return h.id;
  }
  return '__miss__';
}
function stripes() {
  ctx.fillStyle = PAL.maroon; ctx.fillRect(0, 0, VW, VH);
  ctx.fillStyle = PAL.maroonLite;
  for (let i = 0; i < 9; i++) ctx.fillRect(0, i * 90 + (i % 2) * 6, VW, 30);
}

function drawMenu() {
  stripes();
  Art.text('GRADE', VW / 2, 150, 96, PAL.gold);
  Art.text('CRICKET', VW / 2, 238, 96, PAL.white);
  Art.text('SWAGGER  ·  HOSTILITY  ·  ONE BALL AT A TIME', VW / 2, 276, 20, 'rgba(255,255,255,0.75)');

  uiBtn(VW / 2 - 460, 320, 300, 92, 'QUICK MATCH', '5 overs each · bat then bowl');
  uiBtn(VW / 2 - 150, 320, 300, 92, 'BATTING', 'endless · learn the fan');
  uiBtn(VW / 2 + 160, 320, 300, 92, 'BOWLING', 'endless spell · build Hostility');

  const t = Match.tier;
  Art.text('TIER', VW / 2, 458, 20, 'rgba(255,255,255,0.7)');
  uiBtn(VW / 2 - 230, 472, 220, 58, 'CLUB', null, t === TIERS[0]);
  uiBtn(VW / 2 + 10, 472, 220, 58, 'ISLAND', null, t === TIERS[1]);

  Art.text(Save.data.bestRuns > 0 ? 'BEST INNINGS: ' + Save.data.bestRuns : 'TAP TO BEGIN',
    VW / 2, 578, 22, PAL.gold);
  Art.text('BAT: hold anywhere, drag to aim, release on the ball   ·   BOWL: drag a target, tap on the beat',
    VW / 2, 626, 17, 'rgba(255,255,255,0.7)', 'center', '700');
  Art.text('KEYS: 1-6 aim  ·  SPACE swing / bowl  ·  ARROWS aim your bowling  ·  V variation  ·  M mute',
    VW / 2, 654, 15, 'rgba(255,255,255,0.5)', 'center', '700');

  const id = uiTake();
  if (id === 'QUICK MATCH') Match.toGear(Match.tier, 'match');
  else if (id === 'BATTING') Match.toGear(Match.tier, 'batPractice');
  else if (id === 'BOWLING') Match.toGear(Match.tier, 'bowlPractice');
  else if (id === 'CLUB') Match.tier = TIERS[0];
  else if (id === 'ISLAND') Match.tier = TIERS[1];
}

/* One screen, two decisions: what is on your head, and what you bowl. */
function drawGear() {
  stripes();
  const batting = M.mode !== 'bowlPractice';
  Art.text(Match.tier.name, VW / 2, 66, 30, PAL.gold);

  if (batting) {
    Art.text('CAP OR HELMET', VW / 2, 132, 46, PAL.white);
    uiBtn(VW / 2 - 340, 156, 320, 128, 'CAP', null, M.gear === 'cap');
    Art.text('Swagger builds 40% faster.', VW / 2 - 180, 248, 17,
             M.gear === 'cap' ? 'rgba(0,0,0,0.75)' : 'rgba(255,255,255,0.7)', 'center', '700');
    Art.text('The short ball is a problem.', VW / 2 - 180, 270, 17,
             M.gear === 'cap' ? 'rgba(0,0,0,0.75)' : 'rgba(255,255,255,0.7)', 'center', '700');
    uiBtn(VW / 2 + 20, 156, 320, 128, 'HELMET', null, M.gear === 'helmet');
    Art.text('Nothing special happens.', VW / 2 + 180, 248, 17,
             M.gear === 'helmet' ? 'rgba(0,0,0,0.75)' : 'rgba(255,255,255,0.7)', 'center', '700');
    Art.text('Nothing bad happens either.', VW / 2 + 180, 270, 17,
             M.gear === 'helmet' ? 'rgba(0,0,0,0.75)' : 'rgba(255,255,255,0.7)', 'center', '700');
  }

  const top = batting ? 330 : 190;
  Art.text('WHAT DO YOU BOWL?', VW / 2, top, 46, PAL.white);
  const bw = 196, gap = 12, cols = 3;
  const x0 = VW / 2 - (bw * cols + gap * (cols - 1)) / 2;
  STYLES.forEach((s, i) => {
    const cx = x0 + (i % cols) * (bw + gap);
    const cy = top + 26 + Math.floor(i / cols) * 84;
    uiBtn(cx, cy, bw, 72, s.name, s.stock.label + ' / ' + s.vari.label, M.style === s);
  });
  Art.text(M.style.blurb, VW / 2, top + 226, 20, PAL.gold, 'center', '700');

  uiBtn(VW / 2 - 150, VH - 92, 300, 68, 'PLAY', null, true);

  const id = uiTake();
  if (id === 'CAP') M.gear = 'cap';
  else if (id === 'HELMET') M.gear = 'helmet';
  else if (id === 'PLAY') Match.begin();
  else if (id) {
    const s = STYLES.find(v => v.name === id);
    if (s) M.style = s;
  }
}

function drawBreak(dt) {
  Match.breakT += dt;
  Match.simShown = Math.min(Match.simTarget,
    Match.simShown + Math.max(1, (Match.simTarget - M.bat.runs) * dt * 0.9));
  ctx.fillStyle = PAL.ink; ctx.fillRect(0, 0, VW, VH);
  Art.text('YOUR INNINGS', VW / 2, 130, 30, 'rgba(255,255,255,0.7)');
  const b = M.bat;
  Art.text(b.out ? b.runs + ' (' + b.balls + ')  ' + b.howOut : b.runs + ' (' + b.balls + ') NOT OUT',
    VW / 2, 206, 68, PAL.gold);
  Art.text(b.fours + ' FOURS   ·   ' + b.sixes + ' SIXES', VW / 2, 248, 22, 'rgba(255,255,255,0.75)');
  Art.text('THE REST OF THE INNINGS', VW / 2, 336, 26, 'rgba(255,255,255,0.7)');
  Art.text(Math.round(Match.simShown) + ' ALL OUT', VW / 2, 406, 60, PAL.white);
  Art.text('YOU OPEN THE BOWLING — ' + M.style.name, VW / 2, 466, 22, PAL.gold);
  if (Match.breakT > 2.0) {
    uiBtn(VW / 2 - 190, 512, 380, 76, 'TAKE THE BALL', 'defend ' + (Match.simTarget + 1));
    if (uiTake() === 'TAKE THE BALL') Match.startBowling();
  }
}

function drawResult() {
  ctx.fillStyle = PAL.ink; ctx.fillRect(0, 0, VW, VH);
  const b = M.bat, w = M.bowl;
  let head = 'STUMPS';
  if (M.mode === 'match') head = w.runs > b.teamRuns ? 'BEATEN' : w.runs === b.teamRuns ? 'TIED' : 'WON';
  Art.text(head, VW / 2, 124, 72, head === 'WON' ? PAL.gold : PAL.white);
  if (M.mode === 'match') {
    Art.text('YOU ' + b.teamRuns + '   ·   THEM ' + w.runs + '-' + w.wickets, VW / 2, 170, 26, 'rgba(255,255,255,0.8)');
  }
  Art.text('BATTING', VW / 2 - 250, 258, 24, 'rgba(255,255,255,0.6)');
  Art.text(b.balls === 0 ? 'DNB' : b.runs + ' (' + b.balls + ')', VW / 2 - 250, 318, 54, PAL.gold);
  Art.text(b.fours + 'x4  ' + b.sixes + 'x6', VW / 2 - 250, 352, 20, 'rgba(255,255,255,0.7)');
  Art.text('BOWLING', VW / 2 + 250, 258, 24, 'rgba(255,255,255,0.6)');
  const ov = Math.floor(w.balls / 6) + (w.balls % 6 ? '.' + (w.balls % 6) : '');
  Art.text(w.balls === 0 ? '—' : ov + '-0-' + w.runs + '-' + w.wickets, VW / 2 + 250, 318, 48, PAL.gold);
  Art.text(M.style.name, VW / 2 + 250, 352, 20, 'rgba(255,255,255,0.7)');
  Art.text('THE SELECTOR', VW / 2, 424, 20, 'rgba(255,255,255,0.6)');
  Art.text(Match.note, VW / 2, 460, 24, PAL.white, 'center', '700');
  uiBtn(VW / 2 - 330, 518, 300, 80, 'PLAY AGAIN', null, true);
  uiBtn(VW / 2 + 30, 518, 300, 80, 'MENU');
  const id = uiTake();
  if (id === 'PLAY AGAIN') Match.toGear(Match.tier, M.mode);
  else if (id === 'MENU') { Match.screen = 'menu'; Snd.intensity = 0; }
}

/* ===================== LOOP ===================== */
let canvas, last = 0, scale = 1, offX = 0, offY = 0;

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  scale = Math.min(w / VW, h / VH);
  offX = (w - VW * scale) / 2;
  offY = (h - VH * scale) / 2;
  canvas._dpr = dpr;
  document.getElementById('rotate').classList.toggle('on', h > w * 1.05 && !UI.rotateDismissed);
}

function frame(ts) {
  requestAnimationFrame(frame);
  const t = ts / 1000;
  let dt = last ? Math.min(0.05, t - last) : 0.016;
  last = t;

  Snd.tick();
  if (M.hitstop > 0) { M.hitstop -= dt; dt = 0; }   // contact is the reward
  Cam.update(dt);

  if (Match.screen === 'match') {
    if (M.phase === 'bat') { Snd.intensity = M.swagger; Bat.update(dt); }
    else Bowl.update(dt);
  }

  const d = canvas._dpr;
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.fillStyle = '#14060a';
  ctx.fillRect(0, 0, canvas.width / d, canvas.height / d);
  ctx.save();
  ctx.translate(offX, offY);
  ctx.scale(scale, scale);
  ctx.beginPath(); ctx.rect(0, 0, VW, VH); ctx.clip();
  UI.hits.length = 0;

  if (Match.screen === 'menu') drawMenu();
  else if (Match.screen === 'gear') drawGear();
  else if (Match.screen === 'break') drawBreak(dt);
  else if (Match.screen === 'result') drawResult();
  else {
    drawScene();
    if (M.flash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + (M.flash * 0.35) + ')';
      ctx.fillRect(0, 0, VW, VH);
      M.flash = Math.max(0, M.flash - dt * 6);
    }
    drawBowlUI();
    drawHUD();
    drawBanner();
    Input.taps.length = 0;               // gameplay reads presses, not taps
  }
  ctx.restore();
}

/* ===================== BOOT ===================== */
function boot() {
  canvas = document.getElementById('game');
  ctx = canvas.getContext('2d');
  Save.load();
  Portal.init();
  Portal.loadStart();
  Input.init(canvas);
  M.reset(TIERS[0], 'match');
  Cam.home(true);
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));
  document.getElementById('rotate').addEventListener('click', () => {
    UI.rotateDismissed = true;
    document.getElementById('rotate').classList.remove('on');
  });
  Portal.loadStop();
  requestAnimationFrame(frame);
}
boot();
</script>
