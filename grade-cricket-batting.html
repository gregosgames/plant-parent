   the same six shots off the same table — you are watching him middle them
   or not. */
function drawFacingBatter() {
  const K = theirKit();
  const fl = Bowl.flinch > 0;
  Art.shadow(STRIKER_X, STRIKER_Z, 0.44, 0.26);
  if (fl) {
    // Ducking is a pose, not a substitution. This branch used to draw him in
    // a flat house colour with no trim, pads or skin of his own, so every
    // ball he left or ducked changed his kit for the length of the animation.
    drawFigure(STRIKER_X, STRIKER_Z, {
      view: 'side', face: -1, shirt: K.shirt, trim: K.trim, padCol: K.pads,
      capCol: K.cap, skin: K.skin, pads: true, bat: true, cap: 'helmet',
      legF: 8, legB: -34, armF: 150, armB: 140, lean: -2.4, crouch: 1.6, batAng: -150,
    });
    return;
  }
  const played = Bowl.ai && Bowl.ai.played && Bowl.aiSwingT > 0;
  const o = strikerPose(played ? Bowl.ai.zone : 2, played ? Bowl.aiSwingT : -1,
                        played ? { quality: Bowl.aiQuality } : null,
                        K.shirt, 'helmet', -1);
  o.trim = K.trim; o.padCol = K.pads; o.capCol = K.cap; o.skin = K.skin;
  if (!played) o.lean = -0.4 + M.batterConf * 1.2;
  const x = STRIKER_X - o.stride;
  drawBatBlur(drawFigure(x, STRIKER_Z, o), o);
}

/* The bowler comes over the wicket from the off side, at z = +0.45. Both of
   these used to stand in that lane — the non-striker on the off side of the
   stumps and the umpire directly in it — so the delivery ran through them.
   They now stand where they actually stand: the umpire a step off to the
   leg side of the bowler's stumps, and the non-striker backing up on the
   other side from the arm. */
/* He stands at the wicket, not two and a half metres back from it and out
   on the square: a shoulder's width to the leg side of the bowler's stumps
   and level with them, which is where an umpire has always stood and is far
   enough off the arm at z = +0.45 for the delivery to miss him. */
const UMPIRE_X = -0.85, UMPIRE_Z = -0.80;
const NONSTRIKER_Z = -1.70;

/* And he is dressed like one: the white coat and dark trousers of an
   eighties outside broadcast, so he reads as an official rather than as a
   twelfth fielder in the wrong shirt. */
function drawUmpire() {
  const idle = Math.sin(now() * 0.9) * 1.6;
  Art.shadow(UMPIRE_X, UMPIRE_Z, 0.4, 0.18);
  drawFigure(UMPIRE_X, UMPIRE_Z, {
    view: 'front', shirt: '#f2efe2', trim: '#d8d2bc', legCol: '#2f333a',
    cap: 'cap', capCol: '#f2efe2', skin: SKINS[1],
    legL: 9, legR: 9, armL: 8 + idle, armR: 8 - idle, scale: 1.02,
  });
}

/* He backs up as the ball is released, which is both correct and the only
   movement in that half of the picture. */
function drawNonStriker(shirt) {
  const live = (M.phase === 'bat' && Bat.phase === 'flight') ||
               (M.phase === 'bowl' && (Bowl.phase === 'flight' || Bowl.phase === 'result'));
  const back = live ? clamp((M.phase === 'bat' ? Bat.t : Bowl.t) * 1.5, 0, 1) : 0;
  const x = FAR_CREASE_X - 0.3 + back * 1.9;
  Art.shadow(x, NONSTRIKER_Z, 0.4, 0.2);
  const K = M.phase === 'bat' ? myKit() : theirKit();
  drawFigure(x, NONSTRIKER_Z, {
    view: 'side', face: 1, shirt: K.shirt, trim: K.trim, padCol: K.pads,
    capCol: K.cap, skin: K.skin, pads: true, bat: true, cap: 'cap',
    legF: 15 + back * 16, legB: -15 - back * 4,
    armF: 28, armB: 20, batAng: 22, lean: back * 1.2, scale: 0.98,
  });
}

/* One fielder. Standing, chasing, or taking it — and when he is taking it
   his hands go where the ball is, so the catch is a thing that happens
   rather than a caption over a ball still travelling. */
function drawFielder(p, shirt, labels, kit) {
  const x = p.chase ? p.cx : p.x, z = p.chase ? p.cz : p.z;
  const g = proj(x, 0, z);
  if (g.behind || g.d < 3.4 || g.x < -260 || g.x > VW + 260) return;
  Art.shadow(x, z, 0.42, 0.18);

  if (p.taking) {
    // arms up for one over his head, out in front for one at the chest,
    // and he straightens up out of it over the next half second
    const th = now() - p.taking;
    const high = Take.y > 1.5;
    const settle = clamp(th / 0.45, 0, 1);
    const arm = lerp(high ? 158 : 104, high ? 130 : 70, settle);
    drawFigure(x, z, {
      view: 'front', shirt: shirt, cap: 'cap',
      armL: arm, armR: arm,
      legL: p.keeper ? 26 - settle * 12 : 15, legR: p.keeper ? 26 - settle * 12 : 15,
      crouch: p.keeper ? 1.2 * (1 - settle) : 0.3 * (1 - settle),
      lean: 0.5, scale: 0.96,
    });
  } else if (p.keeper) {
    drawFigure(x, z, {
      view: M.phase === 'bat' ? 'front' : 'back', shirt: shirt, cap: 'cap',
      crouch: 2.2, legL: 40, legR: 40, armL: 44, armR: 44, scale: 0.96,
    });
  } else if (p.chase) {
    const cyc = Math.sin(now() * 14) * 28;
    drawFigure(x, z, {
      view: 'front', shirt: shirt, cap: 'cap', lean: 1.4,
      legL: 16 + cyc, legR: 16 - cyc, armL: 30 - cyc * 0.6, armR: 30 + cyc * 0.6, scale: 0.96,
    });
  } else {
    const w = Math.sin(now() * 1.6 + p.a) * 4;
    drawFigure(x, z, {
      view: 'front', shirt: shirt, cap: 'cap',
      legL: 14, legR: 14, armL: 18 + w, armR: 18 - w, scale: 0.96,
    });
  }

  if (labels || p.chase) {
    const size = clamp(15 * g.s * 2.4, 9, 17);
    ctx.globalAlpha = p.flagged ? 0.95 : 0.6;
    Art.text(p.name, g.x, g.y + size + 6, size, p.flagged ? PAL.gold : 'rgba(255,255,255,0.9)', 'center', '700');
    ctx.globalAlpha = 1;
  } else if (p.flagged) {
    const q = proj(x, 2.8, z);
    if (!q.behind) Art.text('!', q.x, q.y, clamp(26 * q.s * 2, 12, 28), PAL.gold);
  }
}

/* Everyone on the field, drawn back to front.

   Painter's order matters now that the camera stands behind the striker:
   the keeper is between the lens and the batter, and a fixed draw order put
   whoever was written last on top regardless of who was actually nearer. So
   each figure is queued with its own distance from the lens and the queue
   is sorted before anything is drawn. */
function sceneActors(theirShirt, labels, fielding) {
  const out = [];
  const add = (x, z, fn) => {
    const p = proj(x, 0, z);
    if (!p.behind && p.d > 1.6) out.push({ d: p.d, fn: fn });
  };
  // The stumps are in the queue too. Painting them first put the keeper —
  // who stands behind them — on top of them from the bowling end, so from
  // your own mark he appeared to be standing in front of the wicket.
  add(0, 0, () => drawStumps(0, false));
  add(PITCH_LEN, 0, () => drawStumps(PITCH_LEN, true));
  for (const p of M.field) {
    // The bowler is normally drawn by his run-up, so he is skipped here —
    // but the moment he is the one taking the catch or chasing the ball he
    // has to be drawn where the ball is, not where his run-up ended. Without
    // this a caught and bowled left the ball hanging in mid-air three metres
    // from a bowler who was standing in his follow-through.
    if (p.bowler && !p.taking && !p.chase) continue;
    add(fx(p), fz(p), () => drawFielder(p, theirShirt, labels, fielding));
  }
  add(UMPIRE_X, UMPIRE_Z, drawUmpire);
  return out;
}

function drawScene() {
  const T = M.level;
  /* Back to front, by how far away each thing actually is: the crowd is
     beyond the rope at R+7, the sightscreen stands at R+4 and the boards are
     on the rope itself. Drawing the crowd last put spectators in front of
     both. */
  drawGround(T, false);
  drawCrowd(T);
  drawSightscreen(T);
  drawBoards(boundaryR());

  const fielding = M.phase === 'bat' ? theirKit() : myKit();
  const theirShirt = fielding.shirt;
  const ourShirt = (M.phase === 'bat' ? myKit() : theirKit()).shirt;
  const labels = M.showNames && (
    (M.phase === 'bowl' && Bowl.phase === 'setup') ||
    (M.phase === 'bat' && (Bat.phase === 'ready' || Bat.phase === 'runup')));
  const actors = sceneActors(theirShirt, labels, fielding);

  const atDepth = (x, z, fn) => {
    const p = proj(x, 0, z);
    actors.push({ d: p.behind ? 999 : p.d, fn: fn });
  };
  // ...and when he is, the run-up figure stands down so there is only one of him
  const bowlerFielding = M.field.some(p => p.bowler && (p.taking || p.chase));

  if (M.phase === 'bat') {
    const style = Bat.bowler ? Bat.bowler.style : STYLES[0];
    if (Bat.marker) drawLengthMarker(Bat.marker.x, Bat.marker.z, PAL.gold, 0.55);
    if (bowlerFielding) {
      /* he is in the actor list already */
    } else if (Bat.phase === 'runup') {
      const q = clamp(Bat.t / Bat.runup, 0, 1);
      atDepth(runupX(q, false), BOWLER_Z, () => drawBowlerRunup(q, theirShirt, style, false));
    } else if (Bat.phase === 'flight') {
      drawBowlerDelivery(1, Bat.t, theirShirt, style, false, atDepth);
    } else {
      atDepth(REACTION_X, REACTION_Z, () => drawBowlerReaction(M.bowlerMood, theirShirt));
    }
    if (Chase.on) actors.push({ d: 12, fn: () => Chase.draw(ourShirt) });
    else {
      actors.push({ d: 60, fn: () => drawNonStriker(ourShirt) });
      actors.push({ d: proj(STRIKER_X, 0, STRIKER_Z).d, fn: drawStriker });
    }
    actors.sort((a, b) => b.d - a.d);
    actors.forEach(a => a.fn());

    if (!Bat.swung && Bat.phase !== 'result') {
      drawShotFan(Bat.zone, Bat.phase === 'ready', screenFromAim(Bat.aim.ang));
    }
    if (Bat.ghost && Bat.phase === 'result') drawGhost(Bat.ghost);
  } else {
    if (Chase.on) actors.push({ d: 12, fn: () => Chase.draw(ourShirt) });
    else {
      actors.push({ d: proj(STRIKER_X, 0, STRIKER_Z).d, fn: drawFacingBatter });
      actors.push({ d: 60, fn: () => drawNonStriker(theirShirt) });
    }
    if (bowlerFielding) {
      /* he is in the actor list already */
    } else if (Bowl.phase === 'runup') {
      const q = clamp(Bowl.t / RUNUP_T, 0, 1);
      atDepth(runupX(q, true), BOWLER_Z, () => drawBowlerRunup(q, fielding.shirt, M.style, true));
    } else if (Bowl.phase === 'flight' || Bowl.phase === 'result') {
      drawBowlerDelivery(Bowl.runFrom, Bowl.t, fielding.shirt, M.style, true, atDepth);
    } else {
      // setting your field: he is back at his mark, not standing on a length
      const t = Bowl.t;
      atDepth(bowlerWaitX(t), BOWLER_Z, () => drawBowlerWaiting(t, fielding.shirt));
    }
    actors.sort((a, b) => b.d - a.d);
    actors.forEach(a => a.fn());

    if (Bowl.phase === 'setup') {
      const band = Bowl.delivery().bouncer ? BOUNCER_BAND : bandFor(Bowl.target.x);
      drawLengthMarker(Bowl.target.x, Bowl.target.z, PAL.gold, 0.55, 0.45, 0.55);
      const a = proj(Bowl.target.x - 0.45, 0.02, Bowl.target.z);
      const b = proj(19.6, 0.02, Bowl.target.z);
      if (!a.behind && !b.behind) {
        ctx.save();
        ctx.strokeStyle = 'rgba(232,185,35,0.75)'; ctx.lineWidth = 3; ctx.setLineDash([12, 10]);
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        ctx.restore();
      }
      const lp = proj(Bowl.target.x, 0.9, Bowl.target.z);
      if (!lp.behind) Art.text(band.label, lp.x, lp.y, 22, PAL.gold);
    }
    if (Bowl.ghost && Bowl.phase === 'result') drawGhost(Bowl.ghost);
  }
  Ball.draw();
}

/* ===================== HUD ===================== */
function meterColour(v) {
  const h = lerp(48, 0, clamp(v, 0, 1) * (v > 0.85 ? 1 : 0.7));
  return 'hsl(' + h + ',85%,' + lerp(48, 58, v) + '%)';
}

function drawMeter(x, y, w, h, v, label, full) {
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = meterColour(v);
  ctx.fillRect(x, y, w * clamp(v, 0, 1), h);
  if (full) {
    const pulse = 0.55 + Math.sin(now() * 9) * 0.45;
    ctx.globalAlpha = pulse;
    ctx.strokeStyle = PAL.white; ctx.lineWidth = 3;
    ctx.strokeRect(x - 2, y - 2, w + 4, h + 4);
    ctx.globalAlpha = 1;
  }
  Art.text(label, x, y - 9, 19, full ? PAL.gold : 'rgba(255,255,255,0.85)', 'left');
}

function shade(x, y, w, h) {
  ctx.fillStyle = 'rgba(0,0,0,0.32)';
  ctx.fillRect(x, y, w, h);
}

/* The scorebar, built the way a 1980s caption generator built one: hard
   rectangles, no rounded corners, no gradients, two flat colours and a rule
   between the cells. The document asks for chunky numerals and no panels;
   a panel is the one thing the period actually requires, so this is a panel
   that behaves like poster type — nothing in it but the score, at a size you
   can read from across the room. */
const BAR = { x: 40, y: 34, h: 46, pad: 14 };

function barCell(x, w, bg, text, size, colour, align) {
  ctx.fillStyle = bg;
  ctx.fillRect(x, BAR.y, w, BAR.h);
  const tx = align === 'left' ? x + BAR.pad : align === 'right' ? x + w - BAR.pad : x + w / 2;
  Art.text(text, tx, BAR.y + BAR.h - 14, size, colour, align || 'center');
  return x + w;
}

function drawScorebar(cells) {
  let x = BAR.x, total = 0;
  cells.forEach(c => { total += c.w; });
  ctx.fillStyle = 'rgba(0,0,0,0.30)';
  ctx.fillRect(BAR.x + 5, BAR.y + 5, total, BAR.h);      // hard drop shadow
  cells.forEach(c => { x = barCell(x, c.w, c.bg, c.t, c.size || 26, c.fg, c.align); });
  ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 2;
  ctx.strokeRect(BAR.x, BAR.y, total, BAR.h);
  let sx = BAR.x;
  cells.slice(0, -1).forEach(c => {
    sx += c.w;
    ctx.beginPath(); ctx.moveTo(sx, BAR.y); ctx.lineTo(sx, BAR.y + BAR.h); ctx.stroke();
  });
}

/* The bar across the bottom of a television picture, which is the only place
   this information has ever belonged: who is batting and what he has made,
   who is at the other end, who is bowling and what it has cost him, and what
   the situation is. It replaces a scorebar in the top corner that named the
   striker and nothing else — you could not see the partnership, you could not
   see the bowler's figures, and while bowling you could not see either
   batsman's name at all. */
const TICKER = { h: 54 };

function tickerCell(x, w, bg, lines) {
  ctx.fillStyle = bg;
  ctx.fillRect(x, VH - TICKER.h, w, TICKER.h);
  ctx.strokeStyle = 'rgba(0,0,0,0.55)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x + w, VH - TICKER.h); ctx.lineTo(x + w, VH); ctx.stroke();
  const pad = 14;
  if (lines.length === 1) {
    const L = lines[0];
    const sz = fitText(L.t, w - pad * 2, L.size || 26, L.weight);
    Art.text(L.t, x + w / 2, VH - TICKER.h / 2 + sz * 0.36, sz, L.col, 'center', L.weight);
  } else {
    lines.forEach((L, i) => {
      const sz = fitText(L.t, w - pad * 2, L.size || 20, L.weight);
      Art.text(L.t, x + pad, VH - TICKER.h + 23 + i * 21, sz, L.col, 'left', L.weight);
    });
  }
  return x + w;
}

/* A batsman's cell: name, runs, balls, and a dot on whoever is on strike. */
function tickerBatter(x, w, c, onStrike) {
  tickerCell(x, w, onStrike ? '#173a63' : '#12294a', [
    { t: (onStrike ? '\u25CF ' : '') + (c ? c.name : '—'), size: 20,
      col: onStrike ? PAL.white : 'rgba(255,255,255,0.80)' },
    { t: c ? c.runs + ' (' + c.balls + ')' : '', size: 19,
      col: onStrike ? PAL.gold : 'rgba(232,185,35,0.75)' },
  ]);
  return x + w;
}

function overStr(balls) { return Math.floor(balls / 6) + '.' + (balls % 6); }

/* What the situation is, in the words a caption generator would use. */
function tickerState(batting) {
  if (M.mode !== 'match') return 'PRACTICE';
  const w = M.bowl, b = M.bat;
  if (!batting && w.target > 0) {
    const need = Math.max(0, w.target - w.runs);
    const left = Math.max(0, w.overs * 6 - w.balls);
    return 'NEED ' + need + ' OFF ' + left;
  }
  if (batting && b.target > 0) {
    const need = Math.max(0, b.target - M.myScore());
    const left = Math.max(0, b.overs * 6 - b.balls);
    return 'NEED ' + need + ' OFF ' + left;
  }
  if (M.format.innings === 2) {
    const ours = Match.ourRuns() + (batting ? M.myScore() : 0);
    const theirs = Match.theirRuns() + (batting ? 0 : w.runs);
    const d = batting ? ours - theirs : theirs - ours;
    const who = batting ? M.us.code : M.oppo.code;
    if (d === 0) return 'SCORES LEVEL';
    return who + (d > 0 ? ' LEAD BY ' + d : ' TRAIL BY ' + (-d));
  }
  const o = batting ? b : w;
  const left = Math.max(0, o.overs * 6 - o.balls);
  return left <= 0 ? 'LAST BALL' : Math.ceil(left / 6) + ' OVERS LEFT';
}

function drawTicker() {
  if (Match.screen !== 'match' && Match.screen !== 'overEnd') return;
  const batting = M.phase === 'bat';
  const b = M.bat, w = M.bowl;
  const side = batting ? M.us : M.oppo;
  const score = batting ? M.myScore() + '-' + Math.min(10, b.wickets)
                        : w.runs + '-' + w.wickets;
  const balls = batting ? b.balls : w.balls;
  const overs = batting ? b.overs : w.overs;
  const strike = batting ? M.striker() : M.theirBatter();
  const other = batting ? (M.myOther >= 0 ? M.myCard[M.myOther] : null) : M.theirPartner();
  // whoever has the ball, with what it has cost him
  const bowler = batting ? Bat.bowler : youAs();
  const bowlSide = batting ? M.oppo : M.us;

  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(0, VH - TICKER.h - 5, VW, 5);

  let x = 0;
  x = tickerCell(x, 92, PAL.maroon, [{ t: side.code, size: 30, col: PAL.gold }]);
  x = tickerCell(x, 150, '#0d1f3a', [{ t: score, size: 34, col: PAL.gold }]);
  x = tickerCell(x, 118, '#12294a', [
    { t: 'OVERS', size: 14, col: 'rgba(255,255,255,0.6)' },
    { t: overStr(balls) + (M.mode === 'match' ? '/' + overs : ''), size: 21, col: PAL.white }]);
  x = tickerCell(x, 214, '#1c3f6e', [{ t: tickerState(batting), size: 21, col: PAL.white }]);
  x = tickerBatter(x, 300, strike, true);
  // With no partner modelled — MY PLAYER, where you are the only one of your
  // side anybody plays — the cell says what the innings is worth instead.
  if (other) x = tickerBatter(x, 240, other, false);
  else {
    const rr = balls > 0 ? ((batting ? M.myScore() : w.runs) / balls * 6).toFixed(1) : '0.0';
    x = tickerCell(x, 240, '#12294a', [
      { t: 'RUN RATE', size: 14, col: 'rgba(255,255,255,0.6)' },
      { t: rr + ' an over', size: 20, col: 'rgba(255,255,255,0.85)' }]);
  }
  const figs = bowler && bowler.balls !== undefined
    ? bowler.wickets + '-' + bowler.runs + '  (' + overStr(bowler.balls) + ')' : '';
  tickerCell(x, VW - x, '#12294a', [
    { t: bowlSide.code + '   ' + (bowler ? bowler.name : ''), size: 19, col: PAL.white },
    { t: figs, size: 19, col: PAL.gold }]);

  ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 2;
  ctx.strokeRect(0, VH - TICKER.h, VW, TICKER.h);
}

/* ===================== THE FIELD, FROM ABOVE =====================
   A ground has eleven men on it and from behind the batter you can see about
   four of them. The radar is the missing half of the picture: where the gaps
   are while you are batting, and where you have put everybody while you are
   bowling. Same projection both ways — the striker at the bottom, the bowler
   at the top, the off side to the right, which is exactly how the main camera
   already reads, so the two agree without anybody having to translate. */
const RADAR = { r: 82, cx: 0, cy: 0 };

/* World to radar. The centre of the circle is the middle of the pitch, which
   is also what the boundary is measured from. */
function radarPt(wx, wz, cx, cy, rr) {
  const s = rr / boundaryR();
  return { x: cx + wz * s, y: cy + (wx - PITCH_LEN / 2) * s };
}
/* And back, for dragging a man to where your thumb is. */
function radarWorld(px, py, cx, cy, rr) {
  const s = rr / boundaryR();
  return { x: (py - cy) / s + PITCH_LEN / 2, z: (px - cx) / s };
}

function drawRadar(cx, cy, rr, opts) {
  opts = opts || {};
  const R = boundaryR();
  ctx.save();
  // the ground
  ctx.beginPath(); ctx.arc(cx, cy, rr, 0, TAU);
  ctx.fillStyle = 'rgba(20,32,20,0.86)'; ctx.fill();
  ctx.strokeStyle = PAL.white; ctx.lineWidth = 2; ctx.stroke();
  // the thirty-yard ring
  ctx.beginPath(); ctx.arc(cx, cy, rr * 27.4 / R, 0, TAU);
  ctx.strokeStyle = 'rgba(255,255,255,0.32)'; ctx.lineWidth = 1.5;
  ctx.setLineDash([5, 5]); ctx.stroke(); ctx.setLineDash([]);
  // the pitch, running up the middle
  const a = radarPt(0, 0, cx, cy, rr), b = radarPt(PITCH_LEN, 0, cx, cy, rr);
  const pw = Math.max(3, rr * 3.0 / R);
  ctx.fillStyle = 'rgba(201,168,106,0.85)';
  ctx.fillRect(cx - pw / 2, a.y, pw, b.y - a.y);

  const dot = (p, col, size, ring) => {
    ctx.beginPath(); ctx.arc(p.x, p.y, size, 0, TAU);
    ctx.fillStyle = col; ctx.fill();
    if (ring) { ctx.strokeStyle = ring; ctx.lineWidth = 2.5; ctx.stroke(); }
  };
  // the two batsmen and the bowler's mark, for orientation
  dot(radarPt(CONTACT_X, 0, cx, cy, rr), PAL.white, Math.max(2.5, rr * 0.045));
  dot(radarPt(FAR_CREASE_X, 0, cx, cy, rr), 'rgba(242,236,220,0.55)', Math.max(2, rr * 0.035));

  (M.field || []).forEach(f => {
    const p = radarPt(f.hx, f.hz, cx, cy, rr);
    const sel = opts.selected === f;
    const col = f.keeper ? '#9fd2ff' : f.bowler ? 'rgba(232,185,35,0.7)'
              : f.flagged ? PAL.gold : PAL.maroonLite;
    dot(p, col, Math.max(2.6, rr * (sel ? 0.062 : 0.048)), sel ? PAL.gold : null);
    if (opts.names) {
      Art.text(f.name, p.x, p.y - rr * 0.075, Math.max(9, rr * 0.052),
               sel ? PAL.gold : 'rgba(255,255,255,0.7)', 'center', '700');
    }
  });
  ctx.restore();
}

function drawHUD() {
  ctx.save();
  drawTicker();
  // The field, from above, in the same corner in both innings.
  RADAR.cx = VW - RADAR.r - 34; RADAR.cy = RADAR.r + 44;
  drawRadar(RADAR.cx, RADAR.cy, RADAR.r);
  if (M.phase === 'bat') {
    drawMeter(40, 58, 300, 20, M.swagger, 'SWAGGER', M.swagger >= 0.999);
    if (M.swagger >= 0.999) Art.text('HOLD FOR THE FLOURISH', 40, 102, 17, PAL.gold, 'left');
    if (Bat.bowler) {
      Art.text(Bat.bowler.style.name, RADAR.cx, RADAR.cy + RADAR.r + 22, 17, PAL.gold);
    }
  } else {
    Art.text(M.style.name, 40, 58, 22, PAL.white, 'left');
    Art.text('BATTER', 40, 84, 15, 'rgba(255,255,255,0.75)', 'left');

/* ===================== THE BROADCAST PASS =====================
   Everything above is drawn clean; this puts it through a 1983 outside
   broadcast on the way out. Scanlines from a four-pixel pattern built once,
   a soft vignette, and a warm cast over the whole frame. Kept deliberately
   light — the point is that it reads as period, not that it reads as broken,
   and every one of these is a veil over the thing you are trying to time. */
const CRT = { lines: null, vign: null };

function crtPattern() {
  if (CRT.lines !== null) return CRT.lines;
  try {
    const c = document.createElement('canvas');
    c.width = 1; c.height = 4;
    const g = c.getContext('2d');
    g.fillStyle = 'rgba(0,0,0,0.10)'; g.fillRect(0, 0, 1, 1);
    g.fillStyle = 'rgba(0,0,0,0.04)'; g.fillRect(0, 1, 1, 1);
    CRT.lines = ctx.createPattern(c, 'repeat') || false;
  } catch (e) { CRT.lines = false; }     // no scanlines is fine; a crash is not
  return CRT.lines;
}

function drawBroadcast() {
  const p = crtPattern();
  if (p) { ctx.fillStyle = p; ctx.fillRect(0, 0, VW, VH); }

  if (!CRT.vign) {
    CRT.vign = ctx.createRadialGradient(VW / 2, VH / 2, VH * 0.42, VW / 2, VH / 2, VH * 0.92);
    CRT.vign.addColorStop(0, 'rgba(0,0,0,0)');
    CRT.vign.addColorStop(1, 'rgba(8,6,14,0.34)');
  }
  ctx.fillStyle = CRT.vign;
  ctx.fillRect(0, 0, VW, VH);

  ctx.globalAlpha = 0.05;                // the warm cast of the tape
  ctx.fillStyle = '#e8a03a';
  ctx.fillRect(0, 0, VW, VH);
  ctx.globalAlpha = 1;
}

const UI = { hits: [], rotateDismissed: false };
/* Type that fits its box. The old version guessed a size from the character
   count, which overflowed on anything long — so it measures instead, shrinks
   until it fits with a margin, and only then draws. */
function fitText(str, maxW, want, weight) {
  let size = want;
  ctx.font = (weight || '900') + ' ' + size + 'px "Arial Black", Impact, sans-serif';
  let w = ctx.measureText(str).width;
  if (w > maxW && w > 0) {
    size = Math.max(9, Math.floor(size * maxW / w));
    ctx.font = (weight || '900') + ' ' + size + 'px "Arial Black", Impact, sans-serif';
  }
  return size;
}

function uiBtn(x, y, w, h, label, sub, hot, id) {
  UI.hits.push({ x: x, y: y, w: w, h: h, id: id || label });
  ctx.fillStyle = hot ? PAL.gold : 'rgba(0,0,0,0.45)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = hot ? PAL.gold : PAL.white; ctx.lineWidth = 3;
  ctx.strokeRect(x, y, w, h);
  const pad = 18;
  const ls = fitText(label, w - pad * 2, Math.min(28, h * (sub ? 0.40 : 0.52)));
  Art.text(label, x + w / 2, y + (sub ? h * 0.46 : h / 2 + ls * 0.36), ls, hot ? PAL.ink : PAL.white);
  if (sub) {
    const ss = fitText(sub, w - pad * 2, 15, '700');
    Art.text(sub, x + w / 2, y + h * 0.76, ss,
             hot ? 'rgba(0,0,0,0.72)' : 'rgba(255,255,255,0.72)', 'center', '700');
  }
  return id || label;
}
function uiTake() {
  const t = Input.takeTap();
  if (!t) return null;
  for (const h of UI.hits) {
    if (t.x > h.x && t.x < h.x + h.w && t.y > h.y && t.y < h.y + h.h) return h.id;
  }
  return '__miss__';
}
function stripes() {

/* ===================== TYPING =====================
   A canvas game has no text field, and a phone has no keyboard until
   something asks for one. Rather than depend on a hidden DOM input — which
   iOS will not focus outside a real gesture handler, so the keyboard never
   comes up — the letters are on screen, and a physical keyboard drives the
   same buffer for anyone who has one. Works the same everywhere. */
const Typing = {
  on: false, value: '', max: 16, title: '', done: null,
  rows: ['ABCDEFGHI', 'JKLMNOPQR', 'STUVWXYZ.'],

  start(initial, title, done) {
    this.on = true; this.value = this.clean(initial || '');
    this.title = title || 'NAME'; this.done = done || null;
    Match.screen = 'typing';
  },
  clean(t) {
    return String(t).toUpperCase().replace(/[^A-Z0-9 .'-]/g, '').slice(0, this.max);
  },
  put(ch) { this.value = this.clean(this.value + ch); },
  back() { this.value = this.value.slice(0, -1); },
  finish(commit) {
    this.on = false;
    const v = this.value.trim();
    if (commit && this.done) this.done(v);
    Match.screen = 'player';
  },
  /* A physical keyboard, for whoever has one. */
  key(e) {
    if (e.key === 'Enter') { this.finish(true); return; }
    if (e.key === 'Escape') { this.finish(false); return; }
    if (e.key === 'Backspace') { this.back(); return; }
    if (e.key && e.key.length === 1) this.put(e.key);
  },
};

/* ===================== SETTING A FIELD =====================
   Nine men you can put where you like, on the same radar the HUD draws. Drag
   one and he stays there for the rest of the innings — his home moves, so the
   fielding model, the catch model and the run model all read the new position
   without knowing anything about this screen. The keeper and the bowler are
   not draggable: one stands behind the stumps and the other is wherever his
   follow-through leaves him. */
const Field = {
  sel: null, drag: null, note: '', noteT: 0, r: 236, cx: 0, cy: 0,

  open() { this.sel = null; this.drag = null; this.note = ''; },
  say(t) { this.note = t; this.noteT = now(); },

  movable(f) { return f && !f.keeper && !f.bowler; },

  /* Put a man down, if the law lets you. */
  place(f, wx, wz) {
    const R = boundaryR();
    const d = Math.hypot(wx - PITCH_LEN / 2, wz);
    // inside the rope, and not standing on the pitch with the batsman
    const lim = Math.min(d, R - 1.5);
    const k = d > 0.001 ? lim / d : 0;
    let nx = PITCH_LEN / 2 + (wx - PITCH_LEN / 2) * k, nz = wz * k;
    if (Math.hypot(nx - CONTACT_X, nz) < 5.5) {
      const a = Math.atan2(nz, nx - CONTACT_X);
      nx = CONTACT_X + Math.cos(a) * 5.5; nz = Math.sin(a) * 5.5;
    }
    const ox = f.x, oz = f.z;
    f.x = nx; f.z = nz; f.hx = nx; f.hz = nz;
    if (legSideCount(M.field) > LEG_SIDE_CAP) {
      f.x = ox; f.z = oz; f.hx = ox; f.hz = oz;
      this.say('ONLY ' + LEG_SIDE_CAP + ' BEHIND SQUARE ON THE LEG SIDE');
      return false;
    }
    const spot = nameForSpot(nx, nz);
    f.key = spot.key; f.name = spot.name;
    return true;
  },

  preset(key) {
    // A new field is a new set of objects, so anything holding on to one of
    // the old men has to let go of it.
    Catcher.clear(); Chase.stop();
    M.field = buildField(M.level, null, key);
    this.sel = null;
    const set = FIELD_SETS.find(s => s.key === key);
    this.say(set ? set.name + ' SET' : '');
  },
};

function drawFieldScreen() {
  drawScene();
  ctx.fillStyle = 'rgba(8,10,16,0.80)'; ctx.fillRect(0, 0, VW, VH);
  const cx = Field.cx = VW * 0.34, cy = Field.cy = VH * 0.53, rr = Field.r;

  Art.text('SET THE FIELD', VW / 2, 62, 40, PAL.white);
  Art.text('DRAG A FIELDER. THE KEEPER AND THE BOWLER STAY WHERE THEY ARE.',
           VW / 2, 92, 16, 'rgba(255,255,255,0.65)');

  // dragging
  const p = { x: Input.x, y: Input.y };
  if (Input.down) {
    if (!Field.drag) {
      let best = null, bd = 34;
      (M.field || []).forEach(f => {
        if (!Field.movable(f)) return;
        const q = radarPt(f.hx, f.hz, cx, cy, rr);
        const d = Math.hypot(q.x - p.x, q.y - p.y);
        if (d < bd) { bd = d; best = f; }
      });
      if (best) { Field.drag = best; Field.sel = best; }
    }
    if (Field.drag) {
      const w = radarWorld(p.x, p.y, cx, cy, rr);
      Field.place(Field.drag, w.x, w.z);
    }
  } else { Field.drag = null; }

  drawRadar(cx, cy, rr, { names: true, selected: Field.sel });

  // which way is which, so the radar is readable without a legend
  Art.text('OFF SIDE', cx + rr - 6, cy - 8, 14, 'rgba(255,255,255,0.45)', 'right');
  Art.text('LEG SIDE', cx - rr + 6, cy - 8, 14, 'rgba(255,255,255,0.45)', 'left');
  Art.text('BOWLER', cx, cy - rr - 10, 14, 'rgba(255,255,255,0.5)');
  Art.text('STRIKER', cx, cy + rr + 22, 14, 'rgba(255,255,255,0.5)');

  const x = VW * 0.68, w = 380;
  Art.text('A SET FIELD', x + w / 2, 168, 18, 'rgba(255,255,255,0.7)');
  FIELD_SETS.forEach((set, i) => {
    uiBtn(x, 182 + i * 84, w, 72, set.name, set.blurb, false, 'SET' + set.key);
  });
  const leg = legSideCount(M.field);
  Art.text('BEHIND SQUARE ON THE LEG SIDE:  ' + leg + ' of ' + LEG_SIDE_CAP,
           x + w / 2, 470, 17, leg > LEG_SIDE_CAP ? '#d0483f' : 'rgba(255,255,255,0.75)',
           'center', '700');
  if (Field.note && now() - Field.noteT < 2.2) {
    Art.text(Field.note, x + w / 2, 500, 17, PAL.gold, 'center', '700');
  }
  if (Field.sel) {
    Art.text(Field.sel.name, x + w / 2, 534, 26, PAL.gold);
  }

  uiBtn(x, VH - 132, w, 62, 'BOWL', null, true, 'FDONE');

  const id = uiTake();
  if (!id) return;
  if (id === 'FDONE') { Match.screen = 'match'; Input.flush(); }
  else if (id.indexOf('SET') === 0) Field.preset(id.slice(3));
}

/* The rest of the innings compresses — never a wall of numbers. The same
   screen serves the change of innings in a Test, where nothing is simmed
   and there is no total to defend yet, so it says what actually happened. */
function drawBreak(dt) {
  Match.breakT += dt;
  const last = M.log[M.log.length - 1] || { runs: 0, wickets: 0, card: [] };
  const toBat = Match.simTarget < 0;              // your second innings is next
  if (!toBat) {
    Match.simShown = Math.min(Match.simTarget,
      Match.simShown + Math.max(1, (Match.simTarget - Match.simShown) * dt * 1.6));
  }
  ctx.fillStyle = PAL.ink; ctx.fillRect(0, 0, VW, VH);

  if (toBat) {
    Art.text(M.oppo.name + '  ' + last.runs + '-' + last.wickets, VW / 2, 150, 46, PAL.white);
    const lead = Match.ourRuns() - Match.theirRuns();
    Art.text(lead >= 0 ? M.us.name + ' LEAD BY ' + lead
                       : M.us.name + ' TRAIL BY ' + (-lead),
             VW / 2, 214, 30, PAL.gold);
    Art.text('SECOND INNINGS', VW / 2, 300, 26, 'rgba(255,255,255,0.7)');
    Art.text('YOU BAT AGAIN', VW / 2, 366, 54, PAL.white);
    if (Match.breakT > 1.2) {
      uiBtn(VW / 2 - 190, 470, 380, 74, 'TAKE GUARD', M.format.overs + ' overs');
      if (uiTake() === 'TAKE GUARD') {
        Match.screen = 'match'; Snd.mode = 'bat';
        Bat.lastBackliftZone = -1; Bat.nextBall(); Cam.home(true);
      }
    }
    return;
  }

  const mine = last.card.find(c => c.you) || { runs: 0, balls: 0, how: 'dnb' };
  const whole = M.playAs.key === 'team';
  Art.text(whole ? M.us.name + ' — ' + (M.inns === 2 ? 'SECOND INNINGS' : 'FIRST INNINGS')
                 : 'YOUR INNINGS',
           VW / 2, 128, 28, 'rgba(255,255,255,0.7)');
  Art.text(mine.how === 'dnb' ? 'DID NOT BAT'
           : mine.runs + ' (' + mine.balls + ')  ' + (mine.out ? mine.how : 'not out'),
           VW / 2, 200, 54, PAL.gold);
  Art.text(M.bat.fours + ' FOURS   ·   ' + M.bat.sixes + ' SIXES',
           VW / 2, 240, 21, 'rgba(255,255,255,0.75)');
  Art.text(M.us.name + '  ' + (last.wickets >= 10 ? 'ALL OUT' : last.wickets + ' DOWN'),
           VW / 2, 322, 24, 'rgba(255,255,255,0.7)');
  Art.text(String(Math.round(Match.simShown)), VW / 2, 392, 60, PAL.white);
  const tgt = Match.theirTarget();
  Art.text(M.playAs.key === 'team' ? 'YOU HAVE THE BALL — ALL ' + M.format.overs + ' OVERS'
                                  : 'YOU OPEN THE BOWLING — ' + M.style.name,
           VW / 2, 448, 21, PAL.gold);
  if (Match.breakT > 1.6) {
    uiBtn(VW / 2 - 190, 492, 380, 74, 'TAKE THE BALL',
          tgt > 0 ? 'defend ' + tgt : 'bowl them out');
    if (uiTake() === 'TAKE THE BALL') Match.startBowling();
  }
}

   changes, and running straight on made a five-over innings one long ball. */

  Match.overT += dt;
  drawScene();
  drawBroadcast();
  ctx.fillStyle = 'rgba(8,10,16,0.72)'; ctx.fillRect(0, 0, VW, VH);
  const b = M.bat;

  Art.text('END OF THE OVER', VW / 2, 150, 46, PAL.white);
  Art.text(over + ' of ' + b.overs + '   ·   ' + b.overRuns +

}

/* Your spell is done and the innings is not. It used to cut to the result;
   it now runs the remaining overs past you one at a time, so a chase that
   went to the last over reads like one. */
function drawRunOut(dt) {
  const R = Match.runOut;
  R.t += dt;
  while (R.shown < R.overs.length && R.t > 0.30 + R.shown * 0.30) R.shown++;
  ctx.fillStyle = PAL.ink; ctx.fillRect(0, 0, VW, VH);
  Art.text('THE REST OF THE INNINGS', VW / 2, 74, 30, 'rgba(255,255,255,0.7)');
  Art.text(M.oppo.name, VW / 2, 118, 26, PAL.gold);
  const rows = R.overs.slice(0, R.shown);
  const top = 160, rowH = 38;
  const shown = rows.slice(-11);
  shown.forEach((o, i) => {
    const y = top + i * rowH;
    ctx.fillStyle = i % 2 ? 'rgba(255,255,255,0.05)' : 'rgba(255,255,255,0.02)';
    ctx.fillRect(VW / 2 - 420, y, 840, rowH - 4);
    Art.text('OV ' + o.over, VW / 2 - 404, y + 26, 19, 'rgba(255,255,255,0.6)', 'left');
    Art.text(o.who, VW / 2 - 330, y + 26, 20, PAL.white, 'left');
    Art.text(o.runs + (o.wickets ? '   ·   ' + o.wickets + ' WKT' : ''),
             VW / 2 + 150, y + 26, 20, o.wickets ? PAL.gold : 'rgba(255,255,255,0.8)', 'right');
    Art.text(o.at, VW / 2 + 404, y + 26, 22, PAL.gold, 'right');
  });
  if (R.shown >= R.overs.length) {
    uiBtn(VW / 2 - 180, VH - 84, 360, 66, 'SEE IT OUT', null, true);
    if (uiTake() === 'SEE IT OUT') Match.endTheirInnings();
  } else if (Input.takeTap()) {
    R.shown = R.overs.length;
  }
}

/* ===================== SCORECARD ===================== */
function cardRow(c, x, y, w, you) {
  const col = you ? PAL.gold : PAL.white;
  const nameW = w * 0.36;
  const ns = fitText(c.name + (you ? '  *' : ''), nameW, 19);
  Art.text(c.name + (you ? '  *' : ''), x + 12, y + 20, ns, col, 'left');
  // how he went, which is the half of a card people actually read
  const how = c.how === 'dnb' ? '' : c.out ? c.how : 'not out';
  const hs = fitText(how, w * 0.44, 15, '700');
  Art.text(how, x + nameW + 18, y + 20, hs,
           c.out ? 'rgba(255,255,255,0.62)' : 'rgba(120,220,150,0.75)', 'left', '700');
  Art.text(c.how === 'dnb' ? '—' : String(c.runs), x + w - 74, y + 20, 20, col, 'right');
  Art.text(c.how === 'dnb' ? '' : '(' + c.balls + ')', x + w - 12, y + 20, 16,
           'rgba(255,255,255,0.6)', 'right');
}

function drawScorecard() {
  ctx.fillStyle = PAL.ink; ctx.fillRect(0, 0, VW, VH);
  Art.text(M.ground + '   ·   ' + M.format.name + '   ·   ' + M.light.name,
           VW / 2, 46, 22, PAL.gold);

  /* A Test is four innings and a screen this size holds two, so the pairs
     get a tab each rather than a wall of numbers nobody can read. */
  const ours = M.log.filter(e => e.side === 'us');
  const theirs = M.log.filter(e => e.side === 'them');
  const pairs = Math.max(1, Math.max(ours.length, theirs.length));
  Match.cardInns = clamp(Match.cardInns, 0, pairs - 1);
  const n = Match.cardInns;
  const us = ours[n] || { card: M.myCard, runs: M.bat.teamRuns, wickets: M.bat.wickets,
                          extras: M.bat.extras, balls: M.bat.balls };
  const them = theirs[n] || { card: M.theirCard, runs: M.bowl.runs, wickets: M.bowl.wickets,
                              extras: M.bowl.extras, balls: M.bowl.balls };
  let top = 74;
  if (pairs > 1) {
    for (let i = 0; i < pairs; i++) {
      uiBtn(VW / 2 - pairs * 92 + i * 184, 66, 176, 40,
            (i === 0 ? '1ST' : '2ND') + ' INNINGS', null, i === n, 'INN' + i);
    }
    top = 116;
  }

  const colW = 596, left = VW / 2 - colW - 14, right = VW / 2 + 14;
  const oversOf = e => Math.floor(e.balls / 6) + '.' + (e.balls % 6);
  const head = (x, title, score) => {
    ctx.fillStyle = '#12294a'; ctx.fillRect(x, top, colW, 40);
    Art.text(title, x + 12, top + 27, 20, PAL.white, 'left');
    Art.text(score, x + colW - 12, top + 27, 23, PAL.gold, 'right');
  };
  head(left, M.us.name, us.runs + '-' + Math.min(10, us.wickets) + ' (' + oversOf(us) + ')');
  head(right, M.oppo.name, them.runs + '-' + them.wickets + ' (' + oversOf(them) + ')');

  const rowY = i => top + 48 + i * 28;
  const column = (card, x) => {
    card.forEach((c, i) => {
      const y = rowY(i);
      if (i % 2) { ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.fillRect(x, y, colW, 26); }
      cardRow(c, x, y, colW, !!c.you);
    });
  };
  column(us.card, left);
  column(them.card, right);
  // extras, because a card without them does not add up
  const ey = rowY(11) + 18;
  Art.text('EXTRAS', left + 12, ey, 16, 'rgba(255,255,255,0.55)', 'left');
  Art.text(String(us.extras || 0), left + colW - 74, ey, 18, PAL.white, 'right');
  Art.text('EXTRAS', right + 12, ey, 16, 'rgba(255,255,255,0.55)', 'left');
  Art.text(String(them.extras || 0), right + colW - 74, ey, 18, PAL.white, 'right');

  // your own two lines, pulled out, over however many innings you played
  const mine = Match.myInnings();
  const w = M.bowl;
  ctx.fillStyle = '#1c3f6e'; ctx.fillRect(left, 512, colW * 2 + 28, 48);
  Art.text('YOU', left + 14, 542, 21, PAL.white, 'left');
  Art.text('BATTING  ' + (mine.balls === 0 ? 'DNB' : mine.runs + ' (' + mine.balls + ')'),
           left + 120, 542, 21, PAL.gold, 'left');
  const me = M.myAttack[0];
  const mov = Math.floor(me.balls / 6) + (me.balls % 6 ? '.' + (me.balls % 6) : '');
  Art.text('BOWLING  ' + (me.balls === 0 ? '—' : mov + '-0-' + me.runs + '-' + me.wickets),
           left + 470, 542, 21, PAL.gold, 'left');
  Art.text(M.style.name, left + colW * 2 + 14, 542, 17, 'rgba(255,255,255,0.7)', 'right');

  Art.text('THEIR ATTACK', VW / 2, 584, 16, 'rgba(255,255,255,0.6)');
  M.attack.forEach((a, i) => {
    const x = left + i * (colW * 2 + 28) / 4;
    Art.text(a.name, x + 10, 608, 17, PAL.white, 'left');
    Art.text(a.style.name, x + 10, 625, 13, 'rgba(255,255,255,0.55)', 'left');
    const aov = Math.floor(a.balls / 6) + (a.balls % 6 ? '.' + (a.balls % 6) : '');
    Art.text(a.balls ? aov + '-0-' + a.runs + '-' + a.wickets : '—',
             x + (colW * 2 + 28) / 4 - 20, 617, 18, PAL.gold, 'right');
  });

  uiBtn(VW / 2 - 320, VH - 60, 300, 48, 'PLAY AGAIN', null, true);
  uiBtn(VW / 2 + 20, VH - 60, 300, 48, 'MENU');
  const id = uiTake();
  if (id === 'PLAY AGAIN') Match.toGear(Match.level, M.mode);
  else if (id === 'MENU') { Match.screen = 'menu'; Snd.intensity = 0; }
  else if (id && id.indexOf('INN') === 0) Match.cardInns = +id.slice(3);
}

   and is where the detail lives. */

  ctx.fillStyle = PAL.ink; ctx.fillRect(0, 0, VW, VH);

  }
  Art.text(b.balls === 0 ? 'DNB' : b.runs + ' (' + b.balls + ')', VW / 2, 292, 66, PAL.gold);
  Art.text(M.bat.fours + 'x4   ' + M.bat.sixes + 'x6', VW / 2, 328, 20, 'rgba(255,255,255,0.7)');

    Art.text('NUMBER ' + (Match.boardPlace + 1) + ' ON YOUR BOARD', VW / 2, 372, 26, PAL.gold);

  uiBtn(VW / 2 + 170, 516, 300, 74, 'MENU');
  const id = uiTake();
  if (id === 'SCORECARD') Match.screen = 'card';
  else if (id === 'PLAY AGAIN') Match.toGear(Match.level, M.mode);
  else if (id === 'MENU') { Match.screen = 'menu'; Snd.intensity = 0; }
}

/* ===================== LOOP ===================== */
let canvas, last = 0, scale = 1, offX = 0, offY = 0;

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  scale = Math.min(w / VW, h / VH);
  offX = (w - VW * scale) / 2;
  offY = (h - VH * scale) / 2;
  canvas._dpr = dpr;
  document.getElementById('rotate').classList.toggle('on', h > w * 1.05 && !UI.rotateDismissed);
}

function frame(ts) {
  requestAnimationFrame(frame);
  const t = ts / 1000;
  let dt = last ? Math.min(0.05, t - last) : 0.016;
  last = t;

  Snd.tick();
  if (M.hitstop > 0) { M.hitstop -= dt; dt = 0; }   // contact is the reward
  Cam.update(dt);
  Stumps.update(dt);

  if (Match.screen === 'match') {
    if (M.phase === 'bat') { Snd.intensity = M.swagger; Bat.update(dt); }
    else Bowl.update(dt);
  }

  const d = canvas._dpr;
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.fillStyle = '#14060a';
  ctx.fillRect(0, 0, canvas.width / d, canvas.height / d);
  ctx.save();
  ctx.translate(offX, offY);
  ctx.scale(scale, scale);
  ctx.beginPath(); ctx.rect(0, 0, VW, VH); ctx.clip();
  UI.hits.length = 0;

  if (Match.screen === 'menu') drawMenu();
  else if (Match.screen === 'player') drawPlayerScreen();
  else if (Match.screen === 'typing') drawTypingScreen(dt);
  else if (Match.screen === 'board') drawBoardScreen();
  else if (Match.screen === 'gear') drawGear();
  else if (Match.screen === 'break') drawBreak(dt);
  else if (Match.screen === 'result') drawResult();
  else if (Match.screen === 'card') drawScorecard();
  else if (Match.screen === 'overs') drawOversScreen();
  else if (Match.screen === 'overEnd') drawOverEnd(dt);
  else if (Match.screen === 'field') drawFieldScreen();
  else if (Match.screen === 'runout') drawRunOut(dt);
  else if (Match.screen === 'intro') drawIntro(dt);
  else {
    drawScene();
    if (M.flash > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + (M.flash * 0.35) + ')';
      ctx.fillRect(0, 0, VW, VH);
      M.flash = Math.max(0, M.flash - dt * 6);
    }
    drawBroadcast();                     // the picture, before the graphics
    drawPowerMeter();
    drawBowlUI();
    drawHUD();
    drawBanner();
    Input.taps.length = 0;               // gameplay reads presses, not taps
  }
  ctx.restore();
}

/* ===================== BOOT ===================== */
function boot() {
  canvas = document.getElementById('game');
  ctx = canvas.getContext('2d');
  Save.load();
  Save.applyChoices();
  Portal.init();
  Portal.loadStart();
  Input.init(canvas);
  M.reset(LEVELS[0], 'match');
  Cam.home(true);
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));
  document.getElementById('rotate').addEventListener('click', () => {
    UI.rotateDismissed = true;
    document.getElementById('rotate').classList.remove('on');
  });
  Portal.loadStop();
  requestAnimationFrame(frame);
}
boot();
</script>
