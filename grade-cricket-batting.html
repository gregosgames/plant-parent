<style>
  /* ===================== SHELL ===================== */

<div id="rotate"><div class="phone"></div>ROTATE YOUR DEVICE<small>tap to play anyway</small></div>
<script>
'use strict';
/* ===========================================================
   GRADE CRICKET — core batting & bowling vertical slice.

   Two mechanics carry the whole game: SWAGGER when batting and
   HOSTILITY when bowling. Everything here exists to make one ball
   fun; the career scaffolding lives in docs/GRADE-CRICKET-DESIGN.md.

   The camera sits behind the batter looking down the pitch, so the
   ball comes at you and length is read by watching it grow. Bowling
   is one drag and one tap. Six bowling styles, real fielding
   positions, and runs are earned by beating the field rather than
   handed out by a lookup table.

   No build step, no external requests, no asset files — the art is
   drawn and the audio is synthesised, so the whole game is this file.
   =========================================================== */

/* ===================== BUILD =====================
   One source, two games. The full build is bat and bowl; the batting-only
   build is the same file with this flag flipped, which drops the bowling half
   and turns every match into a chase — you are set a total and you go and get
   it. `tools/build-batting.py` does the flipping and writes the second file,
   so there is still no build step to run the game itself: both outputs are
   self-contained HTML you can open. */
const BAT_ONLY = true;

/* ===================== WORLD CONSTANTS ===================== */
const VW = 1280, VH = 720;              // logical canvas, letterboxed to fit
const G = 9.81;
const TAU = Math.PI * 2;
const PITCH_LEN = 20.12;                // stumps at x=0 (bowler) and x=20.12
const PITCH_HALF_W = 1.52;
const STUMP_H = 0.71, STUMP_HALF_W = 0.115;
const RELEASE_X = 1.40, RELEASE_Y = 2.05;
const CONTACT_X = 19.30;                // where a bat meets a ball
const CREASE_X = 18.90;                 // striker's popping crease
const FAR_CREASE_X = PITCH_LEN - CREASE_X;
const BOUNDARY = 56;                    // metres from the middle of the pitch

/* Length bands. `px` is where the ball pitches, `rest` how much of its
   downward speed survives the bounce — that pairing is what makes a short
   ball climb and a yorker stay under the bat. */
const BANDS = [
  { key: 'short',  label: 'SHORT',  px: 12.6, rest: 0.76 },
  { key: 'back',   label: 'BACK',   px: 14.9, rest: 0.69 },
  { key: 'good',   label: 'GOOD',   px: 16.4, rest: 0.62 },
  { key: 'full',   label: 'FULL',   px: 18.4, rest: 0.52 },
  { key: 'yorker', label: 'YORKER', px: 19.5, rest: 0.45 },
];
const BOUNCER_BAND = { key: 'bouncer', label: 'BOUNCER', px: 11.0, rest: 0.88 };
function bandFor(px) {
  let best = BANDS[0], bd = 99;
  for (const b of BANDS) { const d = Math.abs(b.px - px); if (d < bd) { bd = d; best = b; } }
  return px < 11.9 ? BOUNCER_BAND : best;
}

/* The six shot zones of the fan.

   `ang` is the world angle in degrees from straight down the ground:
   negative is off side, positive is leg. `sdeg` is where that zone sits on
   screen, clockwise from straight up — the camera is behind the batter, so
   the off side is to the right and the leg side to the left, and the fan is
   drawn and read in those terms with no camera maths in the way.

   `likeH` / `likeLen` are the balls the shot is *for* — playing the right
   shot to the right ball widens the window, and that is where the depth
   lives. */
const SHOTS = [
  { name: 'CUT',      ang: -104, sdeg:  120, reachZ:  0.58, likeH: [0.65, 2.0], likeLen: ['short', 'back', 'bouncer'], power: 0.92, lift: 0.18 },
  { name: 'COVER',    ang: -52,  sdeg:   62, reachZ:  0.30, likeH: [0.0, 0.85], likeLen: ['full', 'good'],             power: 1.00, lift: 0.15 },
  { name: 'STRAIGHT', ang: -4,   sdeg:    4, reachZ:  0.02, likeH: [0.0, 1.0],  likeLen: ['full', 'yorker', 'good'],   power: 1.06, lift: 0.22 },
  { name: 'WHIP',     ang: 48,   sdeg:  -54, reachZ: -0.14, likeH: [0.05, 1.1], likeLen: ['full', 'good', 'back'],     power: 0.96, lift: 0.20 },
  { name: 'PULL',     ang: 96,   sdeg: -102, reachZ: -0.24, likeH: [0.7, 2.2],  likeLen: ['short', 'bouncer', 'back'], power: 1.12, lift: 0.30 },
  { name: 'GLANCE',   ang: 141,  sdeg: -150, reachZ: -0.40, likeH: [0.0, 1.3],  likeLen: ['full', 'yorker', 'good'],   power: 0.68, lift: 0.09 },
];

/* Shot animation, one entry per zone.

   `lift`, `contact` and `finish` are bat angles in the frame the rig uses —
   degrees from straight down, positive toward screen right. The swing always
   rotates the same way, from a high pick-up down through the line and out the
   other side, because that is the direction a right-hander's bat actually
   travels; only where it stops differs. A cut is a quarter turn that dies at
   waist height, a straight drive is most of a half turn finishing above the
   shoulder, and the difference between them is the whole read.

   The house style is the idiom in §1: a very high pick-up, the bat coming
   down from over the shoulder rather than from behind the pad, weight going
   through the ball, and a follow-through that is allowed to finish and then
   be held. `hold` is how long he stays in it — the drives hold longest,
   because that is the shot worth looking at. Archetype, not portrait: what
   is lifted is the shape of the movement and nothing else.

   `back` is a back-foot shot: he rocks back and drops, rather than striding
   into it. */
const SHOT_ANIM = [
  // CUT — rocks back and across, bat horizontal at contact, hands roll it down
  { lift: 178, contact:  95, finish:   28, back: true,  crouch: 0.8, lean:  1.0,
    hold: 0.30, stride: -0.30, whip: 2.0, open: 1.3 },
  // COVER — full stride, high elbow, bat finishing above the far shoulder and held
  { lift: 176, contact:  30, finish: -140, back: false, crouch: 0.0, lean:  3.1,
    hold: 0.62, stride:  0.62, whip: 1.7, open: 0.2 },
  // STRAIGHT — the biggest arc of the six, the longest stride, the longest held
  { lift: 182, contact:  10, finish: -174, back: false, crouch: 0.0, lean:  2.6,
    hold: 0.68, stride:  0.70, whip: 1.7, open: 0.0 },
  // WHIP — off the toes through midwicket. All bottom hand, so the bat snaps
  // late rather than swinging evenly, and the hips open through it.
  { lift: 170, contact: -28, finish: -152, back: false, crouch: 0.1, lean:  1.7,
    hold: 0.46, stride:  0.38, whip: 3.0, open: 1.6 },
  // PULL — rocks back and drops, swings flat and fast, finishes round the
  // shoulder with the chest fully open
  { lift: 186, contact: -58, finish: -170, back: true,  crouch: 1.1, lean: -0.7,
    hold: 0.52, stride: -0.34, whip: 2.8, open: 2.2 },
  // GLANCE — barely a swing at all, the face opened and the ball gone
  { lift: 152, contact: -24, finish:  -66, back: false, crouch: 0.3, lean:  0.7,
    hold: 0.20, stride:  0.26, whip: 1.5, open: 0.9 },
];
const SWING_DOWN = 0.085;                // pick-up to contact, seconds
const SWING_THROUGH = 0.20;              // contact to the end of the follow-through

/* The stance, and what happens to it before a ball is bowled.

   Three things the reference batting all has and the first pass did not: the
   feet are not level, the bat comes up every ball rather than only when you
   have committed, and there is a small press back and across as the bowler
   loads — the trigger. Swagger opens the chest, straightens him up and slows
   the bat taps down, which is §1's Presence doing its job.

   `PICKUP` is how high the bat rides on an ordinary ball. Holding the input
   raises it further and earlier, which is still the premeditation tell. */
const STANCE = {
  // Feet close together and side on, not splayed. A batter at the crease is
  // a narrow shape; the splayed stance the first pass used reads as somebody
  // bracing for a tackle.
  legFront: 15, legBack: 9,
  crouch: 0.35,                          // knees flexed and bent at the waist
  batRest: 22,                           // toe grounded, angled back past the back foot
  // Hands low and close to the body, roughly hip height, and they stay there:
  // the pick-up is cocked from the wrists, so the bat travels a long way and
  // the hands barely move. Lifting the arms with it was the thing that made
  // the first pass look like somebody raising an axe.
  handFront: 30, handBack: 21, handLift: 7,
  pickup: 164,                           // high, and back toward the slips
  pickupHeld: 178,                       // higher still if you commit early
  trigger: 0.30,                         // seconds of press before release
  tapEvery: 1.55,                        // bat taps per second at zero Swagger
};

/* Base timing windows in seconds, before any modifier. Widened once the game
   went in front of players who had not built it: the middle window was fifty
   milliseconds, which is a frame and a half, and asking that of somebody on a
   phone for the first time is not difficulty, it is a wall. */
const WIN = { middle: 0.064, good: 0.126, edge: 0.202 };

/* Where the bat actually is.

   Timing used to be the only thing between a swing and the ball: play the
   wrong shot to a ball a metre outside off and you still middled it, you just
   middled it into a worse cone. That is not what a bat does. Each shot has a
   place its blade passes through — `reachZ` across the pitch, the middle of
   its `likeH` band for height — and if the ball is not inside that envelope
   when it arrives, the bat swings through thin air whatever the timing was.

   It is what makes a wide line unplayable rather than merely unwise, which is
   the half of the wide law that lives in the batting code. */
/* The wide law, in the two numbers that matter: how far off the stumps the
   ball can pass before the umpire calls it. Bowling off the pitch to keep the
   batter quiet now costs a run and the ball, which is exactly what the law is
   for and exactly why it had to exist here. */
/* Out of reach, and only then. The lines were set at 1.05 and 0.92 metres,
   inside what the bat can actually get to — a shot's reach line runs out to
   0.58 off the stumps and the bat stretches 0.78 past that — so a legitimate
   ball that a batter could have cut was being called. Worse, a leg break
   pitching on off and turning away crossed the old line by doing exactly
   what a leg break is supposed to do: one ball in five was a wide.

   They are now set outside the far edge of the reach envelope, off side and
   leg, and the call is made where the batter stands rather than a metre
   behind him, so the last of the drift towards the keeper does not decide
   it. A ball he plays at is never a wide however far away it was. */
const WIDE_OFF = 1.48, WIDE_LEG = -1.24;
const isWide = z => z > WIDE_OFF || z < WIDE_LEG;

const REACH_Z = 0.78;                    // metres either side of the blade's line
const REACH_Y = 1.40;                    // and above or below it

   /* Deliberately much wider up and down than across. "The bat is too far
      away" is a statement about line: how high the ball is coming is already
      handled by the shot's own window through likeH, and letting height count
      double here turned every ball at chest height into an edge. */
const REACH_STRETCH = { control: 0.88, attack: 1.0, slog: 1.14 };

function batReach(shot, type, contactY, contactZ) {
  // How far the blade sweeps is a difficulty signal too: on the easy setting
  // it gets to almost anything, which is what "I did not even reach that" has
  // to stop being before a first-timer will keep playing. It is your blade,
  // though — the same rule as the pace and the fielders. Handing the reach to
  // the opposition as well would make the easy setting the hard one to bowl on.
  const lv = (M && M.phase === 'bat' && M.level && M.level.reachMul) || 1;
  const cy = (shot.likeH[0] + shot.likeH[1]) / 2;
  const k = (REACH_STRETCH[type] || 1) * lv;
  const dz = (contactZ - shot.reachZ) / (REACH_Z * k);
  const dy = (contactY - cy) / (REACH_Y * k);
  return Math.hypot(dz, dy);             // <= 1 is within the swept arc
}

/* ===================== BOWLING STYLES =====================
   Six of them, and the difference is in the ball rather than in the input.
   `swing` is lateral acceleration in the air, in m/s² — it only acts before
   the bounce, which is what swing actually is. `turn` is lateral velocity
   added at the bounce, in m/s, so it only shows up after the ball pitches,
   which is what spin actually is. Off side is +z, leg side is -z, so an
   off break (turning in to a right-hander) is negative and a leg break is
   positive.

   Every style gets exactly one variation on one button. That is the whole
   option set, and it is the same button every time. */
const STYLES = [
  {
    key: 'fast', name: 'FAST', pace: [21.0, 23.4], restMul: 1.05,
    scatter: 1.00, blurb: 'Pace, and it moves in the air. Pick which way.',
    stock: { label: 'OUTSWINGER', swing:  1.15 },
    vari:  { label: 'INSWINGER',  swing: -1.15 },
  },
  {
    key: 'medium', name: 'MEDIUM PACE', pace: [17.0, 19.0], restMul: 0.96,
    scatter: 0.80, blurb: 'Nothing quick. Everything on the spot.',
    stock: { label: 'STOCK', swing: 0.5 },
    vari:  { label: 'SLOWER BALL', paceMul: 0.80, swing: 0.5, loop: true },
  },
  {
    key: 'finger', name: 'FINGER SPIN', pace: [13.0, 14.6], restMul: 1.04,
    scatter: 0.86, blurb: 'Off breaks, turning back in.',
    stock: { label: 'OFF BREAK', turn: -2.0 },
    vari:  { label: 'ARM BALL',  turn: -0.1, swing: 0.7 },
  },
  {
    key: 'wrist', name: 'WRIST SPIN', pace: [11.8, 13.6], restMul: 1.08,
    scatter: 1.14, blurb: 'Leg breaks that spin away. Or not.',
    stock: { label: 'LEG BREAK', turn:  2.3 },
    vari:  { label: 'GOOGLY',    turn: -2.1 },
  },
];
const styleByKey = k => STYLES.find(s => s.key === k) || STYLES[0];
const isSpin = s => s.key === 'finger' || s.key === 'wrist';

/* The cast.

   These are invented names with a nation and an era attached, not parodies of
   particular cricketers. The design's rule about the real players — archetypes
   and never portraits — applies at least as hard to names as it does to
   batting styles: pinning a recognisable person's name on a fictional player
   who then gets out for a duck is a different thing from evoking an era, and
   only the second one is worth doing. So the flavour is the flavour of Test
   cricket between the seventies and the twenty-tens, and nobody in here is
   anybody. */
const NATIONS = [
  { code: 'WI', name: 'WEST INDIES', cap: '#7a1420', kit: '#8f1c2b' },
  { code: 'AUS', name: 'AUSTRALIA',  cap: '#0d5b3a', kit: '#12734a' },
  { code: 'ENG', name: 'ENGLAND',    cap: '#0e3a6b', kit: '#164e8c' },
  { code: 'IND', name: 'INDIA',      cap: '#123f7a', kit: '#1c56a3' },
  { code: 'PAK', name: 'PAKISTAN',   cap: '#0b5136', kit: '#0f6b47' },
  { code: 'NZ',  name: 'NEW ZEALAND',cap: '#1d1d1f', kit: '#2b2b2f' },
  { code: 'SA',  name: 'SOUTH AFRICA', cap: '#0f5f43', kit: '#147954' },
  { code: 'SL',  name: 'SRI LANKA',  cap: '#123f7a', kit: '#1b5aa8' },
];

/* Parody names, pushed closer to recognisable as asked. Every one is a bent
   spelling of a famous surname rather than the surname itself — the joke only
   works if you can hear who it is rubbing against, and it only stays a joke
   if it is never actually them. Nobody real is in here, and the figures a
   name ends up with are whatever happened in your match. */
const CAST = {
  WI:  ['LAROH', 'RITCHARDS', 'HOULDING', 'MARSHALLE', 'AMBROSSE', 'WALSHE',
        'GREENIDGH', 'HAYNESS', 'LLOYDE', 'GARNER-BROWN', 'CHANDERPOOR',
        'SOBERSON', 'GAYLEY', 'BISHOPP'],
  AUS: ['WHARNE', 'PONTONG', 'McGRAWTH', 'GILCHRISTE', 'BORDERR', 'CHAPPELLE',
        'LILLEEY', 'THOMPSONN', 'HAYDEN-SMYTH', 'STARCK', 'WAUGHE', 'HEALEY',
        'CLARKSON', 'BOONEY'],
  ENG: ['BOTHAMM', 'BOYCOTTE', 'GOWERR', 'GOOCHE', 'FLINTOFFE', 'ANDERSSON',
        'ROOTE', 'STOKESE', 'PIETERSSEN', 'BROADE', 'ATHERSTONE', 'VAUGHNE',
        'THORPPE', 'WILLISS'],
  IND: ['TENDULCAR', 'GAVASKAAR', 'DRAVIDD', 'SEHWAAG', 'KUMBLEY', 'KOHLEY',
        'GANGULEE', 'LAXMANN', 'HARBHAJANN', 'BUMRAAH', 'AZHARUDDEEN',
        'SRINAATH', 'KAPILL DEVE', 'PUJARRA'],
  PAK: ['IMRAAN KHANN', 'WASIMM', 'WAQAAR', 'MIANDADD', 'INZAMAAN', 'AKRAMM',
        'YOUSSAF', 'SAQLAINE', 'SHOAIBB', 'MUSHTAQQ', 'ZAHEERR', 'RAZZAAQ',
        'AFRIDEE', 'MALIKK'],
  NZ:  ['HADLEIGH', 'VETTORRI', 'CROWEY', 'ASTELL', 'CAIRNES', 'McCULLUMM',
        'FLEMINGG', 'BONDE', 'TAYLORR', 'WILLIAMSONN', 'MORRISSON',
        'PARORE-BELL', 'STYRISS', 'GREATBATCHE'],
  SA:  ['KALLISS', 'DONNALD', 'POLLOKK', 'STEYNE', 'DE VILLIERE', 'AMLAH',
        'KIRSTENN', 'CRONJEY', 'RHODESSE', 'BOUCHIER', 'NTININ', 'PROCTORR',
        'DU PLESSISS', 'GIBBSON'],
  SL:  ['MURALEE', 'JAYASOORYA', 'SANGAKARRA', 'VAASE', 'DE SILVAA',
        'MAHANAMMA', 'ARAVINDD', 'RANATUNGGE', 'DILSHANN', 'MALINGGA',
        'ATAPATTOO', 'CHANDIMALL', 'HERATHE', 'MENDISS'],
};

/* An initial and a surname, the way a card reads. At most two men in a side
   share one, so a card no longer reads as a family reunion. */
const INITIALS = 'ABCDEFGHIJKLMNPRSTVW';
const SURNAME_CAP = 2;                   // brothers happen; a top six of them does not

function castMember(nation, used) {
  const pool = CAST[nation.code];
  const taken = sur => used.filter(u => u.slice(3) === sur).length;
  const free = pool.filter(n => taken(n) < SURNAME_CAP);
  const from = free.length ? free : pool;
  for (let guard = 0; guard < 300; guard++) {
    const n = pick(INITIALS) + '. ' + pick(from);
    if (used.indexOf(n) < 0) { used.push(n); return { name: n, nation: nation }; }
  }
  const fallback = used.length + '. ' + from[0];
  used.push(fallback);
  return { name: fallback, nation: nation };
}

/* ===================== THE GROUND YOU ARE AT =====================
   Every match happens somewhere. A ground with a name, a time of day, a size
   of crowd and a sky — drawn from the same nation pool the sides come from,
   so the fixture, the kit, the cast and the light all agree with each other.
   This is what makes a match feel like a broadcast rather than a test
   harness: the same eleven stick figures, somewhere in particular. */
const GROUNDS = {
  WI:  ['KENSINGTON PARK', 'QUEEN\'S ROAD OVAL', 'BOURDA GARDENS', 'SABINA BAY'],
  AUS: ['THE HILL', 'YARRA PARK', 'GABBA STREET', 'ADELAIDE DOMAIN'],
  ENG: ['ST JOHN\'S WOOD', 'KENNINGTON GREEN', 'HEADINGLY ROAD', 'OLD TRAFFORDE'],
  IND: ['WANKHEDE MAIDAN', 'EDEN PARK GARDENS', 'CHINNASWAMY ROAD', 'FEROZ MAIDAN'],
  PAK: ['GADDAFFI GROUND', 'NATIONAL STADIUM ROAD', 'PINDI CLUB', 'IQBAL PARK'],
  NZ:  ['BASIN ROAD', 'EDEN TERRACE', 'HAGLEY GREEN', 'EMBANKMENT OVAL'],
  SA:  ['NEWLANDS ROAD', 'THE WANDERING CLUB', 'KINGSMEAD PARK', 'ST GEORGE\'S LANE'],
  SL:  ['PREMADASSA PARK', 'GALLE FORT GROUND', 'SINHALESE CLUB', 'ASGIRIYA HILL'],
};

/* Light. It is the same ground at a different hour, and it is most of what
   tells one match from another before a ball is bowled. */
const LIGHTS = [
  { key: 'day',   name: 'DAY', sky: '#5fb0dc', skyHi: '#abd9ea', grass: 1.00, crowd: 1.00 },
  { key: 'after', name: 'AFTERNOON', sky: '#6fb6d0', skyHi: '#d8dfae', grass: 1.04, crowd: 1.10 },
  { key: 'eve',   name: 'EVENING', sky: '#4a6f9c', skyHi: '#e0a86a', grass: 0.86, crowd: 1.18 },
  { key: 'grey',  name: 'OVERCAST', sky: '#8fa2ad', skyHi: '#c3cdd2', grass: 0.92, crowd: 0.80 },
];

function shadeHex(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(v * k)));
  return '#' + [f(n >> 16), f((n >> 8) & 255), f(n & 255)]
    .map(v => v.toString(16).padStart(2, '0')).join('');
}

/* ===================== FORMAT =====================
   Two of them for now. A Test is whites, a red ball, a slip cordon and a
   side in no hurry; the limited-overs game is coloured clothing, a ring
   field and a chase. The rest of the ladder — season, career — waits until
   the ball-by-ball game is settled, which is the right order. */
const FORMATS = [
  {
    key: 't5', name: 'T5', overs: 5, innings: 1, whites: false,
    field: 'club', chase: true, aiPatience: 0,
    blurb: 'Five overs a side. Everything happens at once.',
  },
  {
    key: 't10', name: 'T10', overs: 10, innings: 1, whites: false,
    field: 'club', chase: true, aiPatience: 0.12,
    blurb: 'Ten overs a side. Room for an innings, but not much.',
  },
  {
    key: 'od', name: 'ONE DAY', overs: 20, innings: 1, whites: false,
    field: 'club', chase: true, aiPatience: 0.28,
    blurb: 'Twenty overs, coloured clothing, and a total to chase.',
  },
  {
    key: 'test', name: 'TEST', overs: 20, innings: 2, whites: true,
    field: 'island', chase: false, aiPatience: 0.55,
    blurb: 'Whites and slips. Twenty overs and two innings each.',
  },
];
const formatByKey = k => FORMATS.find(f => f.key === k) || FORMATS[1];
/* Two innings needs a bowling half, so the batting-only build offers the
   three limited-overs games and leaves TEST out rather than pretending. */
const playableFormats = () => BAT_ONLY ? FORMATS.filter(f => f.innings === 1) : FORMATS;

/* How you play: as yourself, or as the whole side. */
const PLAY_AS = [
  { key: 'player', name: 'MY PLAYER', blurb: 'You bat at your number and bowl your own spell.' },
  { key: 'team',   name: 'WHOLE TEAM', blurb: 'You bat the innings and bowl every over.' },
];

/* Skin tones and kit. Both are the player's, both are two taps on one screen,

/* The one fielding law worth having in an arcade game, because without it the
   obvious move is to stack the leg side and dare them to hit there. */
const LEG_SIDE_CAP = 2;
const spotAngle = f => Math.atan2(-f.z, CONTACT_X - f.x) * 180 / Math.PI;
/* A few degrees of grace, so a man set square does not eat one of the two
   slots because his position was jittered half a degree round the corner. */
const behindSquareLeg = f => f && !f.keeper && !f.bowler && spotAngle(f) > 96;
const legSideCount = field => (field || []).filter(behindSquareLeg).length;

/* What to call a man standing here. A fielder dragged from cover out to the
   midwicket rope is not called cover any more — and the name is not cosmetic,
   because it is what the scorecard writes when he takes the catch. */
function nameForSpot(x, z) {
  const R = boundaryR();
  const a = Math.atan2(-z, CONTACT_X - x) * 180 / Math.PI;
  const r = Math.hypot(x - CONTACT_X, z);
  let best = 'midOff', bd = 1e9;
  for (const k in POS) {
    if (k === 'keeper') continue;
    const p = POS[k];
    const pr = p.deep ? p.r * R : p.r;
    // angle matters more than depth, but depth is what separates cover from
    // deep cover, so both count
    const da = Math.abs(wrapPi(deg(p.a - a))) * 180 / Math.PI;
    const d = da * 1.6 + Math.abs(pr - r);
    if (d < bd) { bd = d; best = k; }
  }
  return { key: best, name: POS[best].name };
}

/* ===================== SMALL UTILITIES ===================== */
const boundaryR = () => (M && M.level && M.level.boundary) || BOUNDARY;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
const deg = d => d * Math.PI / 180;
function randn() {                       // Box-Muller, for deviation cones
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
const now = () => performance.now() / 1000;

/* ===================== SAVE =====================
   One key, holding the player you made and the innings you have played. The
   board is local — the game is a single file with no network calls of its
   own, so an online board would need a server this build does not have. It
   is stored in the shape a server would want, so wiring one up later is a
   fetch, not a rewrite. */
const Save = {
  key: 'grade-cricket-v2',
  data: {
    player: { name: 'YOU', cap: 'helmet', skin: 2, kit: 'whites', order: 4 },
    format: 't10', playAs: 'player',
    board: [],                           // [{ name, runs, balls, level, when }]
    played: 0, seen: false,
  },
  load() {
    try {
      const raw = localStorage.getItem(this.key);
      if (raw) {
        const d = JSON.parse(raw);
        Object.assign(this.data, d);
        Object.assign(this.data.player, { name: 'YOU', cap: 'helmet', skin: 2, kit: 'whites', order: 4 }, d.player || {});
        if (!Array.isArray(this.data.board)) this.data.board = [];
      }
    } catch (e) { /* private mode — play on, just don't remember */ }
  },
  save() {
    try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) {}
  },
  best() { return this.data.board.length ? this.data.board[0].runs : 0; },
  /* The format and how you are playing are decisions, not defaults, so they
     survive a reload. Coming back to find yourself on MY PLAYER again after
     choosing WHOLE TEAM is the sort of thing that reads as a bug. */
  applyChoices() {
    M.format = formatByKey(this.data.format);
    M.playAs = PLAY_AS.find(a => a.key === this.data.playAs) || PLAY_AS[0];
  },
  rememberChoices() {
    this.data.format = M.format.key;
    this.data.playAs = M.playAs.key;
    this.save();
  },
  /* Innings go on the board sorted by runs, and the board keeps ten. */
  record(entry) {
    this.data.board.push(entry);
    this.data.board.sort((a, b) => b.runs - a.runs || a.balls - b.balls);
    this.data.board = this.data.board.slice(0, 10);
    this.save();
    return this.data.board.indexOf(entry);
  },
};

/* ===================== AUDIO =====================
   The soundtrack is a feedback instrument, not a backing track. A layered
   percussion loop is scheduled ahead of the audio clock; which layers are
   audible is driven by Swagger when batting and by wickets when bowling. The
   player feels the meter before they read it. Everything is synthesised —
   no sample files, so the game stays a single portable file. */
const Snd = {
  ctx: null, master: null, musicGain: null, sfxGain: null,
  on: true, running: false,
  step: 0, nextTime: 0, bpm: 104,
  intensity: 0, mode: 'bat',    // 0..1, drives which layers play
  crowdNode: null, crowdGain: null, crowdFilter: null,

  boot() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { this.on = false; return; }
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.85;
    this.master.connect(this.ctx.destination);
    this.musicGain = this.ctx.createGain();
    this.musicGain.gain.value = 0.55;
    this.musicGain.connect(this.master);
    this.sfxGain = this.ctx.createGain();
    this.sfxGain.gain.value = 0.9;
    this.sfxGain.connect(this.master);
    this.startCrowd();
    this.nextTime = this.ctx.currentTime + 0.1;
    this.running = true;
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  toggle() {
    this.on = !this.on;
    if (this.master) this.master.gain.setTargetAtTime(this.on ? 0.85 : 0, this.ctx.currentTime, 0.05);
  },

  noiseBuffer(sec) {
    const n = Math.floor(this.ctx.sampleRate * sec);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  },

  /* Crowd bed: filtered noise whose brightness and level is the level readout.
     Close and personal at club level, a wall internationally. */
  startCrowd() {
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuffer(3);
    src.loop = true;
    const f = this.ctx.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = 620; f.Q.value = 0.6;
    const g = this.ctx.createGain();
    g.gain.value = 0.05;
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start();
    this.crowdNode = src; this.crowdGain = g; this.crowdFilter = f;
  },
  crowd(level, dur) {                    // a swell for a boundary or a wicket
    if (!this.crowdGain) return;
    const t = this.ctx.currentTime;
    this.crowdGain.gain.cancelScheduledValues(t);
    this.crowdGain.gain.setValueAtTime(this.crowdGain.gain.value, t);
    this.crowdGain.gain.linearRampToValueAtTime(level, t + 0.06);
    this.crowdGain.gain.linearRampToValueAtTime(0.05, t + (dur || 1.4));
  },

  /* --- one-shot voices --- */
  kick(t, gain) {
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(44, t + 0.12);
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
    o.connect(g); g.connect(this.musicGain); o.start(t); o.stop(t + 0.3);
  },
  hat(t, gain, open) {
    const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuffer(0.2);
    const f = this.ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7200;
    const g = this.ctx.createGain();
    const d = open ? 0.16 : 0.035;
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(f); f.connect(g); g.connect(this.musicGain); s.start(t); s.stop(t + d + 0.02);
  },
  conga(t, freq, gain) {
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(freq * 1.7, t);
    o.frequency.exponentialRampToValueAtTime(freq, t + 0.05);
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(this.musicGain); o.start(t); o.stop(t + 0.24);
  },
  clave(t, gain) {
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'square'; o.frequency.value = 1180;
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    o.connect(g); g.connect(this.musicGain); o.start(t); o.stop(t + 0.08);
  },
  bassNote(t, freq, gain, dur) {
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'triangle'; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.4));
    o.connect(g); g.connect(this.musicGain); o.start(t); o.stop(t + (dur || 0.4) + 0.05);
  },

  /* --- the loop --- */
  tick() {
    if (!this.running || !this.ctx) return;
    const spb = 60 / this.bpm / 2;       // eighth notes
    while (this.nextTime < this.ctx.currentTime + 0.25) {
      this.schedule(this.step % 16, this.nextTime);
      this.step++;
      this.nextTime += spb;
    }
  },
  schedule(s, t) {
    const I = this.intensity;
    if (this.mode === 'bat') {
      /* Baseline is a hi-hat and the crowd. Layers stack as Swagger builds —
         the ground starts playing for you. */
      this.hat(t, s % 2 === 0 ? 0.12 : 0.06, s % 8 === 6 && I > 0.55);
      if (I > 0.12 && (s === 0 || s === 6 || s === 10)) this.kick(t, 0.5);
      if (I > 0.36 && (s === 4 || s === 12)) this.clave(t, 0.16);
      if (I > 0.58 && (s === 2 || s === 7 || s === 11 || s === 14)) this.conga(t, s === 7 ? 210 : 158, 0.3);
      if (I > 0.80) {
        if (s === 3 || s === 9) this.conga(t, 300, 0.26);
        if (s % 4 === 0) this.bassNote(t, [82.4, 82.4, 110, 98][(s / 4) | 0], 0.22, 0.34);
      }
    } else {
      /* Bowling inverts it: low, sparse and threatening, thickening as the
         batter starts to flinch. */
      if (s === 0 || s === 8) this.kick(t, 0.55 + I * 0.35);
      if (I > 0.25 && (s === 6 || s === 14)) this.conga(t, 96, 0.28 + I * 0.2);
      if (I > 0.45 && s % 4 === 2) this.hat(t, 0.05 + I * 0.05, false);
      if (I > 0.62 && (s === 0 || s === 11)) this.bassNote(t, 55, 0.3, 0.7);
      if (I > 0.85 && s % 2 === 1) this.clave(t, 0.06);
    }
  },

  /* --- contact and event stings --- */
  bat(kind) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    if (kind === 'middle') {             // chunky: a click over a low thud
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(420, t);
      o.frequency.exponentialRampToValueAtTime(110, t + 0.09);
      g.gain.setValueAtTime(0.75, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
      o.connect(g); g.connect(this.sfxGain); o.start(t); o.stop(t + 0.22);
      const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuffer(0.06);
      const f = this.ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1800; f.Q.value = 1.2;
      const g2 = this.ctx.createGain();
      g2.gain.setValueAtTime(0.5, t); g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
      s.connect(f); f.connect(g2); g2.connect(this.sfxGain); s.start(t); s.stop(t + 0.08);
    } else if (kind === 'edge') {        // thin and high
      const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuffer(0.08);
      const f = this.ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 2600;
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.4, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
      s.connect(f); f.connect(g); g.connect(this.sfxGain); s.start(t); s.stop(t + 0.11);
    } else {                             // miss: air, then the keeper's gloves
      const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuffer(0.25);
      const f = this.ctx.createBiquadFilter(); f.type = 'bandpass';
      f.frequency.setValueAtTime(900, t);
      f.frequency.exponentialRampToValueAtTime(280, t + 0.2);
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.22, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
      s.connect(f); f.connect(g); g.connect(this.sfxGain); s.start(t); s.stop(t + 0.24);
    }
  },
  sting(kind) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    if (kind === 'wicket') {
      [0, 0.09, 0.18].forEach((d, i) => this.conga(t + d, 260 - i * 60, 0.4));
      this.crowd(0.3, 2.2);
    } else if (kind === 'duck') {        // short, comic, dry
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = 'square';
      o.frequency.setValueAtTime(300, t);
      o.frequency.exponentialRampToValueAtTime(90, t + 0.5);
      g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
      o.connect(g); g.connect(this.sfxGain); o.start(t); o.stop(t + 0.6);
    } else if (kind === 'four' || kind === 'six') {
      this.crowd(kind === 'six' ? 0.42 : 0.3, kind === 'six' ? 2.4 : 1.8);
      const base = kind === 'six' ? [392, 523, 659] : [330, 440];
      base.forEach((f, i) => this.bassNote(t + i * 0.08, f, 0.16, 0.3));
    } else if (kind === 'flourish') {
      [523, 659, 784, 1047].forEach((f, i) => this.bassNote(t + i * 0.05, f, 0.18, 0.35));
      this.crowd(0.5, 2.6);
    }
  },
  /* A rising note while the ball is in the air, resolving either way. */
  travel(startPitch) {
    if (!this.ctx || this.travelOsc) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(startPitch || 220, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.08, t + 0.1);
    const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1200;
    o.connect(f); f.connect(g); g.connect(this.sfxGain); o.start(t);
    this.travelOsc = o; this.travelGain = g;
  },
  travelTo(pitch) {
    if (!this.travelOsc) return;
    this.travelOsc.frequency.setTargetAtTime(pitch, this.ctx.currentTime, 0.08);
  },
  travelEnd() {
    if (!this.travelOsc) return;
    const t = this.ctx.currentTime;
    this.travelGain.gain.setTargetAtTime(0.0001, t, 0.05);
    this.travelOsc.stop(t + 0.3);
    this.travelOsc = null; this.travelGain = null;
  },
};
/* ===================== CAMERA & PROJECTION =====================
   Behind the batter, looking down the pitch at the bowler. The ball comes
   at you and length is read by watching it grow, which is the read the
   side-on build could never give.

   World axes: x runs down the pitch (0 = bowler's stumps, 20.12 = striker's
   stumps), z runs across it (+z is the off side, -z is leg), y is height.
   The camera is a real pinhole with a yaw and a downward tilt, so the pitch
   converges properly and depth does the work the old z-squash was faking.

   Screen right is +z, so from behind a right-hander the off side is on the
   right and the leg side on the left. Turn the camera round to the bowler's
   end (yaw = π) and that swaps itself, which is exactly what the view from
   behind the bowler's arm looks like. */
const PPM = 30;                          // pixels per metre at unit depth × f/PPM
const ORIGIN_Y = 0.60;                   // where the camera's centre line sits
const NEAR = 0.9;

/* Two fixed ends. The batting camera stands about ten metres behind the
   striker and a little above his head; the bowling one stands where a
   television camera stands, well back behind the bowler's arm on a long
   lens, which is the only way to get the far batter big enough to read
   without the men at mid-off filling the frame. */
const CAMS = {
  // Close in and low behind the striker, so he is a foreground character
  // rather than a figure in the middle distance — about a quarter of the
  // frame, with the pitch opening out past his shoulder.
  bat:  { x: PITCH_LEN + 7.6, y: 3.10, z: -0.35, yaw: 0,       pitch: 0.220, f: 900 },
  bowl: { x: -22.0,           y: 4.20, z:  0.30, yaw: Math.PI, pitch: 0.101, f: 2100 },
};

const wrapPi = a => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };

const Cam = {
  x: 0, y: 0, z: 0, yaw: 0, pitch: 0.2, f: 900,
  tx: 0, ty: 0, tz: 0, tyaw: 0, tpitch: 0.2, tf: 900,
  shake: 0, shakeX: 0, shakeY: 0, lag: 0.0016, wide: false,

  set(c, snap) {
    this.tx = c.x; this.ty = c.y; this.tz = c.z;
    this.tyaw = c.yaw; this.tpitch = c.pitch; this.tf = c.f;
    if (snap) {
      this.x = c.x; this.y = c.y; this.z = c.z;
      this.yaw = c.yaw; this.pitch = c.pitch; this.f = c.f;
    }
  },
  base() { return M.phase === 'bat' ? CAMS.bat : CAMS.bowl; },
  home(snap) { this.wide = false; this.lag = 0.0016; this.set(this.base(), snap); },

  /* Follow a struck ball. The eye lifts with distance so the field opens
     up, the yaw swings on to the ball, and the tilt is solved rather than
     guessed: put the ball a fixed distance above the centre line and the
     framing holds whether it is a chip to cover or a flat six. */
  chase(bx, by, bz) {
    const b = this.base();
    const dh = Math.max(2, Math.hypot(bx - b.x, bz - b.z));
    const wide = clamp((dh - 14) / 38, 0, 1);
    const ey = b.y + wide * 13.0;
    const yaw = Math.atan2(bz - b.z, b.x - bx);
    const f = lerp(b.f, b.f * 0.62, wide);
    const phi = Math.atan2(by - ey, dh);
    this.wide = true;
    this.lag = 0.0006;
    this.set({ x: b.x, y: ey, z: b.z, yaw: yaw, f: f,
               pitch: clamp(Math.atan(90 / f) - phi, 0.12, 1.15) });
  },

  update(dt) {
    const k = 1 - Math.pow(this.lag, dt);
    this.x = lerp(this.x, this.tx, k);
    this.y = lerp(this.y, this.ty, k);
    this.z = lerp(this.z, this.tz, k);
    this.pitch = lerp(this.pitch, this.tpitch, k);
    this.f = lerp(this.f, this.tf, k);
    this.yaw += wrapPi(this.tyaw - this.yaw) * k;
    if (this.shake > 0) {
      this.shake = Math.max(0, this.shake - dt * 2.6);
      this.shakeX = (Math.random() * 2 - 1) * this.shake * 20;
      this.shakeY = (Math.random() * 2 - 1) * this.shake * 15;
    } else { this.shakeX = this.shakeY = 0; }
  },
  kick(amount) { this.shake = Math.min(1.3, this.shake + amount); },
};

function proj(x, y, z) {
  const rx = x - Cam.x, ry = y - Cam.y, rz = z - Cam.z;
  const cy = Math.cos(Cam.yaw), sy = Math.sin(Cam.yaw);
  const dh = -rx * cy + rz * sy;         // metres straight ahead of the lens
  const h  =  rx * sy + rz * cy;         // metres to the right of it
  const cp = Math.cos(Cam.pitch), sp = Math.sin(Cam.pitch);
  const d  = dh * cp - ry * sp;
  const up = dh * sp + ry * cp;
  const behind = d < NEAR;
  const dd = behind ? NEAR : d;
  return {
    x: VW / 2 + clamp(Cam.f * h / dd, -9e4, 9e4) + Cam.shakeX,
    y: VH * ORIGIN_Y - Cam.f * up / dd + Cam.shakeY,
    s: Cam.f / (dd * PPM),
    d: d, behind: behind,
  };
}

/* Screen point back on to the ground plane — the bowling target is dragged
   with a thumb, so the thumb has to mean a spot on the pitch. */
function unprojectGround(sx, sy) {
  const cp = Math.cos(Cam.pitch), sp = Math.sin(Cam.pitch);
  const k = (VH * ORIGIN_Y - sy) / Cam.f;    // up / depth
  const den = sp - k * cp;
  if (den <= 0.002) return null;             // at or above the horizon
  const dh = Cam.y * (cp + k * sp) / den;
  const d = dh * cp + Cam.y * sp;
  const h = (sx - VW / 2) / Cam.f * d;
  const cy = Math.cos(Cam.yaw), syw = Math.sin(Cam.yaw);
  return { x: Cam.x - cy * dh + syw * h, z: Cam.z + syw * dh + cy * h };
}

const horizonY = () => VH * ORIGIN_Y - Cam.f * Math.tan(Cam.pitch);

/* ===================== ART =====================
   Roughly eight shapes per figure: single-weight limbs, a filled circle for
   a head, no face. The figures never gain fidelity between tiers —
   everything earned is expressed in the world around them. */
let ctx = null;

const Art = {
  line(a, b, w, colour) {
    ctx.strokeStyle = colour; ctx.lineWidth = w; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  },
  disc(p, r, colour) {
    ctx.fillStyle = colour;
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.fill();
  },
  poly(pts, colour) {
    if (pts.length < 3) return;
    ctx.fillStyle = colour;
    ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath(); ctx.fill();
  },
  text(str, x, y, size, colour, align, weight) {
    ctx.font = (weight || '900') + ' ' + size + 'px "Arial Black", Impact, sans-serif';
    ctx.textAlign = align || 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = colour;
    ctx.fillText(str, x, y);
  },
  shadow(x, z, r, alpha) {
    const p = proj(x, 0, z);
    if (p.behind) return;
    ctx.fillStyle = 'rgba(0,0,0,' + (alpha || 0.22) + ')';
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, r * p.s * PPM, r * p.s * PPM * 0.36, 0, 0, TAU);
    ctx.fill();
  },
};

/* Limb angles are degrees from straight down, positive swinging toward
   screen right. Nothing is measured from the horizontal and nothing is
   subtracted from 180, which is how the legs used to end up in the air. */
const limbFrom = (from, angDeg, len, dir) => ({
  x: from.x + Math.sin(deg(angDeg)) * len * (dir === undefined ? 1 : dir),
  y: from.y + Math.cos(deg(angDeg)) * len,
});

function figureAnchors(x, z, o) {
  const g = proj(x, 0, z);
  const u = g.s * PPM * o.scale;
  const H = o.height * u;
  const hip = { x: g.x + o.lean * u * 0.06, y: g.y - H * 0.50 + o.crouch * u * 0.12 };
  const shoulder = { x: hip.x + o.lean * u * 0.10, y: hip.y - H * 0.30 };
  const headR = H * 0.070;               // small head, long limbs
  return { g, u, H, hip, shoulder, headR, lw: Math.max(1.7, u * 0.052) };
}

function drawHead(head, headR, o, u, dirHint) {
  Art.disc(head, headR, o.skin || '#8d5a32');
  const dir = dirHint === undefined ? o.face : dirHint;
  if (o.cap === 'cap') {
    ctx.fillStyle = o.capCol || (o.shirt === PAL.maroon ? PAL.gold : PAL.maroon);
    ctx.beginPath(); ctx.arc(head.x, head.y, headR * 1.10, Math.PI, 0); ctx.fill();
    ctx.fillRect(head.x + (dir < 0 ? -headR * 2.0 : 0), head.y - headR * 0.18, headR * 2.0, headR * 0.36);
  } else if (o.cap === 'helmet') {
    ctx.fillStyle = '#2f3d4a';
    ctx.beginPath(); ctx.arc(head.x, head.y, headR * 1.24, Math.PI * 0.82, Math.PI * 2.18); ctx.fill();
    ctx.strokeStyle = '#cfd6dc'; ctx.lineWidth = Math.max(1.2, u * 0.03);
    ctx.beginPath();
    if (dirHint === 0) {                 // seen head on: the grille is a bar
      ctx.moveTo(head.x - headR * 1.15, head.y + headR * 0.45);
      ctx.lineTo(head.x + headR * 1.15, head.y + headR * 0.45);
    } else {
      ctx.moveTo(head.x + dir * headR * 1.2, head.y - headR * 0.1);
      ctx.lineTo(head.x + dir * headR * 1.5, head.y + headR * 0.85);
    }
    ctx.stroke();
  }
}

/* One colour block for the shirt, then the two shapes that date it: a broad
   band across the chest and a wide collar. Eight shapes a figure was always
   the budget; this spends two of them on saying which decade it is. */
function drawTorso(shoulder, hip, u, colour, trim) {
  const sw = u * 0.175, hw = u * 0.135;
  ctx.fillStyle = colour;
  ctx.beginPath();
  ctx.moveTo(shoulder.x - sw, shoulder.y);
  ctx.lineTo(shoulder.x + sw, shoulder.y);
  ctx.lineTo(hip.x + hw, hip.y);
  ctx.lineTo(hip.x - hw, hip.y);
  ctx.closePath(); ctx.fill();
  if (!trim || u < 12) return;           // too small to read; don't muddy it

  const band = (a, b, col) => {          // a, b are 0..1 down the torso
    const wa = lerp(sw, hw, a), wb = lerp(sw, hw, b);
    const xa = lerp(shoulder.x, hip.x, a), xb = lerp(shoulder.x, hip.x, b);
    const ya = lerp(shoulder.y, hip.y, a), yb = lerp(shoulder.y, hip.y, b);
    Art.poly([{ x: xa - wa, y: ya }, { x: xa + wa, y: ya },
              { x: xb + wb, y: yb }, { x: xb - wb, y: yb }], col);
  };
  band(0.30, 0.46, trim);                // the chest stripe
  band(0.00, 0.09, trim);                // the collar
}

function drawBat(grip, angDeg, H, dir, colour) {
  const a = deg(angDeg);
  const bx = Math.sin(a) * dir, by = Math.cos(a);
  const bl = H * 0.42, bw = H * 0.048;
  const tipX = grip.x + bx * bl, tipY = grip.y + by * bl;
  const px = -by * dir, py = bx * dir;
  Art.poly([
    { x: grip.x + px * bw * 0.5, y: grip.y + py * bw * 0.5 },
    { x: tipX + px * bw, y: tipY + py * bw },
    { x: tipX - px * bw, y: tipY - py * bw },
    { x: grip.x - px * bw * 0.5, y: grip.y - py * bw * 0.5 },
  ], colour || '#d9b877');
}

/* Side-on rig: the fielders standing square to the camera, the batter down
   the other end while you are bowling. */
function drawFigureSide(x, z, o) {
  const A = figureAnchors(x, z, o);
  const { u, H, hip, shoulder, headR, lw } = A;
  const dir = o.face;
  const head = { x: shoulder.x + o.lean * u * 0.05 + dir * H * 0.015, y: shoulder.y - headR * 1.5 };

  const kneeF = limbFrom(hip, o.legF, H * 0.24, dir);
  const footF = limbFrom(kneeF, o.legF * 0.30, H * 0.24, dir);
  const kneeB = limbFrom(hip, o.legB, H * 0.24, dir);
  const footB = limbFrom(kneeB, o.legB * 0.30, H * 0.24, dir);
  const legCol = o.legCol || (o.pads ? (o.padCol || PAL.white) : o.shirt);
  const legW = lw * (o.pads ? 2.2 : 1);
  Art.line(hip, kneeB, legW * 0.92, legCol); Art.line(kneeB, footB, legW * 0.92, legCol);
  Art.line(hip, kneeF, legW, legCol);       Art.line(kneeF, footF, legW, legCol);

  drawTorso(shoulder, hip, u, o.shirt, o.trim);

  const elbowB = limbFrom(shoulder, o.armB, H * 0.19, dir);
  const handB = limbFrom(elbowB, o.armB * 0.60, H * 0.18, dir);
  const elbowF = limbFrom(shoulder, o.armF, H * 0.19, dir);
  const handF = limbFrom(elbowF, o.armF * 0.60, H * 0.18, dir);
  Art.line(shoulder, elbowB, lw, o.shirt); Art.line(elbowB, handB, lw, o.shirt);
  if (o.bat) drawBat(handF, o.batAng, H, dir);
  Art.line(shoulder, elbowF, lw, o.shirt); Art.line(elbowF, handF, lw, o.shirt);

  drawHead(head, headR, o, u);
  return { head, shoulder, hip, handF, handB, footF, u, H, g: A.g };
}

/* Facing rig: seen from in front or behind, which is nearly everyone now.
   Left and right limbs are independent so a run cycle scissors and a
   stance splays, and the bowling arm can go over the top on its own. */
function drawFigureFacing(x, z, o) {
  const A = figureAnchors(x, z, o);
  const { u, H, hip, shoulder, headR, lw } = A;
  const head = { x: shoulder.x + o.tilt * u * 0.05, y: shoulder.y - headR * 1.5 };

  const kneeL = limbFrom(hip, -o.legL, H * 0.24);
  const footL = limbFrom(kneeL, -o.legL * 0.35, H * 0.24);
  const kneeR = limbFrom(hip, o.legR, H * 0.24);
  const footR = limbFrom(kneeR, o.legR * 0.35, H * 0.24);
  const legCol = o.legCol || (o.pads ? (o.padCol || PAL.white) : o.shirt);
  const legW = lw * (o.pads ? 2.1 : 1);
  Art.line(hip, kneeL, legW, legCol); Art.line(kneeL, footL, legW, legCol);
  Art.line(hip, kneeR, legW, legCol); Art.line(kneeR, footR, legW, legCol);

  drawTorso(shoulder, hip, u, o.shirt, o.trim);

  const elbowL = limbFrom(shoulder, -o.armL, H * 0.19);
  const handL = limbFrom(elbowL, -o.armL * 0.62, H * 0.18);
  const elbowR = limbFrom(shoulder, o.armR, H * 0.19);
  const handR = limbFrom(elbowR, o.armR * 0.62, H * 0.18);
  Art.line(shoulder, elbowL, lw, o.shirt); Art.line(elbowL, handL, lw, o.shirt);
  if (o.bat) drawBat(handR, o.batAng, H, 1);
  Art.line(shoulder, elbowR, lw, o.shirt); Art.line(elbowR, handR, lw, o.shirt);

  drawHead(head, headR, o, u, 0);
  return { head, shoulder, hip, handF: handR, handB: handL, handL, handR, u, H, g: A.g };
}

const FIG_DEFAULTS = {
  view: 'side', face: -1, shirt: PAL.maroon, pads: false, bat: false, cap: 'helmet',
  lean: 0, tilt: 0, crouch: 0, height: 1.82, batAng: -40, scale: 1, alpha: 1,
  trim: null, skin: null, padCol: null, capCol: null, legCol: null,
  armF: 30, armB: -22, legF: 18, legB: -18,       // side rig
  armL: 22, armR: 22, legL: 16, legR: 16,          // facing rig
};

function drawFigure(x, z, opt) {
  const o = Object.assign({}, FIG_DEFAULTS, opt);
  const p = proj(x, 0, z);
  if (p.behind || p.d < 1.6) return null;
  ctx.globalAlpha = o.alpha;
  const r = o.view === 'side' ? drawFigureSide(x, z, o) : drawFigureFacing(x, z, o);
  ctx.globalAlpha = 1;
  return r;
}

/* --- the ground ---
   The camera stands inside the boundary, so part of the rope is always
   behind the lens. Everything below the horizon is painted as outside the
   rope first, and the visible arc is then filled back in as grass. That
   way there is never a seam where the circle runs off past the camera. */
function ringArc(radius, steps) {
  const pts = [];
  let hidden = 0;
  for (let i = 0; i < steps; i++) {
    const a = i / steps * TAU;
    const p = proj(PITCH_LEN / 2 + Math.cos(a) * radius, 0, Math.sin(a) * radius);
    if (p.behind) hidden++;
    pts.push(p.behind ? null : p);
  }
  // The whole circle is in front of the lens: it is a closed shape and
  // needs no closing edge. That happens on the bowling camera, which stands
  // outside the mown ring rather than inside it.
  if (hidden === 0) return { pts: pts, closed: true };

  // otherwise take the longest visible run, wrapping round the circle
  let best = null, run = null;
  for (let i = 0; i < steps * 2; i++) {
    const p = pts[i % steps];
    if (p) { if (!run) run = []; run.push(p); }
    else { if (run && (!best || run.length > best.length)) best = run; run = null; }
  }
  if (run && (!best || run.length > best.length)) best = run;
  return { pts: best || [], closed: false };
}

/* Fill what is inside the rope. An open arc is closed off the bottom of the
   screen, because its two ends run off sideways past the camera. */
function fillArcRegion(arc, colour) {
  const a = arc.pts;
  if (a.length < 3) return;
  if (arc.closed) { Art.poly(a, colour); return; }
  const pts = a.slice();
  pts.push({ x: a[a.length - 1].x, y: VH + 900 });
  pts.push({ x: a[0].x, y: VH + 900 });
  Art.poly(pts, colour);
}

function drawGround(level, withBoards) {
  const hz = horizonY();
  const L = M.light || LIGHTS[0];
  const sky = ctx.createLinearGradient(0, 0, 0, Math.max(40, hz));
  sky.addColorStop(0, L.skyHi);
  sky.addColorStop(1, L.sky);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, VW, VH);

  // everything on the ground and outside the rope
  ctx.fillStyle = level.key === 'hard' ? '#5b6f7d' : '#7d8f5a';
  ctx.fillRect(0, Math.max(0, hz), VW, VH - Math.max(0, hz));

  const R = boundaryR();
  const rope = ringArc(R, 128);
  fillArcRegion(rope, shadeHex(PAL.grass, L.grass));

  /* Mown stripes, running the length of the ground so they converge away
     from you down the pitch. This is the single most 1980s thing on the
     screen and it costs sixteen quads. They are clipped to the rope, and
     each is skipped if a corner falls behind the lens — which only happens
     right at the edge of frame when the camera has swung a long way round. */
  if (rope.pts.length > 2) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(rope.pts[0].x, rope.pts[0].y);
    for (let i = 1; i < rope.pts.length; i++) ctx.lineTo(rope.pts[i].x, rope.pts[i].y);
    if (!rope.closed) { ctx.lineTo(rope.pts[rope.pts.length - 1].x, VH + 900); ctx.lineTo(rope.pts[0].x, VH + 900); }
    ctx.closePath(); ctx.clip();
    const far = PITCH_LEN / 2 - R - 6, near = Cam.x - Math.cos(Cam.yaw) * 3.0;
    for (let i = -8; i < 8; i++) {
      if (i % 2) continue;
      const z0 = i * 5.0, z1 = z0 + 5.0;
      const a = proj(far, 0, z0), b = proj(near, 0, z0);
      const c = proj(near, 0, z1), d = proj(far, 0, z1);
      if (a.behind || b.behind || c.behind || d.behind) continue;
      Art.poly([a, b, c, d], shadeHex(PAL.grassMow, L.grass));
    }
    ctx.restore();
  }
  fillArcRegion(ringArc(R * 0.52, 96), shadeHex(PAL.grassDark, L.grass));

  if (rope.pts.length > 1) {             // the rope itself
    const a = rope.pts;
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth = clamp(2.4 * (Cam.f / 950), 1.5, 5);
    ctx.beginPath(); ctx.moveTo(a[0].x, a[0].y);
    for (let i = 1; i < a.length; i++) ctx.lineTo(a[i].x, a[i].y);
    if (rope.closed) ctx.closePath();
    ctx.stroke();
  }

  // the square, then the strip: both converge properly now
  Art.poly([
    proj(-4, 0, -5.0), proj(PITCH_LEN + 4, 0, -5.0),
    proj(PITCH_LEN + 4, 0, 5.0), proj(-4, 0, 5.0),
  ], PAL.grassLight);
  Art.poly([
    proj(-1.6, 0, -PITCH_HALF_W), proj(PITCH_LEN + 1.6, 0, -PITCH_HALF_W),
    proj(PITCH_LEN + 1.6, 0, PITCH_HALF_W), proj(-1.6, 0, PITCH_HALF_W),
  ], PAL.pitch);
  ctx.globalAlpha = 0.5;
  Art.poly([
    proj(6.5, 0.005, -0.9), proj(14.0, 0.005, -0.9),
    proj(14.0, 0.005, 0.9), proj(6.5, 0.005, 0.9),
  ], PAL.pitchEdge);                     // the worn patch, halfway down
  ctx.globalAlpha = 1;

  if (withBoards) drawBoards(R);

  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = Math.max(1, 2 * (Cam.f / 940));
  [CREASE_X, FAR_CREASE_X, 0, PITCH_LEN].forEach(cx => {
    const a = proj(cx, 0.01, -PITCH_HALF_W), b = proj(cx, 0.01, PITCH_HALF_W);
    if (a.behind || b.behind) return;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  });
}

/* Advertising boards around the rope: flat colour blocks a metre high, which
   is what a ground looked like before anybody had a video hoarding. They also
   do the useful job of hiding the seam between the outfield and whatever is
   beyond it. */
function drawBoards(R) {
  const cx = PITCH_LEN / 2, steps = 96;
  for (let i = 0; i < steps; i++) {
    const a0 = i / steps * TAU, a1 = (i + 1) / steps * TAU;
    const p0 = proj(cx + Math.cos(a0) * R, 0, Math.sin(a0) * R);
    const p1 = proj(cx + Math.cos(a1) * R, 0, Math.sin(a1) * R);
    if (p0.behind || p1.behind) continue;
    if (Math.max(p0.x, p1.x) < -80 || Math.min(p0.x, p1.x) > VW + 80) continue;
    const t0 = proj(cx + Math.cos(a0) * R, 1.0, Math.sin(a0) * R);
    const t1 = proj(cx + Math.cos(a1) * R, 1.0, Math.sin(a1) * R);
    Art.poly([p0, p1, t1, t0], PAL.board[i % PAL.board.length]);
  }
}

/* A sightscreen straight behind the bowler's arm. It is furniture, but it
   is also what makes a red ball readable against a crowd. */
function drawSightscreen(level) {
  const R = boundaryR();
  const sx = PITCH_LEN / 2 - (R + 4);
  const a = proj(sx, 0, -6.5), b = proj(sx, 0, 6.5);
  const c = proj(sx, 4.6, 6.5), d = proj(sx, 4.6, -6.5);
  if (a.behind || b.behind) return;
  Art.poly([a, b, c, d], '#e9e6da');
  Art.poly([proj(sx, 0, -6.5), proj(sx, 0, 6.5), proj(sx, 0.35, 6.5), proj(sx, 0.35, -6.5)], '#c3bfae');
}

function drawCrowd(level) {
  // Close and individual at club level; above that a texture whose density
  // is the level readout.
  const density = Math.round((level.key === 'easy' ? 110 : level.key === 'medium' ? 190 : 280)
                             * ((M.light || LIGHTS[0]).crowd));
  const R = boundaryR() + 7;
  for (let i = 0; i < density; i++) {
    const a = (i / density) * TAU + 0.13;
    const rr = R + (i % 4) * 2.4;
    const p = proj(PITCH_LEN / 2 + Math.cos(a) * rr, 0, Math.sin(a) * rr);
    if (p.behind || p.y < 20 || p.y > VH + 40 || p.x < -60 || p.x > VW + 60) continue;
    const r = clamp(0.34 * p.s * PPM, 1.1, 26);
    ctx.fillStyle = 'hsl(' + ((i * 47) % 360) + ',62%,' + (level.key === 'easy' ? 56 : 46) + '%)';
    ctx.beginPath(); ctx.arc(p.x, p.y - r * 2.6, r, 0, TAU); ctx.fill();
    ctx.fillRect(p.x - r * 0.85, p.y - r * 1.9, r * 1.7, r * 2.0);
  }
}

/* Bowled, and the stumps go. Three sticks and two bails given a shove in the
   direction the ball was travelling and then left to gravity — the wicket
   coming out of the ground is the loudest thing that happens in cricket and
   it was previously a caption. */
const Stumps = {
  on: false, t: 0, bits: null,
  hit(vz, vx) {
    this.on = true; this.t = 0;
    const push = clamp(Math.hypot(vx, vz) * 0.10, 1.6, 5.0);
    this.bits = [];
    for (let i = -1; i <= 1; i++) {
      this.bits.push({ z: i * 0.11, y: 0, h: STUMP_H, spin: rnd(-9, 9), rot: 0,
                       vz: vz * 0.06 + rnd(-0.7, 0.7), vx: -push * rnd(0.5, 1.0),
                       vy: rnd(1.4, 3.4) });
    }
    for (let i = -1; i <= 1; i += 2) {      // the bails go furthest
      this.bits.push({ z: i * 0.055, y: STUMP_H, h: 0.11, spin: rnd(-22, 22), rot: 0,
                       vz: vz * 0.10 + rnd(-1.6, 1.6), vx: -push * rnd(1.0, 1.7),
                       vy: rnd(2.6, 4.6) });
    }
    Cam.kick(0.85);
  },
  clear() { this.on = false; this.bits = null; },
  update(dt) {
    if (!this.on) return;
    this.t += dt;
    this.bits.forEach(b => {
      b.z += b.vz * dt; b.y += b.vy * dt; b.h = b.h;
      b.x = (b.x || 0) + b.vx * dt;
      b.vy -= G * dt; b.rot += b.spin * dt;
      if (b.y < 0.02) { b.y = 0.02; b.vy = -b.vy * 0.3; b.vx *= 0.6; b.vz *= 0.6; b.spin *= 0.5; }
    });
    if (this.t > 2.6) this.clear();
  },
  draw(atX) {
    if (!this.on) return;
    this.bits.forEach(b => {
      const p = proj(atX + (b.x || 0), b.y, b.z);
      if (p.behind) return;
      const len = b.h * p.s * PPM;
      const c = Math.cos(b.rot), sn = Math.sin(b.rot);
      Art.line({ x: p.x - sn * len / 2, y: p.y - c * len / 2 },
               { x: p.x + sn * len / 2, y: p.y + c * len / 2 },
               clamp(3.4 * p.s, 1.3, 14), PAL.white);
    });
  },
};

function drawStumps(x, isStriker) {
  if (isStriker && Stumps.on) { Stumps.draw(x); return; }
  const w = 0.11;
  for (let i = -1; i <= 1; i++) {
    const base = proj(x, 0, i * w), top = proj(x, STUMP_H, i * w);
    if (base.behind || top.behind) continue;
    Art.line(base, top, clamp(3.4 * base.s, 1.3, 14), PAL.white);
  }
  const b1 = proj(x, STUMP_H, -w * 0.55), b2 = proj(x, STUMP_H, w * 0.55);
  if (!b1.behind && !b2.behind) Art.line(b1, b2, clamp(2.2 * b1.s, 1, 8), '#e2ddcf');
}
/* ===================== THE BALL =====================
   One projectile with one bounce, plus the two things that separate a
   bowler from a bowling machine:

     `az`   lateral acceleration while the ball is in the air — swing. It
            stops mattering the moment the ball pitches.
     `turn` lateral velocity handed to the ball at the bounce — spin and
            seam. It does nothing at all until the ball pitches.

   Both are folded into predict() as well as step(), so the timing window,
   the length marker and the AI all agree with what actually happens. No
   hidden dice anywhere in the chain. */
const Ball = {
  x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, az: 0,
  live: false, bounced: false, hit: false, rolling: false,
  landed: false, airT: 0, hangT: 0, apex: 0, catchChecked: false,
  spin: 0, spinAxis: 0, trail: [],

  deliver(d) {
    const t1 = Math.max(0.05, (d.pitchX - RELEASE_X) / d.pace);
    this.x = RELEASE_X; this.y = RELEASE_Y; this.z = d.releaseZ;
    this.vx = d.pace;
    this.vy = (0.5 * G * t1 * t1 - RELEASE_Y) / t1;
    this.az = d.az || 0;
    this.vz = (d.pitchZ - d.releaseZ - 0.5 * this.az * t1 * t1) / t1;
    this.live = true; this.bounced = false; this.hit = false; this.rolling = false;
    this.landed = false; this.airT = 0; this.hangT = 0; this.apex = 0; this.catchChecked = false;
    this.turn = d.turn || 0;
    this.rest = d.rest;
    this.trail.length = 0;
    this.spin = 0;
    this.spinAxis = d.spinAxis || 0;
  },

  /* Where will it be when it reaches the bat? Same maths, run forward. */
  predict(d) {
    const t1 = Math.max(0.05, (d.pitchX - RELEASE_X) / d.pace);
    const vy0 = (0.5 * G * t1 * t1 - RELEASE_Y) / t1;
    const az = d.az || 0;
    const vz0 = (d.pitchZ - d.releaseZ - 0.5 * az * t1 * t1) / t1;
    const tc = (CONTACT_X - RELEASE_X) / d.pace;
    let y, z, tBounce = t1;
    if (tc <= t1) {                       // arrives before pitching (yorker)
      y = RELEASE_Y + vy0 * tc - 0.5 * G * tc * tc;
      z = d.releaseZ + vz0 * tc + 0.5 * az * tc * tc;
      tBounce = null;
    } else {
      const vyB = (vy0 - G * t1) * -d.rest;
      const dt = tc - t1;
      y = vyB * dt - 0.5 * G * dt * dt;
      z = d.pitchZ + (vz0 + az * t1 + (d.turn || 0)) * dt;
    }
    return { t: tc, y: Math.max(0, y), z: z, tBounce: tBounce };
  },

  step(dt) {
    if (!this.live) return;
    if (this.hit && this.y > 0.12 && !this.rolling) this.airT += dt;
    if (this.hit && this.y > this.apex) this.apex = this.y;
    if (!this.bounced && !this.hit) this.vz += this.az * dt;   // swing, in the air only
    this.x += this.vx * dt;
    this.z += this.vz * dt;
    this.y += this.vy * dt;
    this.vy -= G * dt;
    if (this.y <= 0.036) {
      if (!this.bounced && !this.hit) {
        this.bounced = true;
        this.y = 0.036;
        this.vy = -this.vy * this.rest;
        this.vz += this.turn;             // spin and seam, off the pitch only
        this.vx *= 0.86;
      } else {
        if (this.hit && !this.landed) { this.landed = true; this.hangT = this.airT; }
        this.y = 0.036;
        if (Math.abs(this.vy) > 1.2) {
          this.vy = -this.vy * 0.42;
          this.vx *= CFG.bounceKeep; this.vz *= CFG.bounceKeep;
        } else {
          this.vy = 0; this.rolling = true;
          const f = Math.pow(CFG.outfield, dt);
          this.vx *= f; this.vz *= f;
        }
      }
    }
    this.spin += dt * 26;
    this.trail.push({ x: this.x, y: this.y, z: this.z });
    if (this.trail.length > 26) this.trail.shift();
  },

  speed() { return Math.hypot(this.vx, this.vz); },
  distFromCentre() { return Math.hypot(this.x - PITCH_LEN / 2, this.z); },

  /* Where and when it comes down, solved rather than watched. Nothing slows
     a struck ball horizontally while it is in the air, so this is exact from
     the moment it leaves the bat — which is what lets a fielder be sent to
     the right patch of grass in time to be standing under it. */
  landing() {
    if (this.y <= 0.04 && this.vy <= 0) return null;
    const t = (this.vy + Math.sqrt(this.vy * this.vy + 2 * G * Math.max(0, this.y))) / G;
    return { t: t, x: this.x + this.vx * t, z: this.z + this.vz * t };
  },

  draw() {
    if (!this.live) return;
    for (let i = 0; i < this.trail.length; i++) {
      const t = this.trail[i], a = i / this.trail.length;
      const p = proj(t.x, t.y, t.z);
      if (p.behind) continue;
      ctx.globalAlpha = a * 0.45;
      Art.disc(p, clamp(0.055 * p.s * PPM * a, 0.4, 30), this.hit ? PAL.gold : PAL.ball);
    }
    ctx.globalAlpha = 1;
    const p = proj(this.x, this.y, this.z);
    if (p.behind) return;
    const r = clamp(0.075 * p.s * PPM, 2.6, 44);
    // a shadow under it, which is most of how height reads down the pitch
    if (this.y > 0.1) {
      const sp = proj(this.x, 0, this.z);
      if (!sp.behind) {
        ctx.fillStyle = 'rgba(0,0,0,0.20)';
        ctx.beginPath();
        ctx.ellipse(sp.x, sp.y, r * 0.9, r * 0.34, 0, 0, TAU); ctx.fill();
      }
    }
    Art.disc(p, r, PAL.ball);
    // the seam: with no faces and no fingers, this white stripe on a red
    // circle is one of the only moving details there is to read.
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(this.spinAxis + this.spin);
    ctx.strokeStyle = PAL.white; ctx.lineWidth = Math.max(1, r * 0.28);
    ctx.beginPath(); ctx.moveTo(-r * 0.92, 0); ctx.lineTo(r * 0.92, 0); ctx.stroke();
    ctx.restore();
  },
};

/* ===================== THE FIELD =====================
   Eleven men, in positions with names. Club is a ring with two saved on
   the rope; island adds a gully and pushes one back. From island senior
   the Dossier moves a man into whichever zone you have actually been
   scoring in — diversify or wear it. */
function placeFielder(key, level, R) {
  const p = POS[key];
  const r = p.deep ? p.r * R : p.r * level.fieldSpread;
  const a = p.a + rnd(-2.5, 2.5);
  const rr = r + rnd(-1.0, 1.0);
  const f = {
    key: key, name: p.name, a: a, r: rr,
    x: CONTACT_X - Math.cos(deg(a)) * rr,
    z: -Math.sin(deg(a)) * rr,
    chase: 0, cx: 0, cz: 0,
  };
  f.hx = f.x; f.hz = f.z;
  return f;
}

function buildField(level, dossier, setKey) {
  const R = level.boundary;
  const preset = setKey && FIELD_SETS.find(s => s.key === setKey);
  const names = preset ? preset.men.slice()
    : (M.format && FIELDS[M.format.field] ? FIELDS[M.format.field] : level.field).slice();
  let flagged = null;

  if (level.dossier && dossier) {
    let best = 0;
    for (let i = 1; i < dossier.length; i++) if (dossier[i] > dossier[best]) best = i;
    if (dossier[best] >= 3) {
      // put a man in your zone, taking him from wherever he is least missed
      const want = COVERING[best].find(k => names.indexOf(k) < 0);
      if (want) {
        let worst = 0, wd = -1;
        for (let i = 0; i < names.length; i++) {
          const d = Math.abs(wrapPi(deg(POS[names[i]].a - SHOTS[best].ang)));
          if (d > wd) { wd = d; worst = i; }
        }
        names[worst] = want;
        flagged = want;
      }
    }
  }

  const f = names.map(k => placeFielder(k, level, R));
  if (flagged) { const m = f.find(p => p.key === flagged); if (m) m.flagged = true; }

  const keeper = placeFielder('keeper', level, R);
  keeper.keeper = true; keeper.z = -0.05; keeper.hz = -0.05;
  f.push(keeper);

  // the bowler, in his follow-through, is the eleventh man
  // He fields from where his follow-through leaves him, a few strides down
  // the pitch and slightly to the off — which is also the only place a
  // caught and bowled can plausibly happen.
  const bowler = { key: 'bowler', name: 'BOWLER', bowler: true, a: -7, r: 15.5,
                   x: CONTACT_X - Math.cos(deg(-7)) * 15.5, z: -Math.sin(deg(-7)) * 15.5,
                   chase: 0 };
  bowler.hx = bowler.x; bowler.hz = bowler.z;
  f.push(bowler);
  return f;
}

/* A fielder's position right now — his station, or wherever he has run to. */
const fx = p => p.chase ? p.cx : p.x;
const fz = p => p.chase ? p.cz : p.z;

/* ===================== SHOT RESOLUTION =====================
   Stats never roll outcomes. They set window width and deviation cone size;
   the input decides everything else. */
function timingWindows(mods) {
  const w = mods.widen || 1;
  /* The outer edge of the envelope gets its own multiplier, because widening
     everything equally made the easy setting *more* dangerous: every ball a
     beginner used to miss harmlessly became a nick he could be caught off.
     Pulling the outer band in on easy turns those back into plays and misses,
     which cost nothing but the ball. */
  const e = mods.edge === undefined ? w : mods.edge;
  return { middle: WIN.middle * w, good: WIN.good * w, edge: WIN.edge * e };
}

/* What a shot is for: a length, a height, and — now that the bat has to
   reach — a line. Playing a cut at a ball on the stumps was always a bad
   idea; until the blade had a position it was only a worse deviation cone. */
function shotAppropriate(shot, contactY, bandKey, contactZ) {
  const hOk = contactY >= shot.likeH[0] - 0.2 && contactY <= shot.likeH[1] + 0.2;
  const lOk = shot.likeLen.indexOf(bandKey) >= 0;
  let base = hOk && lOk ? 1.0 : hOk || lOk ? 0.82 : 0.62;
  if (contactZ !== undefined) {
    base *= clamp(1.06 - Math.abs(contactZ - shot.reachZ) * 0.42, 0.62, 1);
  }
  return base;
}

/* Turn a swing into a struck ball, then let go of it. Nothing about the
   result is scripted — the field deals with what it is given. */
function playShot(o) {
  const { power, angleDeg, lift, contactY } = o;
  const a = deg(angleDeg);
  const vFlat = power * Math.cos(lift);
  Ball.hit = true;
  Ball.bounced = true;                  // a struck ball is done with the pitch
  Ball.rolling = false;
  Ball.x = CONTACT_X; Ball.y = Math.max(0.25, contactY);
  Ball.vx = -Math.cos(a) * vFlat;
  Ball.vz = -Math.sin(a) * vFlat;
  Ball.vy = power * Math.sin(lift);
  Ball.az = 0; Ball.turn = 0;
  Ball.rest = 0.42;
  Ball.landed = false; Ball.airT = 0; Ball.hangT = 0; Ball.apex = 0; Ball.catchChecked = false;
  Ball.trail.length = 0;
  return o.quality;
}

/* ===================== THE OUTFIELD AND THE RUN =====================
   The old build handed out runs from a distance lookup, which is why a ball
   rolling into a gap was worth the same single as a push to cover. This is
   the honest version: the ball keeps rolling, a fielder has to get to it,
   pick it up and throw it in, and the batters take whatever that clock lets
   them have. Two and three come out of it on their own. */
/* How good they are is a level signal in its own right: an easy ring gives
   you the half-second a hard one does not.

   But only when it is *their* ring. The difficulty setting describes the
   opposition, not the world — and until now it described the world, so
   turning the game down slowed your own fielders, shortened your own boundary
   and took the pace off your own bowling. Bowling was hardest on EASY, which
   is the wrong way round in a way nobody would report as a bug; they would
   just conclude the bowling half was broken. */
const MY_FIELD_SPEED = 6.4, MY_FIELD_REACT = 0.32;
const fieldSpeed = () => (M && M.phase === 'bowl') ? MY_FIELD_SPEED
                       : ((M && M.level && M.level.fieldSpeed) || 6.6);
const fieldReact = () => (M && M.phase === 'bowl') ? MY_FIELD_REACT
                       : ((M && M.level && M.level.fieldReact) || 0.30);
const FIELD_REACH = 2.0;      // dive, or a stuck-out boot
const THROW_SPEED = 24;
const THROW_RELEASE = 0.35;
const GATHER = 0.55;
/* Turning is the expensive part: a single is quick, the second costs a
   stop and a change of direction, and that is why threes are rare. */
const RUN_FIRST = 2.70, RUN_NEXT = 3.60, RUN_MARGIN = 0.35;

/* The ball on the ground: exponential drag, so it is quick early and dies
   late, which is what a fast outfield actually does. */
function rollPath() {
  const k = -Math.log(CFG.outfield);
  const sp = Math.max(0.4, Ball.speed());
  const ux = Ball.vx / sp, uz = Ball.vz / sp;
  const x0 = Ball.x, z0 = Ball.z;
  return {
    k: k, sp: sp, max: sp / k,
    at(s) { return { x: x0 + ux * s, z: z0 + uz * s }; },
    timeAt(s) { const q = 1 - s * k / sp; return q <= 0.01 ? 99 : -Math.log(q) / k; },
    distAt(t) { return sp / k * (1 - Math.exp(-k * t)); },
  };
}

function fieldTheBall(field) {
  const path = rollPath();
  const R = boundaryR();

  // how far along the path before it crosses the rope
  let sRope = path.max;
  for (let s = 0; s <= path.max; s += 0.4) {
    const p = path.at(s);
    if (Math.hypot(p.x - PITCH_LEN / 2, p.z) >= R) { sRope = s; break; }
  }

  // the first man who can get there
  let best = null;
  for (const f of field) {
    for (let s = 0; s <= sRope; s += 0.5) {
      const tb = path.timeAt(s);
      if (tb > 14) break;
      const p = path.at(s);
      const gap = Math.max(0, Math.hypot(p.x - fx(f), p.z - fz(f)) - FIELD_REACH);
      if (fieldReact() + gap / fieldSpeed() <= tb) {
        if (!best || tb < best.t) best = { f: f, s: s, t: tb, x: p.x, z: p.z };
        break;
      }
    }
  }
  if (!best) return { four: true, path: path, sRope: sRope };

  // gather, then throw at whichever end is closer to him
  const toStriker = Math.hypot(best.x - PITCH_LEN, best.z);
  const toBowler = Math.hypot(best.x, best.z);
  const tx = toStriker < toBowler ? PITCH_LEN : 0;
  const throwT = THROW_RELEASE + Math.min(toStriker, toBowler) / THROW_SPEED;
  const total = best.t + GATHER + throwT;

  let runs = 0, t = 0;
  while (runs < 4) {
    const per = runs === 0 ? RUN_FIRST : RUN_NEXT;
    if (t + per <= total - RUN_MARGIN) { t += per; runs++; } else break;
  }

  return {
    four: false, runs: runs, path: path,
    fielder: best.f, s: best.s, tIntercept: best.t, x: best.x, z: best.z,
    gather: GATHER, throwT: throwT, total: total, tx: tx, tz: 0,
  };
}

/* ===================== THE CATCHER =====================
   A catch is a man getting to the ball, not a radius around where it lands.

   The first build judged catches at the bounce with a reach that grew with
   hang time — up to a dozen metres for a skier — and then dropped the ball
   into the hands of whoever qualified. On the scorecard that reads fine. On
   screen the ball came down in an empty patch of outfield and teleported
   into somebody standing a long way away, which is not a catch anyone
   believes.

   So the decision is made in the air instead. The moment the ball is struck
   its landing point is known exactly; whoever can get there in time is sent,
   and you watch him run under it. He is standing on the spot when the ball
   arrives, so the take happens where the ball actually was. If nobody can
   get there, nobody catches it — and the man who was sent is already at the
   ball, so he fields it immediately, which is right too. */
const CATCH_REACH = 2.1;                 // dive, or a hand stuck out

const Catcher = {
  who: null, x: 0, z: 0, t0: 0, t1: 0,

  clear() { if (this.who) { this.who.chase = 0; } this.who = null; },

  /* Called once, the instant the ball is struck. */
  commit(field, opts) {
    this.clear();
    const L = Ball.landing();
    if (!L || L.t < 0.45) return;                       // never up long enough
    if (Math.hypot(L.x - PITCH_LEN / 2, L.z) >= boundaryR() - 0.5) return;   // it is six
    const reach = CATCH_REACH + (opts && opts.sharpCatching ? 0.5 : 0);
    let best = null;
    for (const p of field) {
      if (p.keeper && !(opts && opts.edged)) continue;   // he takes edges, not skiers
      // and he takes them behind the stumps. A keeper sprinting ten metres
      // past the batter to catch a soft edge is slip's job, or nobody's.
      if (p.keeper && L.x < CONTACT_X - 0.5) continue;
      const d = Math.hypot(L.x - p.hx, L.z - p.hz);
      if (fieldReact() + Math.max(0, d - reach) / fieldSpeed() <= L.t
          && (!best || d < best.d)) best = { p: p, d: d };
    }
    if (!best) return;
    this.who = best.p; this.x = L.x; this.z = L.z;
    this.t0 = now(); this.t1 = now() + L.t;
    best.p.chase = 2; best.p.cx = best.p.hx; best.p.cz = best.p.hz;
  },

  /* He runs. By the time the ball arrives he is standing on the spot. */
  update() {
    if (!this.who) return;
    const span = Math.max(0.12, this.t1 - this.t0 - fieldReact());
    const u = clamp((now() - this.t0 - fieldReact()) / span, 0, 1);
    this.who.cx = lerp(this.who.hx, this.x, u);
    this.who.cz = lerp(this.who.hz, this.z, u);
  },
  /* Is he there, with the ball in front of him? */
  holds() {
    return this.who && Math.hypot(Ball.x - this.who.cx, Ball.z - this.who.cz) < CATCH_REACH + 0.4;
  },
};

/* Watch a struck ball until something happens to it. Called every frame. */
function resolveTravel(field, opts) {
  if (Ball.distFromCentre() >= boundaryR()) {
    return { type: Ball.y > 0.4 && !Ball.rolling ? 'six' : 'four' };
  }
  // A flat ball straight at someone, chest high, taken where he stands. A
  // middled drive stays under this, which is the whole point. The keeper is
  // in this one only for an edge — a glance through the same airspace is a
  // legitimate shot and has to be allowed to run away.
  if (!Ball.rolling && Ball.y > 1.05 && Ball.y < 2.7 && Ball.vy > -7) {
    for (const p of field) {
      if (p.keeper && !opts.edged) continue;
      const reach = (p.keeper ? 1.25 : 1.9) + (opts.sharpCatching ? 0.4 : 0);
      if (Math.hypot(Ball.x - fx(p), Ball.z - fz(p)) < reach) return { type: 'caught', by: p };
    }
  }
  // And the one somebody ran under. Only the man who was sent for it, only if
  // he got there, and only if the ball ever went up — a drive that skims along
  // and pitches ten metres away is a ball to chase, not a chance.
  if (Ball.landed && !Ball.catchChecked) {
    Ball.catchChecked = true;
    if (Ball.apex > 1.4 && Ball.hangT > 0.45 && Catcher.holds()) {
      return { type: 'caught', by: Catcher.who };
    }
  }
  // Once it is down and nobody has caught it, the field has it. This has to
  // happen the moment it lands rather than once it has settled into a roll:
  // a ball still skidding past cover on its second bounce is a ball cover is
  // running at, and waiting for it to stop bouncing sent everything to the
  // rope untouched.
  if (Ball.landed) {
    const plan = fieldTheBall(field);
    if (plan.four) return { type: 'four' };
    return { type: 'runs', runs: plan.runs, plan: plan };
  }
  return null;
}

/* The chase: the fielder running it down, the throw coming back, and two
   batters turning for the second. Played out rather than announced, and
   compressed so the next ball is still seconds away. */
const Chase = {
  on: false, t: 0, speed: 1, plan: null, runs: 0, shown: 0, done: 0, sx: 0, sz: 0,

  start(plan, runs) {
    if (!plan || !plan.fielder) { this.on = false; return; }
    this.on = true; this.t = 0; this.plan = plan; this.runs = runs; this.shown = 0;
    // a dot only needs to show the ball being cut off; anything else plays
    // out to the throw coming back. Compressed so the next ball is close.
    this.done = runs === 0 ? plan.tIntercept + 0.5 : plan.total + 0.35;
    this.speed = clamp(this.done / 1.8, 1, 3.4);
    // he starts from where he is, which is not always where he stands: he may
    // already have run twenty metres going for the catch he did not get
    this.sx = fx(plan.fielder); this.sz = fz(plan.fielder);
    plan.fielder.chase = 1;
  },
  stop() {
    if (this.plan && this.plan.fielder) this.plan.fielder.chase = 0;
    this.on = false; this.plan = null;
  },
  /* Where the two of them are, as a fraction of a completed run. */
  progress() {
    let t = this.t, n = 0;
    while (n < this.runs) {
      const per = n === 0 ? RUN_FIRST : RUN_NEXT;
      if (t >= per) { t -= per; n++; } else return n + t / per;
    }
    return n;
  },
  update(dt) {
    if (!this.on) return;
    const p = this.plan;
    this.t += dt * this.speed;
    if (this.t < p.tIntercept) {
      const s = Math.min(p.s, p.path.distAt(this.t));
      const q = p.path.at(s);
      Ball.x = q.x; Ball.z = q.z;
      // still skidding when it was picked up: let it settle rather than
      // snapping flat the instant the chase takes the ball over
      Ball.y = 0.036 + Math.abs(Math.sin(this.t * 5.5)) * 0.65 * Math.exp(-this.t * 1.8);
      const u = clamp((this.t - fieldReact()) / Math.max(0.15, p.tIntercept - fieldReact()), 0, 1);
      p.fielder.cx = lerp(this.sx, p.x, u);
      p.fielder.cz = lerp(this.sz, p.z, u);
