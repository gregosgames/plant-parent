    } else if (this.t < p.tIntercept + p.gather) {
      Ball.x = p.x; Ball.z = p.z; Ball.y = 0.24;
      p.fielder.cx = p.x; p.fielder.cz = p.z;
    } else {
      const u = clamp((this.t - p.tIntercept - p.gather) / Math.max(0.15, p.throwT), 0, 1);
      Ball.x = lerp(p.x, p.tx, u); Ball.z = lerp(p.z, p.tz, u);
      Ball.y = 0.4 + Math.sin(u * Math.PI) * 2.6;
    }
    this.shown = Math.floor(this.progress());
    if (this.t >= this.done) this.stop();
  },
  /* The two of them, running. Drawn small and quick; they are information,
     not choreography. */
  draw(shirt) {
    if (!this.on) return;
    const pr = this.progress();
    const leg = Math.floor(pr);
    const frac = pr - leg;
    const flip = leg % 2 === 1;
    const a = lerp(CREASE_X - 0.3, FAR_CREASE_X + 0.3, flip ? 1 - frac : frac);
    const b = lerp(FAR_CREASE_X + 0.3, CREASE_X - 0.3, flip ? 1 - frac : frac);
    const cyc = Math.sin(this.t * 15) * 26;
    const K = M.phase === 'bat' ? myKit() : theirKit();
    // Whatever is on your head stays on it between the wickets. The runners
    // were hard-coded to a helmet, so a cap innings put a helmet on halfway
    // through every single.
    const lid = M.phase === 'bat' && M.striker().you && M.gear === 'cap' ? 'cap' : 'helmet';
    const one = { view: 'side', face: flip ? 1 : -1, shirt: K.shirt, trim: K.trim,
                  padCol: K.pads, capCol: K.cap, skin: K.skin, pads: true,
                  cap: lid, bat: true, batAng: 62, scale: 0.96,
                  legF: 16 + cyc, legB: -16 + cyc,
                  armF: 34 - cyc * 0.6, armB: 24 + cyc * 0.6, lean: 1.6 };
    Art.shadow(a, -1.25, 0.4, 0.2); Art.shadow(b, 1.25, 0.4, 0.2);
    drawFigure(a, -1.25, one);
    drawFigure(b, 1.25, Object.assign({}, one, { face: flip ? -1 : 1,
                                                 legF: 16 - cyc, legB: -16 - cyc }));
  },
};

/* ===================== THE TAKE =====================
   Somebody actually catches it. Freezing the ball in a fielder's hands and
   holding the pose is the whole difference between CAUGHT as a caption and
   CAUGHT as a thing you watched happen — and the same object does the
   keeper's work, so a ball you leave alone ends up in his gloves instead of
   sailing off the back of the ground. */
const Take = {
  on: false, t: 0, who: null, x: 0, y: 0, z: 0, keeper: false,

  start(p, y, keeper) {
    if (!p) return false;                // only ever true for a keeper gather
                                         // with no keeper set; a catch always
                                         // arrives here with the man who took it
    this.on = true; this.t = 0; this.who = p; this.keeper = !!keeper;
    this.x = p.chase ? p.cx : p.x;
    this.z = p.chase ? p.cz : p.z;
    this.y = clamp(y === undefined ? Ball.y : y, 0.30, 2.30);
    p.taking = now();
    Ball.x = this.x; Ball.z = this.z; Ball.y = this.y;
    Ball.vx = 0; Ball.vy = 0; Ball.vz = 0;
    Ball.rolling = false; Ball.live = true; Ball.trail.length = 0;
    return true;
  },
  stop() { if (this.who) this.who.taking = 0; this.on = false; this.who = null; },
  update(dt) {
    if (!this.on) return;
    this.t += dt;
    // he brings it in to his chest, and the ball goes with his hands
    const settle = clamp(this.t / 0.32, 0, 1);
    Ball.x = this.x; Ball.z = this.z;
    Ball.y = lerp(this.y, this.keeper ? 0.95 : 1.25, settle * settle);
  },
};

/* The keeper, out of whichever field is set. */
const keeperOf = field => (field || []).find(f => f.keeper) || null;

/* ===================== TUNING =====================
   The numbers the whole feel hangs off, in one place. */
const CFG = {
  swingSpeed: { control: 12.5, attack: 22.5, slog: 29.0 },
  qualityMult: { middle: 1.0, good: 0.74, edge: 0.40 },
  /* Middling one keeps it down; mistiming it puts it up. Loft is what gets
     you caught, so it must come from the shot you chose and the timing you
     missed — never from playing well. */
  typeLift: { control: 0.35, attack: 0.60, slog: 1.90 },
  qualityLift: { middle: 0.55, good: 1.15, edge: 2.60 },
  cone: { middle: 5, good: 13, edge: 38 },      // degrees, one sigma
  typeWiden: { control: 1.26, attack: 1.0, slog: 0.74 },
  backliftWiden: 0.22,
  outfield: 0.70,                                // velocity kept per second
  bounceKeep: 0.88,
  capSwagger: 1.42,                              // cap builds Swagger faster
  flourishBonus: 1.22,
  runupTime: 1.35,
};
/* ===================== INPUT ===================== */
const Input = {
  x: 0, y: 0, down: false, downT: 0, ox: 0, oy: 0,
  taps: [], releases: [], keys: {}, anyKey: false, keyDownT: {},
  init(canvas) {
    const pt = e => {
      const r = canvas.getBoundingClientRect();
      const t = e.touches && e.touches[0] ? e.touches[0] : e;
      return {
        x: (t.clientX - r.left) / r.width * VW,
        y: (t.clientY - r.top) / r.height * VH,
      };
    };
    const down = e => {
      e.preventDefault();
      const p = pt(e);
      this.x = p.x; this.y = p.y; this.ox = p.x; this.oy = p.y;
      this.down = true; this.downT = now();
      Snd.boot(); Snd.resume();
    };
    const move = e => { const p = pt(e); this.x = p.x; this.y = p.y; };
    const up = e => {
      e.preventDefault();
      if (!this.down) return;
      const held = now() - this.downT;
      this.down = false;
      this.releases.push({ x: this.x, y: this.y, ox: this.ox, oy: this.oy, t: now(), held: held });
      if (held < 0.30 && Math.hypot(this.x - this.ox, this.y - this.oy) < 26) {
        this.taps.push({ x: this.x, y: this.y, t: now() });
      }
    };
    canvas.addEventListener('mousedown', down);
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
    canvas.addEventListener('touchstart', down, { passive: false });
    canvas.addEventListener('touchmove', e => { e.preventDefault(); move(e); }, { passive: false });
    canvas.addEventListener('touchend', up, { passive: false });
    canvas.addEventListener('touchcancel', up, { passive: false });
    window.addEventListener('keydown', e => {
      // While a name is being typed the keyboard belongs to the text field,
      // not to the game — otherwise the space bar swings the bat.
      if (Typing.on) { Typing.key(e); e.preventDefault(); return; }
      if (this.keys[e.code]) return;
      this.keys[e.code] = true; this.anyKey = true;
      this.keyDownT[e.code] = now();
      Snd.boot(); Snd.resume();
      if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
      if (e.code === 'KeyM') Snd.toggle();
    });
    window.addEventListener('keyup', e => {
      this.keys[e.code] = false;
      if (e.code === 'Space' && this.keyDownT.Space) {
        const held = now() - this.keyDownT.Space;
        this.releases.push({ x: this.x, y: this.y, ox: this.ox, oy: this.oy, t: now(), held: held, key: true });
        this.keyDownT.Space = 0;
      }
    });
  },
  charging() { return this.down || !!this.keys.Space; },
  /* How long the thumb has been down. Hold time is intent, so this is the
     number the power meter draws. */
  heldFor() {
    if (this.down) return now() - this.downT;
    if (this.keys.Space && this.keyDownT.Space) return now() - this.keyDownT.Space;
    return 0;
  },
  takeTap() { return this.taps.shift(); },
  takeRelease() { return this.releases.shift(); },
  flush() { this.taps.length = 0; this.releases.length = 0; },
};

/* Where the striker is on screen — the fan hangs off him and the aim is
   read relative to him. */
function batterScreen() {
  const p = proj(CREASE_X + 0.45, 1.0, -0.72);
  return p.behind ? { x: VW / 2, y: VH * 0.68 } : p;
}

/* The aim. One thumb, anywhere: a virtual stick from wherever it landed.
   Zones are read in screen angles, not world angles, so what you flick is
   exactly what you see on the fan.

   The six names are labels on a continuum, not six fixed lines. Where you
   point between two of them is where the ball goes, because the ring is set
   at the positions the six shots are named after — a cover drive aimed at
   COVER is a cover fielder's catch, and the whole second layer of batting is
   picking the gap next to him. This is §3's "direction becomes which gap",
   and it costs nothing on a phone: you were already dragging. */
const AIM = SHOTS.map((s, i) => ({ sdeg: s.sdeg, ang: s.ang, i: i }))
                 .sort((a, b) => b.sdeg - a.sdeg);
const AIM_EDGE = 0.85;                   // degrees of world per degree of screen, past the ends

function aimFromScreen(phi) {
  const first = AIM[0], last = AIM[AIM.length - 1];
  if (phi >= first.sdeg) return { zone: first.i, ang: first.ang - (phi - first.sdeg) * AIM_EDGE };
  if (phi <= last.sdeg) return { zone: last.i, ang: last.ang - (phi - last.sdeg) * AIM_EDGE };
  for (let i = 0; i < AIM.length - 1; i++) {
    const a = AIM[i], b = AIM[i + 1];
    if (phi <= a.sdeg && phi >= b.sdeg) {
      const t = (a.sdeg - phi) / (a.sdeg - b.sdeg);
      return { zone: t < 0.5 ? a.i : b.i, ang: lerp(a.ang, b.ang, t) };
    }
  }
  return { zone: 2, ang: SHOTS[2].ang };
}

function readAim(fallback) {
  for (let i = 0; i < 6; i++) {
    if (Input.keys['Digit' + (i + 1)]) return { zone: i, ang: SHOTS[i].ang };
  }
  let dx, dy;
  if (Input.down) {
    dx = Input.x - Input.ox; dy = Input.y - Input.oy;
    if (Math.hypot(dx, dy) < 24) return fallback;
  } else if (!('ontouchstart' in window)) {
    const b = batterScreen();
    dx = Input.x - b.x; dy = Input.y - b.y;
    if (Math.hypot(dx, dy) < 52) return fallback;
  } else return fallback;
  return aimFromScreen(Math.atan2(dx, -dy) * 180 / Math.PI);
}
/* The screen direction a world angle points in — the fan's live pointer. */
function screenFromAim(ang) {
  for (let i = 0; i < AIM.length - 1; i++) {
    const a = AIM[i], b = AIM[i + 1];
    if (ang >= a.ang && ang <= b.ang) {
      return lerp(a.sdeg, b.sdeg, (ang - a.ang) / (b.ang - a.ang));
    }
  }
  return ang <= AIM[0].ang ? AIM[0].sdeg - (ang - AIM[0].ang) / AIM_EDGE
                           : AIM[AIM.length - 1].sdeg - (ang - AIM[AIM.length - 1].ang) / AIM_EDGE;
}

/* ===================== MATCH STATE ===================== */
const M = {
  level: LEVELS[0], mode: 'match', phase: 'bat',
  gear: 'helmet', style: STYLES[0], format: formatByKey('t10'), playAs: PLAY_AS[0],
  bowlerAs: null, myOrder: 4,
  inns: 1, log: [],       // which innings of the match, and the finished ones
  mySlot: 0, myOther: -1, nextIn: 11,    // striker, non-striker, next man in
  swagger: 0,
  dossier: [0, 0, 0, 0, 0, 0],
  bat: null, bowl: null, field: null, attack: null,
  msg: '', msgT: 0, msgBig: false,
  hitstop: 0, flash: 0,
  bowlerMood: 0,          // >0 he is rattled, <0 he is on top
  batterConf: 0.5,
  showNames: true,

  reset(level, mode) {
    this.level = level; this.mode = mode;
    this.phase = mode === 'bowlPractice' ? 'bowl' : 'bat';
    this.myOrder = clamp(Save.data.player.order | 0, 1, 11);
    this.swagger = 0;
    this.dossier = [0, 0, 0, 0, 0, 0];
    this.bowlerMood = 0; this.batterConf = 0.5;
    // who you are playing, who you are playing for, and where
    this.oppo = pick(NATIONS);
    this.us = pick(NATIONS.filter(n => n !== this.oppo));
    this.ground = pick(GROUNDS[this.oppo.code]);
    this.light = pick(LIGHTS);
    this.inns = 1; this.log = [];
    this.field = buildField(level, null);

    // their eleven, and yours. You bat at your number; in MY PLAYER the rest of
    // your side is simmed at the innings break to add up to the total you are
    // defending, and in WHOLE TEAM you bat every one of them yourself.
    const used = [];
    this.theirEleven = [];
    for (let i = 0; i < 11; i++) this.theirEleven.push(castMember(this.oppo, used).name);
    // Their attack is four of the same eleven, taken from the bottom of the
    // order, because the men who bowl at you are the men you bowl at — the
    // first pass drew two separate name lists and the card read as though
    // they had turned up with a second team.
    this.attack = level.attack.map((k, i) => (
      { name: this.theirEleven[10 - i], style: styleByKey(k), balls: 0, runs: 0, wickets: 0 }
    ));
    const mine = [];
    this.myEleven = [];
    for (let i = 0; i < 11; i++) {
      const m = castMember(this.us, mine);
      this.myEleven.push(m.name);
    }
    this.myEleven[this.myOrder - 1] = Save.data.player.name || 'YOU';
    this.startMyInnings();
    this.startTheirInnings();

    // Your side's attack: you, and three team-mates who can bowl. In WHOLE
    // TEAM you choose which of them takes each over; as MY PLAYER you bowl
    // your own spell and the rest is theirs.
    this.myAttack = [{ name: Save.data.player.name || 'YOU', you: true,
                       style: this.style, balls: 0, runs: 0, wickets: 0 }];
    ['fast', 'medium', 'finger', 'wrist']
      .filter(k => k !== this.style.key).slice(0, 3)
      .forEach((k, i) => {
        this.myAttack.push({ name: this.myCard[10 - i].name, style: styleByKey(k),
                             balls: 0, runs: 0, wickets: 0 });
      });
    this.bowlerAs = this.myAttack[0];
    if (BAT_ONLY && mode === 'match') this.setChase();



    this.msg = ''; this.msgT = 0;
    Chase.stop(); Take.stop(); Catcher.clear();
  },
  /* The batting-only build never bowls, so the innings it is chasing has to
     exist without being played. A total for the format and the difficulty,
     spread down a card that adds up, logged as a completed innings so the
     result and the scorecard read exactly as they do in the full game. */
  setChase() {
    const balls = this.format.overs * 6;
    // A chase has to be worth chasing. Par for the *bowling side* is not the
    // number to set here: on the easy setting you score at three times it, so
    // a par total is over by the fourth over. The target scales with how
    // freely the setting lets you bat.
    const total = Math.max(14, Math.round(balls * this.parRate()
                                          * (this.level.chasePar || 1) * rnd(0.86, 1.14)));
    const wkts = clamp(2 + (Math.random() * 8 | 0), 2, 9);
    fillCard(this.theirCard, total, wkts, this.myAttack);
    this.bowl.runs = total; this.bowl.wickets = wkts; this.bowl.balls = balls;
    this.bat.target = total + 1;
    this.log.push({ side: 'them', inns: 1, name: this.oppo.name,
                    card: this.theirCard.map(c => Object.assign({}, c)),
                    runs: total, wickets: wkts, balls: balls, extras: 0 });
  },

  /* A fresh innings for your side. Called at the top of the match and again
     for a Test's second innings: same eleven, clean card, clean counters.

     `bat.runs` and `bat.balls` are the innings' — the side's — not one man's;
     what any individual made is on his own line of the card. That is the
     difference between MY PLAYER, where you are the only one of them anybody
     plays, and WHOLE TEAM, where you are all eleven. */
  startMyInnings() {
    const solo = this.playAs.key === 'player' && this.mode === 'match';
    this.bat = {
      runs: 0, balls: 0, fours: 0, sixes: 0, out: false, howOut: '',
      overs: this.mode === 'batPractice' ? 99 : this.format.overs,
      teamRuns: 0, extras: 0, before: 0, wickets: 0, dots: 0, overRuns: 0,
      target: 0,
    };
    this.myCard = this.myEleven.map((n, i) => ({
      name: n, you: i === this.myOrder - 1,
      runs: 0, balls: 0, out: false, how: 'dnb',
    }));
    if (solo) {
      /* Where your number puts you. Opening is a fresh sheet; coming in at
         seven is four down with the overs going, and fewer of them left. */
      this.mySlot = this.myOrder - 1;
      this.bat.wickets = this.myOrder - 1;
      // How much of the innings is already gone, and what it is worth. Both
      // are read off the format: six down in a five-over game is a different
      // situation from six down in twenty, and pricing a wicket at a flat
      // ten runs made a long format's total silly.
      const spent = Math.min(this.format.overs - 1,
                             Math.round((this.myOrder - 1) * 0.09 * this.format.overs));
      this.bat.before = Math.round(spent * 6 * this.parRate() * rnd(0.75, 1.25));
      this.bat.overs = Math.max(1, this.format.overs - spent);
      for (let i = 0; i < this.mySlot; i++) this.myCard[i].how = 'not out';
      this.myOther = -1;                 // no partner is modelled: it is you
      this.nextIn = 11;
    } else {
      // and you bat every one of them, two at a time, in order
      this.mySlot = 0; this.myOther = 1; this.nextIn = 2;
      this.myCard[1].how = 'not out';
    }
    this.myCard[this.mySlot].how = 'not out';
    this.swagger = 0;
  },
  /* They cross on an odd run and change ends at the end of the over, which
     is what makes a card read as a team's innings rather than one man's. */
  swapEnds() {
    if (this.myOther < 0) return;
    const t = this.mySlot; this.mySlot = this.myOther; this.myOther = t;
  },
  /* Out, and the next man walks. Returns false when there is nobody left. */
  nextBatter() {
    if (this.myOther < 0 || this.nextIn > 10) return false;
    this.mySlot = this.nextIn++;
    this.myCard[this.mySlot].how = 'not out';
    return true;
  },
  /* And a fresh one for theirs. */
  startTheirInnings() {
    this.bowl = {
      overs: this.mode === 'bowlPractice' ? 99 : this.format.overs,
      balls: 0, runs: 0, wickets: 0, maxWickets: 10, variLeft: 2,
      lastBands: [], target: 0, extras: 0,
    };
    this.theirCard = this.theirEleven.map(n => (
      { name: n, runs: 0, balls: 0, out: false, how: 'dnb' }
    ));
    // Their innings has two men at the crease too. It used to have one, who
    // faced every ball until he was out — which read exactly as badly on
    // their card as it did on ours.
    this.theirOut = 0;
    this.theirStrike = 0; this.theirOther = 1; this.theirNext = 2;
    this.attack.forEach(a => { a.balls = 0; a.runs = 0; a.wickets = 0; });
    if (this.myAttack) this.myAttack.forEach(a => { a.balls = 0; a.runs = 0; a.wickets = 0; });
  },
  /* The man on strike, whoever that is this over. */
  striker() { return this.myCard[Math.min(this.mySlot, 10)]; },
  /* What your side is on: the runs off the bat, plus the extras. */
  myScore() { return this.bat.before + this.bat.runs + this.bat.extras; },

  bowlerNow() { return this.attack[Math.floor(this.bat.balls / 6) % this.attack.length]; },
  /* Whoever is on strike for them. Their card is filled in as the innings
     happens rather than invented at the end, so the scorecard is a record of
     what you actually did to them. */
  theirBatter() {
    const c = this.theirCard[Math.min(this.theirStrike, 10)];
    // The moment a man is on strike he has batted, so the card stops calling
    // him a did-not-bat — which is what it called every unbeaten batsman in
    // an innings that ended on overs rather than on wickets.
    if (c && c.how === 'dnb') c.how = 'not out';
    return c;
  },
  theirPartner() {
    const c = this.theirCard[Math.min(Math.max(0, this.theirOther), 10)];
    return this.theirOther >= 0 && this.theirOther <= 10 ? c : null;
  },
  theirSwap() {
    if (this.theirOther < 0) return;
    const t = this.theirStrike; this.theirStrike = this.theirOther; this.theirOther = t;
  },
  theirNextBatter() {
    if (this.theirNext > 10) { this.theirOther = -1; return false; }
    this.theirStrike = this.theirNext++;
    const c = this.theirCard[this.theirStrike];
    if (c.how === 'dnb') c.how = 'not out';
    return true;
  },
  /* Par, per ball, for the side and the tempo this format asks for. Used
     wherever an innings has to be filled in rather than played. */
  parRate() {
    return (1.05 + LEVELS.indexOf(this.level) * 0.08)
         * (1 - (this.format.aiPatience || 0) * 0.5);
  },
  say(text, big) { this.msg = text; this.msgT = now(); this.msgBig = !!big; },
};

/* An edge is a deflection, not a shot. It leaves the face at whatever angle
   the face was pointing and carries on behind square — which is the whole
   reason there is a man at slip. Most of them are outside edges, so the
   cordon sees about two thirds of them and fine leg the rest; the ones that
   stay in front are the thick edges that squirt off the middle of nowhere. */
function edgeDeflect(angle) {
  if (Math.random() >= 0.62) return angle;      // thick edge: roughly where he aimed
  const side = Math.random() < 0.66 ? -1 : 1;   // -1 is the off side, and the slips
  return side * rnd(104, 172);
}

/* A ball that went behind square off the edge kept the pace and lost the
   height — most nicks run away for runs and only some of them carry, which
   is why the cordon is a lottery rather than a wall. */
function edgeLift(base, angle) {
  return Math.abs(angle) > 100 ? base * 0.30 + rnd(0, 0.55) : base + rnd(0, 0.45);
}

/* ===================== BATTING =====================
   One gesture does everything. Press and release: the release is your
   timing, how long you held is your intent, and where you dragged is your
   zone. Press before the bowler lets go and you have raised your backlift —
   a wider window for having shown your hand.

   The camera is behind you now, so length is read by watching the ball
   climb rather than by reading a bar. The marker is still there at club
   level and it still goes away. */
const Bat = {
  phase: 'ready', t: 0, d: null, pred: null,
  zone: 2, aim: { zone: 2, ang: SHOTS[2].ang }, swung: false, swingInfo: null, contactT: 0,
  earlyHold: false, backlift: 0, marker: null, outcome: null,
  ghost: null, flourish: false, lastBackliftZone: -1, swingT: -9,
  bowler: null, runup: 1.35, releaseT: 0,

  nextBall() {
    const T = M.level;
    this.phase = 'ready'; this.t = 0; this.swung = false;
    this.outcome = null; this.ghost = null; this.flourish = false;
    this.earlyHold = false; this.backlift = 0; this.swingT = -9;
    this.marker = null; this.pastStumps = null;
    Chase.stop(); Take.stop(); Catcher.clear(); Stumps.clear();
    Input.flush();

    this.bowler = M.bowlerNow();
    const S = this.bowler.style;
    // one over in four he goes to his variation, and you have to spot it
    const useVari = Math.random() < (S.vari.limited ? 0.12 : 0.30);
    const del = useVari ? S.vari : S.stock;

    // High Swagger degrades his accuracy — a batter making good bowlers
    // bowl badly, and the only real counter to a field that has you worked out.
    const pressure = M.swagger * 0.55;
    const wayward = T.wayward * (1 + pressure) * S.scatter;
    let bandIdx = 2 + Math.round(randn() * (0.85 + pressure));
    if (T.dossier && this.lastBackliftZone >= 0) {
      bandIdx += SHOTS[this.lastBackliftZone].likeLen.indexOf('short') >= 0 ? 1 : -1;
    }
    bandIdx = clamp(bandIdx, 0, 4);
    const band = del.bouncer ? BOUNCER_BAND : BANDS[bandIdx];
    // Loose should mean hittable, not unplayable. The lateral spread used to
    // run to two thirds of a metre of standard deviation at the easy end,
    // which put a steady trickle of deliveries outside anybody's reach; the
    // difficulty now lives in the length band, which is where a batter feels
    // it anyway.
    const lineZ = clamp(randn() * (0.30 + wayward * 0.42) + 0.10, -1.5, 1.7);
    const pace = rnd(S.pace[0], S.pace[1]) * T.paceMul * (del.paceMul || 1) * (1 - pressure * 0.05);

    this.d = {
      pace: pace,
      pitchX: clamp(band.px + randn() * (0.42 + wayward * 0.75) - (del.loop ? 0.6 : 0), 9.5, 20.0),
      pitchZ: lineZ,
      releaseZ: lineZ * 0.30 + 0.34,
      rest: band.rest * S.restMul,
      az: (del.swing || 0) + randn() * 0.18,
      turn: (del.turn || 0) * rnd(0.75, 1.15) + randn() * ((del.wobble || 0) + 0.28 + wayward * 0.4),
      band: band, style: S, del: del,
      spinAxis: isSpin(S) ? 1.2 : 0,
    };
    this.pred = Ball.predict(this.d);
    this.runup = CFG.runupTime * (isSpin(S) ? 0.72 : 1);
    Ball.live = false;
    Cam.home(false);
  },

  update(dt) {
    this.t += dt;
    const T = M.level;

    if (this.phase === 'ready') {
      if (this.t > 0.45) { this.phase = 'runup'; this.t = 0; }
      return;
    }

    if (this.phase === 'runup') {
      if (Input.charging()) this.earlyHold = true;
      this.aim = readAim(this.aim); this.zone = this.aim.zone;
      if (this.t >= this.runup) {
        Ball.deliver(this.d);
        this.releaseT = now();
        this.contactT = this.releaseT + this.pred.t;
        this.phase = 'flight'; this.t = 0;
        this.backlift = this.earlyHold ? 1 : 0;
        this.lastBackliftZone = this.earlyHold ? this.zone : -1;
        Input.flush();
      }
      return;
    }

    if (this.phase === 'flight') {
      Ball.step(dt);
      this.aim = readAim(this.aim); this.zone = this.aim.zone;
      if (this.pred.tBounce !== null) {
        const showAt = Math.max(0, this.pred.tBounce - T.markerLead);
        if (this.t >= showAt) this.marker = { x: this.d.pitchX, z: this.d.pitchZ };
      }
      const rel = Input.takeRelease();
      if (rel && !this.swung) this.swing(rel);
      else if (!this.swung && now() > this.contactT + 0.20) this.swing(null);
      if (this.swung && Ball.hit && this.outcome === null) {
        Catcher.update();
        const r = resolveTravel(M.field, {
          sharpCatching: T.dossier,
          edged: this.swingInfo && this.swingInfo.quality === 'edge',
        });
        if (r) this.finish(r);
        const d = Ball.distFromCentre();
        Snd.travelTo(200 + d * 9);
        Cam.chase(Ball.x, Ball.y, Ball.z);
      }
      // remember what it was doing as it went past the stumps: that, not
      // where it ends up in the keeper's gloves, is what decides bowled
      if (!Ball.hit && !this.pastStumps && Ball.x >= CONTACT_X) {
        this.pastStumps = { z: Ball.z, y: Ball.y };
      }
      if (!Ball.hit && Ball.x > this.keeperX() - 0.3) {
        const ps = this.pastStumps;
        this.finish(ps && isWide(ps.z) && !this.swungAndConnected()
                    ? { type: 'wide' } : { type: 'through' });
      }
      if (this.t > 6) this.finish({ type: 'runs', runs: 0 });
      return;
    }

    if (this.phase === 'result') {
      if (Take.on) Take.update(dt);
      else if (Chase.on) { Chase.update(dt); Cam.chase(Ball.x, Ball.y, Ball.z); }
      else if (Ball.hit || Ball.live) Ball.step(dt);
      const wait = this.outcome && this.outcome.wicket ? 2.4 : 1.2;
      if (!Chase.on && this.t > wait) this.after();
    }
  },

  keeperX() { const k = keeperOf(M.field); return k ? k.x : CONTACT_X + 2.6; },
  swungAndConnected() { return this.swingInfo && this.swingInfo.quality !== 'miss'; },

  swing(rel) {
    this.swung = true;
    this.swingT = now();
    const T = M.level;
    if (!rel) { this.judgeMiss(true); return; }

    const dt = rel.t - this.contactT;
    const type = this.earlyHold || rel.held > 0.42 ? 'slog'
               : rel.held < 0.15 ? 'control' : 'attack';
    const shot = SHOTS[this.zone];
    const aimAng = this.aim.ang;
    const approp = shotAppropriate(shot, this.pred.y, this.d.band.key, this.pred.z);

    let widen = CFG.typeWiden[type] * (0.72 + approp * 0.34) * (T.batWindow || 1);
    if (M.gear === 'cap' && (this.d.band.key === 'short' || this.d.band.key === 'bouncer')) widen *= 0.80;
    if (this.backlift) widen += CFG.backliftWiden;
    if (M.bat.balls < 2) widen += T.newBatter;
    const w = timingWindows({ widen: widen, edge: widen * (T.edgeWiden || 1) });

    const err = Math.abs(dt);
    let quality = err < w.middle ? 'middle' : err < w.good ? 'good'
                : err < w.edge ? 'edge' : 'air';

    // Can the bat even get there? Outside the swept arc it is a swing at
    // nothing; right on the edge of it you get wood on it and no more.
    const reach = batReach(shot, type, this.pred.y, this.pred.z);
    this.reach = reach;
    if (reach > 1.26) quality = 'air';
    else if (reach > 1.06 && quality !== 'air') quality = 'edge';
    else if (reach > 0.88 && quality === 'middle') quality = 'good';

    this.flourish = M.swagger >= 0.999 && type === 'slog';
    if (quality === 'air') { this.judgeMiss(false, dt); return; }

    let cone = CFG.cone[quality] * (type === 'slog' ? 1.5 : 1) * (2 - approp);
    if (this.flourish) cone *= quality === 'middle' ? 0.7 : 2.1;
    let angle = aimAng + randn() * cone;
    if (quality === 'edge') angle = edgeDeflect(angle);
    let power = CFG.swingSpeed[type] * CFG.qualityMult[quality] * shot.power * approp;
    power *= (T.powerMul || 1);          // an easy pitch is a fast outfield too
    power *= 1 + M.swagger * 0.10;
    if (this.flourish) power *= CFG.flourishBonus;
    // Loft is what gets you caught, so the easy setting keeps the ball down:
    // a boundary every other ball is no use if every third one is a skier.
    let lift = shot.lift * CFG.typeLift[type] * CFG.qualityLift[quality] * (T.liftMul || 1);
    if (quality === 'edge') lift = edgeLift(lift, angle);

    this.swingInfo = { type: type, quality: quality, err: dt, approp: approp };
    this.ghost = { intended: aimAng, actual: angle };
    playShot({ quality: quality, power: power, angleDeg: angle, lift: lift, contactY: this.pred.y });
    Catcher.commit(M.field, { sharpCatching: T.dossier, edged: quality === 'edge' });
    Snd.bat(quality === 'edge' ? 'edge' : 'middle');
    if (quality === 'middle') {
      M.hitstop = 0.05; M.flash = 1; Cam.kick(this.flourish ? 0.9 : 0.5);
    } else if (quality === 'good') { M.hitstop = 0.028; Cam.kick(0.22); }
    Snd.travel(220);
  },

  judgeMiss(noShot, dt) {
    this.swingInfo = { type: 'miss', quality: 'miss', err: dt || 0 };
    Snd.bat('miss');
    M.bowlerMood = Math.max(-1, M.bowlerMood - 0.35);
  },

  finish(r) {
    if (this.outcome) return;
    Snd.travelEnd();
    const b = M.bat;
    const o = { wicket: false, runs: 0, label: '', how: '', wide: r.type === 'wide' };

    if (r.type === 'wide') {
      // A wide is an extra: it goes to the side, not to the man on strike,
      // and it does not count as a ball faced either.
      b.extras++;
      o.label = 'WIDE';
      Take.start(keeperOf(M.field), Ball.y, true);
      M.say('WIDE', false);
      this.outcome = o;
      this.phase = 'result'; this.t = 0;
      if (!Chase.on && !Take.on) Cam.home(false);
      return;
    }
    b.balls++;
    M.striker().balls++;

    if (r.type === 'caught') {
      o.wicket = true;
      o.label = r.by.keeper ? 'CAUGHT BEHIND' : 'CAUGHT';
      o.how = r.by.keeper ? 'c wk' : r.by.bowler ? 'c & b' : 'c ' + r.by.name.toLowerCase();
      Take.start(r.by, Ball.y);
      Cam.chase(Take.x, 1.5, Take.z);
    } else if (r.type === 'six') {
      o.runs = 6; o.label = 'SIX'; b.sixes++;
    } else if (r.type === 'four') {
      o.runs = 4; o.label = 'FOUR'; b.fours++;
    } else if (r.type === 'runs') {
      o.runs = r.runs;
      o.label = r.runs === 0 ? 'DOT' : r.runs + (r.runs === 1 ? ' RUN' : ' RUNS');
      if (r.plan && r.runs >= 0) Chase.start(r.plan, r.runs);
    } else if (r.type === 'through') {
      const ps = this.pastStumps || { z: Ball.z, y: this.pred.y };
      const hit = Math.abs(ps.z) < STUMP_HALF_W + 0.05 && ps.y < STUMP_H + 0.06;
      if (hit) {
        o.wicket = true; o.label = 'BOWLED';
        o.how = 'b ' + (this.bowler ? this.bowler.name : '');
        Stumps.hit(Ball.vz, Ball.vx);
      }
      else if (ps.y < STUMP_H && Math.abs(this.pred.z) < 0.16 && this.swingInfo
               && this.swingInfo.quality === 'miss' && this.zone >= 3 && Math.random() < 0.45) {
        o.wicket = true; o.label = 'LBW'; o.how = 'lbw';
      } else {
        o.label = this.swingInfo && this.swingInfo.quality === 'miss' ? 'BEATEN' : 'DOT';
        // left alone or beaten: the keeper takes it, rather than the ball
        // carrying on out of the ground with nobody behind the stumps
        Take.start(keeperOf(M.field), Ball.y, true);
      }
    }
    this.applyOutcome(o);
    this.outcome = o;
    this.phase = 'result'; this.t = 0;
    if (!Chase.on && !Take.on) Cam.home(false);
  },

  applyOutcome(o) {
    const b = M.bat;
    if (o.wicket) {
      b.out = true; b.howOut = o.how;
      const mine = M.striker();
      mine.out = true; mine.how = o.how;
      b.wickets++;
      M.swagger = 0;                     // it drops out the ball you get out
      // A golden duck is out first ball. Any other nought is just a duck,
      // and every wicket at nought was being called golden.
      const golden = mine.runs === 0 && mine.balls <= 1;
      if (this.bowler) { this.bowler.balls++; this.bowler.wickets++; }
      M.say(golden ? 'GOLDEN DUCK' : mine.runs === 0 ? 'DUCK' : o.label, true);
      Snd.sting(golden ? 'duck' : 'wicket');
      Cam.kick(0.7);
      return;
    }
    b.runs += o.runs; b.overRuns += o.runs;
    M.striker().runs += o.runs;
    if (o.runs % 2 === 1) M.swapEnds();
    // Swagger builds on dominant strokeplay only — boundaries, and attacking
    // shots played to good balls. Milked singles build nothing.
    let gain = 0;
    const si = this.swingInfo;
    if (o.runs >= 6) gain = 0.30;
    else if (o.runs === 4) gain = 0.22;
    else if (si && si.quality === 'middle' && si.type !== 'control' && si.approp > 0.9) gain = 0.10;
    if (si && si.type !== 'control' && ['good', 'full', 'yorker'].indexOf(this.d.band.key) >= 0) gain *= 1.25;
    if (M.gear === 'cap') gain *= CFG.capSwagger;
    if (this.flourish && o.runs >= 4) { gain += 0.12; Snd.sting('flourish'); }
    if (gain > 0) { M.swagger = clamp(M.swagger + gain, 0, 1); b.dots = 0; }
    else { b.dots++; M.swagger = clamp(M.swagger - (b.dots >= 2 ? 0.16 : 0.08), 0, 1); }
    if (o.runs >= 4) { M.bowlerMood = Math.min(1, M.bowlerMood + 0.4); Snd.sting(o.runs === 6 ? 'six' : 'four'); }
    if (this.ghost) M.dossier[this.zone] += o.runs >= 4 ? 2 : o.runs > 0 ? 1 : 0;
    if (this.bowler) { this.bowler.balls++; this.bowler.runs += o.runs; }
    M.say(o.label, o.runs >= 4);
  },

  after() {
    const b = M.bat;
    const whole = M.playAs.key === 'team' && M.mode === 'match';
    if (b.out) {
      /* Playing the whole side means the next man walks out, and the innings
         runs to ten down or the overs, the way an innings does. Playing your
         own player, your dismissal is the end of it — the rest of the card is
         filled in at the break. */
      if (whole && b.wickets < 10 && b.balls < b.overs * 6 && M.nextBatter()) {
        b.out = false;
        // Playing all eleven, the next man walking out is the event, so it
        // is named rather than left to be inferred from the scorebar.
        M.say('IN: ' + M.striker().name + '   #' + (M.mySlot + 1), false);
      } else { Match.endInnings(); return; }
    }
    if (M.mode !== 'batPractice' && b.balls >= b.overs * 6) { Match.endInnings(); return; }
    // got there: a chase stops the moment it is done
    if (b.target > 0 && M.myScore() >= b.target) { Match.endInnings(); return; }
    if (M.level.dossier && b.balls % 6 === 0) M.field = buildField(M.level, M.dossier);
    // The end of an over is a stop, not a seam in the middle of a sentence:
    // the ends change, the bowler changes, and you get to look at the score.
    if (M.mode === 'match' && b.balls > 0 && b.balls % 6 === 0) {
      M.swapEnds();                      // the ends change with the over
      Match.screen = 'overEnd'; Match.overT = 0; return;
    }
    this.nextBall();
  },
};
/* ===================== BOWLING =====================
   Drag a target on to the pitch, then release on the beat. That is the
   whole scheme: one spatial input you can take your time over and one
   timed input that decides how close you get to it. There is no length
   bar to decode and no seam dial to hit — what makes one bowler different
   from another lives in the ball itself.

   Your style decides pace, how much the ball moves and which way, and what
   your one variation button does. There is no bowling meter any more: what
   you have is the target, the beat and the variation, and the batter's
   confidence tick tells you whether it is working. */
const Bowl = {
  phase: 'setup', t: 0,
  target: { x: 16.4, z: 0.30 },
  vari: false, sweep: 0, sweepDir: 1, tapErr: 1, tapped: false, runFrom: 1,
  d: null, pred: null, ai: null, outcome: null, ghost: null,
  flinch: 0, surprise: 0, pace: 20, releaseT: 0, aiQuality: 'good', aiSwingT: -9,
  loose: false, band: BANDS[2],

  nextBall() {
    this.phase = 'setup'; this.t = 0;
    this.vari = false; this.tapped = false; this.tapErr = 1;
    this.outcome = null; this.ghost = null; this.ai = null;
    this.sweep = 0; this.sweepDir = 1; this.aiSwingT = -9; this.pastStumps = null;
    this.aiConnected = false;
    Ball.live = false;
    Chase.stop(); Take.stop(); Catcher.clear(); Stumps.clear();
    Input.flush();
    Cam.home(false);
    Snd.mode = 'bowl';
  },

  delivery() { return this.vari ? M.style.vari : M.style.stock; },
  /* What the chase needs. A side eight an over behind blocks; a side
     eighteen an over behind swings at everything and gets caught doing it,
     which is the whole reason defending a big total feels different from
     defending a small one. */
  requiredRate() {
    const b = M.bowl;
    if (!M.format.chase) return 4.5;     // a Test side is not chasing anything
    if (!b.target) return 9.5;           // five overs: they are not saving it
    const left = Math.max(1, b.overs * 6 - b.balls);
    return Math.max(0, (b.target - b.runs)) / left * 6;
  },
  variUsable() { return !M.style.vari.limited || M.bowl.variLeft > 0; },

  buttons() {
    const y = VH - TICKER.h - 74;      // clear of the ticker along the bottom
    return {
      vari: { x: 40, y: y, w: 300, h: 62,
              label: this.vari ? M.style.vari.label : M.style.stock.label,
              sub: M.style.vari.limited ? M.bowl.variLeft + ' LEFT THIS OVER' : 'TAP TO SWITCH' },
      bowl: { x: VW - 300, y: y, w: 260, h: 62, label: 'BOWL', sub: null },
    };
  },
  inBtn(b, p) { return p.x > b.x && p.x < b.x + b.w && p.y > b.y && p.y < b.y + b.h; },

  update(dt) {
    this.t += dt;

    if (this.phase === 'setup') {
      const B = this.buttons();
      const onRadar = p => Math.hypot(p.x - RADAR.cx, p.y - RADAR.cy) < RADAR.r + 8;
      let tap;
      while ((tap = Input.takeTap())) {
        if (this.inBtn(B.vari, tap)) { if (this.variUsable() || this.vari) this.vari = !this.vari; }
        else if (this.inBtn(B.bowl, tap)) { this.startRunup(); return; }
        else if (M.mode !== 'batPractice' && onRadar(tap)) {
          Match.screen = 'field'; Field.open(); return;
        }
      }
      // drag anywhere on the pitch to move the target — but not through the
      // radar, which is a button in this phase
      if (Input.down && Input.y < VH - TICKER.h - 92
          && !onRadar({ x: Input.x, y: Input.y })) {
        const g = unprojectGround(Input.x, Input.y);
        if (g) {
          this.target.x = clamp(g.x, 10.4, 20.0);
          this.target.z = clamp(g.z, -1.9, 1.9);
        }
      }
      if (Input.keys.ArrowUp) this.target.x = clamp(this.target.x + dt * 5.5, 10.4, 20.0);
      if (Input.keys.ArrowDown) this.target.x = clamp(this.target.x - dt * 5.5, 10.4, 20.0);
      if (Input.keys.ArrowLeft) this.target.z = clamp(this.target.z + dt * 2.2, -1.9, 1.9);
      if (Input.keys.ArrowRight) this.target.z = clamp(this.target.z - dt * 2.2, -1.9, 1.9);
      if (Input.keys.KeyV && !this.variHeld) { if (this.variUsable() || this.vari) this.vari = !this.vari; }
      this.variHeld = !!Input.keys.KeyV;
      if (Input.keys.Space && this.t > 0.25) this.startRunup();
      return;
    }

    if (this.phase === 'runup') {
      // one cursor, one green band, one tap. Quicker bowlers sweep faster.
      const speed = 1.15 * (this.pace / 19);
      this.sweep += this.sweepDir * speed * dt;
      if (this.sweep > 1) { this.sweep = 1; this.sweepDir = -1; }
      if (this.sweep < 0) { this.sweep = 0; this.sweepDir = 1; }
      if (Input.takeTap() || Input.keys.Space) {
        this.tapErr = clamp(Math.abs(this.sweep - 0.5) * 2, 0, 1);
        this.tapped = true;
        this.release();
        return;
      }
      if (this.t > 2.4) { this.tapErr = 1; this.release(); }
      return;
    }

    if (this.phase === 'flight') {
      Ball.step(dt);
      if (!this.ai.played && now() >= this.ai.swingAt) this.playAI();
      if (this.ai.played && Ball.hit && this.outcome === null) {
        Catcher.update();
        const r = resolveTravel(M.field, { sharpCatching: true, edged: this.aiQuality === 'edge' });
        if (r) this.finish(r);
        Snd.travelTo(200 + Ball.distFromCentre() * 9);
        Cam.chase(Ball.x, Ball.y, Ball.z);
      }
      if (!Ball.hit && !this.pastStumps && Ball.x >= CONTACT_X) {
        this.pastStumps = { z: Ball.z, y: Ball.y };
      }
      if (!Ball.hit && Ball.x > Bat.keeperX() - 0.3) {
        const ps = this.pastStumps;
        this.finish(ps && isWide(ps.z) && !this.aiConnected
                    ? { type: 'wide' } : { type: 'through' });
      }
      if (this.t > 6) this.finish({ type: 'runs', runs: 0 });
      if (this.flinch > 0) this.flinch -= dt;
      return;
    }

    if (this.phase === 'result') {
      if (Take.on) Take.update(dt);
      else if (Chase.on) { Chase.update(dt); Cam.chase(Ball.x, Ball.y, Ball.z); }
      else if (Ball.live) Ball.step(dt);
      const wait = this.outcome && this.outcome.wicket ? 2.2 : 1.1;
      if (!Chase.on && this.t > wait) this.after();
    }
  },

  startRunup() {
    const S = M.style, del = this.delivery();
    // Your arm is your arm: the setting slows the ball you *face*, not the one
    // you send down, and on the easy end it gives you a shade more of it.
    this.pace = rnd(S.pace[0], S.pace[1]) * (M.level.myPace || 1) * (del.paceMul || 1);
    this.phase = 'runup'; this.t = 0;
    this.sweep = 0; this.sweepDir = 1;
    Input.flush();
  },

  release() {
    const S = M.style, del = this.delivery();
    const err = this.tapErr;
    // how far in he was when the ball left his hand, so the picture can carry
    // on from there rather than cutting to a man standing at the crease
    this.runFrom = clamp(this.t / RUNUP_T, 0, 1);
    // Accuracy is the tap, not a die roll: the further off the beat, the
    // further the ball lands from where you put the marker.
    const spread = (0.24 + err * err * 2.2) * S.scatter;
    const pitchX = del.bouncer ? BOUNCER_BAND.px + randn() * (0.4 + err)
                               : this.target.x + randn() * spread;
    const pitchZ = this.target.z + randn() * spread * 0.42;
    const band = del.bouncer ? BOUNCER_BAND : bandFor(pitchX);
    if (del.limited && this.vari) M.bowl.variLeft = Math.max(0, M.bowl.variLeft - 1);

    this.band = band;
    this.d = {
      pace: this.pace,
      pitchX: clamp(pitchX, 9.0, 20.1),
      pitchZ: clamp(pitchZ, -2.4, 2.4),
      releaseZ: clamp(pitchZ, -1.6, 1.6) * 0.30 + 0.34,
      rest: band.rest * S.restMul,
      az: (del.swing || 0) * (1 - err * 0.5) + randn() * 0.14,
      turn: (del.turn || 0) * (1 - err * 0.35) * rnd(0.85, 1.1)
            + randn() * ((del.wobble || 0) + 0.22 + err * 0.5),
      band: band, style: S, del: del,
      spinAxis: isSpin(S) ? 1.2 : 0,
    };
    this.pred = Ball.predict(this.d);
    Ball.deliver(this.d);
    this.releaseT = now();

    // Composition: purposeful variation is rewarded, random variation is
    // punished. The ball has to differ from the last two along one axis.
    const hist = M.bowl.lastBands;
    this.surprise = 0;
    if (hist.length >= 2) {
      const differsLen = hist.every(h => h.band !== band.key);
      const differsLine = hist.every(h => Math.abs(h.z - this.d.pitchZ) > 0.55);
      const sameOther = hist.every(h => h.band === hist[0].band) || hist.every(h => Math.abs(h.z - hist[0].z) < 0.6);
      if ((differsLen || differsLine) && sameOther) this.surprise = 1;
    }
    hist.push({ band: band.key, z: this.d.pitchZ });
    if (hist.length > 2) hist.shift();

    this.prepAI();
    this.phase = 'flight'; this.t = 0;
  },

  /* The AI batter. Accuracy narrows his window and movement widens his
     error; nothing rolls his dismissal. You can see him getting worse. */
  prepAI() {
    const T = M.level;
    const contactT = this.releaseT + this.pred.t;
    let best = 2, bs = -9;
    for (let i = 0; i < 6; i++) {
      const s = shotAppropriate(SHOTS[i], this.pred.y, this.band.key, this.pred.z) + rnd(0, 0.25);
      if (s > bs) { bs = s; best = i; }
    }
    if (Math.random() < 0.10) best = (best + (Math.random() < 0.5 ? 1 : 5)) % 6;  // across the line
    // he plays the line he saw, not the one it ended on: movement is what
    // beats him, and how much moved is exactly how much he is off by.
    const moved = Math.abs(this.d.turn) * 0.055 + Math.abs(this.d.az) * 0.030;
    // A ball released on the beat is harder to pick than one that slipped
    // out: accuracy widens his error, it does not narrow it.
    const sigma = T.aiSigma * (1 + this.surprise * 0.25 + moved)
                * (1.15 - this.tapErr * 0.40);
    const px = this.d.pitchX, pz = this.d.pitchZ;
    // Length is what makes a ball hittable, not line. A long hop or a half
    // volley on the stumps is the easiest delivery in cricket, and the old
    // rule — which wanted it wide as well before it counted — never fired on
    // one, so a sloppy spell cost the same as an accurate one. It is also a
    // matter of degree now rather than a switch.
    this.loose = clamp(Math.max(0, 13.9 - px) * 0.34
                     + Math.max(0, px - 18.7) * 0.42
                     + Math.max(0, Math.abs(pz) - 0.72) * 0.75, 0, 1);
    const shy = (this.band.key === 'short' || this.band.key === 'bouncer')
              && M.batterConf < 0.42 && Math.random() < 0.35;
    this.ai = {
      zone: best, err: randn() * sigma, played: false,
      swingAt: contactT + randn() * sigma,
      leave: shy || Math.random() < 0.05,
      contactT: contactT, sigma: sigma,
    };
    this.ai.err = this.ai.swingAt - contactT;
    if (shy) this.flinch = 0.6;
  },

  playAI() {
    const T = M.level;
    this.ai.played = true;
    this.aiSwingT = now();
    if (this.ai.leave) { Snd.bat('miss'); this.aiSwingT = -9; return; }
    const shot = SHOTS[this.ai.zone];
    const approp = shotAppropriate(shot, this.pred.y, this.band.key, this.pred.z);
    const widen = T.aiWindow * (0.72 + approp * 0.34) * (1 + this.loose * 0.42);
    const w = timingWindows({ widen: widen });
    // how hard he is going at it, which decides how far he can stretch
    const need = clamp((this.requiredRate() - 6) / 8, 0, 1) * (1 - (M.format.aiPatience || 0));
    const aggressive = Math.random() < (0.44 - (M.format.aiPatience || 0) * 0.22)
                     + M.batterConf * 0.34 + this.loose * 0.40 + need * 0.45;
    const type = !aggressive ? 'control' : (Math.random() < need * 0.7 ? 'slog' : 'attack');

    const e = Math.abs(this.ai.err);
    let quality = e < w.middle ? 'middle' : e < w.good ? 'good' : e < w.edge ? 'edge' : 'air';
    const reach = batReach(shot, type, this.pred.y, this.pred.z);
    if (reach > 1.25) { Snd.bat('miss'); return; }   // he leaves what he cannot reach
    if (reach > 1.18) quality = 'air';
    else if (reach > 1.00 && quality !== 'air') quality = 'edge';
    if (quality === 'air') { Snd.bat('miss'); M.batterConf = clamp(M.batterConf - 0.05, 0, 1); return; }
    const cone = CFG.cone[quality] * (2 - approp);
    // He looks for a gap too. A batter who is in picks it; one who has just
    // walked out hits it where the shot points and hopes — so how many
    // glances he gets, and how wide he looks, both ride on his confidence.
    // The ring stands on the six shot angles, so this is the whole difference
    // between an over that costs two and an over that costs eight.
    const looks = 3 + Math.round(M.batterConf * 7) + (aggressive ? 2 : 0);
    const span = 16 + M.batterConf * 14;
    let aim = shot.ang, bestGap = -1;
    for (let k = 0; k < looks; k++) {
      const a = shot.ang + rnd(-span, span);
      const px = CONTACT_X - Math.cos(deg(a)) * 24, pz = -Math.sin(deg(a)) * 24;
      let near = 999;
      for (const f of M.field) near = Math.min(near, Math.hypot(px - f.x, pz - f.z));
      if (near > bestGap) { bestGap = near; aim = a; }
    }
    let angle = aim + randn() * cone;
    if (quality === 'edge') angle = edgeDeflect(angle);
    const power = CFG.swingSpeed[type] * CFG.qualityMult[quality] * shot.power * approp;
    let lift = shot.lift * CFG.typeLift[type] * CFG.qualityLift[quality];
    if (quality === 'edge') lift = edgeLift(lift, angle);
    this.ghost = { intended: aim, actual: angle };
    this.aiQuality = quality; this.aiConnected = true;
    playShot({ quality: quality, power: power, angleDeg: angle, lift: lift, contactY: this.pred.y });
    Catcher.commit(M.field, { sharpCatching: true, edged: quality === 'edge' });
    Snd.bat(quality === 'edge' ? 'edge' : 'middle');
    Snd.travel(220);
  },

  finish(r) {
    if (this.outcome) return;
    Snd.travelEnd();
    const b = M.bowl;
    const o = { wicket: false, runs: 0, label: '', wide: r.type === 'wide' };

    if (r.type === 'wide') {
      b.runs += 1; b.extras++;
      const w2 = youAs();
      if (w2.runs !== undefined) w2.runs += 1;
      o.label = 'WIDE';
      Take.start(keeperOf(M.field), Ball.y, true);
      M.say('WIDE', false);
      M.batterConf = clamp(M.batterConf + 0.03, 0, 1);
      this.outcome = o;
      this.phase = 'result'; this.t = 0;
      if (!Chase.on && !Take.on) Cam.home(false);
      return;
    }
    b.balls++;
    if (r.type === 'caught') {
      o.wicket = true; o.label = r.by.keeper ? 'CAUGHT BEHIND' : 'CAUGHT';
      Take.start(r.by, Ball.y);
      Cam.chase(Take.x, 1.5, Take.z);
    } else if (r.type === 'six') { o.runs = 6; o.label = 'SIX'; }
    else if (r.type === 'four') { o.runs = 4; o.label = 'FOUR'; }
    else if (r.type === 'runs') {
      o.runs = r.runs;
      o.label = r.runs === 0 ? 'DOT' : r.runs + (r.runs === 1 ? ' RUN' : ' RUNS');
      if (r.plan) Chase.start(r.plan, r.runs);
    } else {
      const ps = this.pastStumps || { z: Ball.z, y: this.pred.y };
      const hit = Math.abs(ps.z) < STUMP_HALF_W + 0.05 && ps.y < STUMP_H + 0.06;
      if (hit) { o.wicket = true; o.label = 'BOWLED'; Stumps.hit(Ball.vz, Ball.vx); }
      else {
        o.label = this.ai.leave ? 'LEFT' : 'BEATEN';
        Take.start(keeperOf(M.field), Ball.y, true);
      }
    }
    if (o.label === 'BEATEN') M.batterConf = clamp(M.batterConf - 0.08, 0, 1);
    if (o.runs > 0 && o.runs < 4) M.batterConf = clamp(M.batterConf + 0.04, 0, 1);
    if (o.runs >= 4) { M.batterConf = clamp(M.batterConf + 0.12, 0, 1); Snd.sting(o.runs === 6 ? 'six' : 'four'); }
    if (o.wicket) {
      b.wickets++; M.batterConf = 0.4; Snd.sting('wicket'); Cam.kick(0.7);
    }
    b.runs += o.runs;
    const me = youAs();
    if (me.balls !== undefined) { me.balls++; me.runs += o.runs; if (o.wicket) me.wickets++; }
    const bat = M.theirBatter();
    if (bat) {
      bat.balls++; bat.runs += o.runs;
      if (o.wicket) {
        bat.out = true;
        bat.how = o.label === 'BOWLED' ? 'b ' + youAs().name
                : o.label === 'CAUGHT BEHIND' ? 'c wk  b ' + youAs().name
                : Take.who && Take.who.bowler ? 'c & b ' + youAs().name
                : 'c ' + (Take.who ? Take.who.name.toLowerCase() : 'field') + '  b ' + youAs().name;
        M.theirOut++;
        M.theirNextBatter();
      } else if (o.runs % 2 === 1) { M.theirSwap(); }
    }
    if (b.balls % 6 === 0) { b.variLeft = 2; M.theirSwap(); }
    M.say(o.label, o.runs >= 4 || o.wicket);
    this.outcome = o;
    this.phase = 'result'; this.t = 0;
    Snd.intensity = clamp(0.25 + b.wickets * 0.12, 0, 1);
    if (!Chase.on && !Take.on) Cam.home(false);
  },

  after() {
    const b = M.bowl;
    const done = (M.mode !== 'bowlPractice')
      && (b.balls >= b.overs * 6 || b.wickets >= b.maxWickets
          || (b.target > 0 && b.runs >= b.target));
    if (done) { Match.endTheirInnings(); return; }
    // an over is up: who takes the next one is a decision, not a rotation
    if (b.balls > 0 && b.balls % 6 === 0 && M.mode === 'match'
        && M.playAs.key === 'team') { Match.screen = 'overs'; return; }
    if (b.balls > 0 && b.balls % 6 === 0 && M.mode === 'match'
        && M.playAs.key === 'player') {
      // your spell is a quarter of the innings, capped where a real one is
      const spell = clamp(Math.round(b.overs * 0.25), 2, 4);
      if (b.balls / 6 >= spell) { Match.simRestOfSpell(); return; }
    }
    this.nextBall();
  },
};

/* ===================== MATCH FLOW =====================
   Five overs a side. You face every ball of your innings; if you go early
   the rest is simmed and you are bowling inside ten seconds. */
const Match = {
  screen: 'menu', level: LEVELS[0],
  simTarget: 0, simShown: 0, breakT: 0, introT: 0, overT: 0, runOut: null, cardInns: 0,
  note: '', won: false, margin: '', boardPlace: -1,

  toGear(level, mode) {
    this.level = level;
    M.reset(level, mode);
    this.screen = 'gear';
  },
  begin() {
    this.screen = 'intro'; this.introT = 0;
  },
  /* The caption that opens a broadcast: who, where, and in what light. */
  reallyBegin() {
    this.screen = 'match';
    Snd.intensity = 0;
    Portal.playStart();
    if (M.phase === 'bat') { Snd.mode = 'bat'; Bat.lastBackliftZone = -1; Bat.nextBall(); }
    else { Snd.mode = 'bowl'; Bowl.nextBall(); }
    Cam.home(true);
  },
  endInnings() {
    Chase.stop();
    if (M.mode === 'batPractice') { this.finish(); return; }
    const whole = M.playAs.key === 'team';
    if (whole) {
      // Nobody else bats: you batted all of them. The total is what is on the
      // card, and the men who never got in are down as did not bat.
      M.bat.teamRuns = M.bat.runs + M.bat.extras;
    } else {
      const rate = M.parRate();
      const left = Math.max(0, M.bat.overs * 6 - M.bat.balls);
      const others = Math.round(left * rate * rnd(0.7, 1.3));
      M.bat.teamRuns = M.bat.runs + M.bat.before + M.bat.extras + others;
      // share the rest of the total out down the order, so the card adds up
      let pot = others + M.bat.before;
      const order = [];
      for (let i = 0; i < 11; i++) if (i !== M.mySlot) order.push(i);
      order.forEach((i, n) => {
        if (pot <= 0) return;
        const take = n === order.length - 1 ? pot : Math.round(pot * rnd(0.15, 0.45));
        const c = M.myCard[i];
        c.runs = Math.min(pot, take);
        c.balls = Math.max(1, Math.round(c.runs * rnd(0.8, 2.0)));
        c.out = i < M.mySlot || n < 7;   // everyone above you is already out
        c.how = c.out ? pick(HOW_OUT)(M.attack) : 'not out';
        pot -= c.runs;
      });
    }
    M.log.push({ side: 'us', inns: M.inns, name: M.us.name,
                 card: M.myCard.map(c => Object.assign({}, c)),
                 runs: M.bat.teamRuns, wickets: Math.min(10, M.bat.wickets),
                 // your own share of it is not the length of it
                 balls: whole ? M.bat.balls : M.format.overs * 6,
                 extras: M.bat.extras });
    if (BAT_ONLY) { this.finish(); return; }
    this.simTarget = M.bat.teamRuns; this.simShown = M.myScore() - M.bat.extras;
    this.screen = 'break'; this.breakT = 0;
    Snd.mode = 'bowl'; Snd.intensity = 0;
  },
  /* What they have to get. In a one-innings game it is your total; in a Test
     it is the lead you have built, and only in the last innings of the four
     is there anything to chase at all. */
  theirTarget() {
    const mine = M.log.filter(e => e.side === 'us').reduce((n, e) => n + e.runs, 0);
    const theirs = M.log.filter(e => e.side === 'them').reduce((n, e) => n + e.runs, 0);
    if (M.format.innings === 2 && M.inns === 1) return 0;   // no chase yet
    return mine - theirs + 1;
  },
  startBowling() {
    M.phase = 'bowl';
    M.startTheirInnings();
    M.bowl.target = this.theirTarget();
    M.bowlerAs = M.myAttack[0];
    M.field = buildField(M.level, null);
    Cam.home(true);
    // Bowling the whole side means the first over is a choice too, not just
    // every one after it.
    if (M.playAs.key === 'team' && M.mode === 'match') { this.screen = 'overs'; return; }
    this.screen = 'match';
    Bowl.nextBall();
  },
  /* Their innings is over. In a Test that may only be half the match. */
  endTheirInnings() {
    Chase.stop();
    M.log.push({ side: 'them', inns: M.inns, name: M.oppo.name,
                 card: M.theirCard.map(c => Object.assign({}, c)),
                 runs: M.bowl.runs, wickets: M.bowl.wickets,
                 balls: M.bowl.balls, extras: M.bowl.extras });
    if (M.format.innings === 2 && M.inns === 1) {
      M.inns = 2;
      M.phase = 'bat';
      M.startMyInnings();
      M.field = buildField(M.level, null);
      this.screen = 'break'; this.breakT = 0;
      this.simTarget = -1;               // the between-innings card, not a sim
      Snd.mode = 'bat'; Snd.intensity = 0;
      return;
    }
    this.finish();
  },
  /* Aggregates, for a result that has to add up over four innings. Every
     completed innings is in the log by the time anything asks. */
  ourRuns() { return M.log.filter(e => e.side === 'us').reduce((n, e) => n + e.runs, 0); },
  theirRuns() { return M.log.filter(e => e.side === 'them').reduce((n, e) => n + e.runs, 0); },
  /* Your own line, out of however many innings you batted — which is what
     the board and the selector are actually judging. */
  myInnings() {
    let runs = 0, balls = 0;
    M.log.filter(e => e.side === 'us').forEach(e => {
      const mine = e.card.find(c => c.you);
      if (mine && mine.how !== 'dnb') { runs += mine.runs; balls += mine.balls; }
    });
    return { runs: runs, balls: balls };
  },
  finish() {
    Chase.stop();
    this.screen = 'result';
    Portal.playStop();
    const ours = this.ourRuns(), theirs = this.theirRuns();
    const w = M.bowl;
    if (M.mode === 'match') {
      this.won = theirs <= ours;
      this.margin = theirs === ours ? ''
                  : this.won ? (ours - theirs) + ' RUNS'
                  : (w.maxWickets - w.wickets) + ' WICKETS';
    }
    this.note = selectorNote();
    this.boardPlace = -1;
    const b = this.myInnings();
    if (b.balls > 0) {
      Save.data.board.forEach(e => { e.fresh = false; });
      const d = new Date();
      this.boardPlace = Save.record({
        name: Save.data.player.name || 'YOU', runs: b.runs, balls: b.balls,
        level: M.level.name, fresh: true,
        when: d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
              '-' + String(d.getDate()).padStart(2, '0'),
      });
    }
    Save.data.played++; Save.data.seen = true; Save.save();
    if (b.runs >= 30 || w.wickets >= 3) Portal.happy();
  },
};

/* How the rest of your side went. Their bowlers actually took the wickets, so
   the card names them. */
const HOW_OUT = [
  a => 'b ' + pick(a).name,
  a => 'lbw  b ' + pick(a).name,
  a => 'c wk  b ' + pick(a).name,
  a => 'c ' + pick(['slip', 'cover', 'mid off', 'midwicket', 'point', 'gully',
                    'square leg', 'long on', 'third man']) + '  b ' + pick(a).name,
  a => 'run out',
  a => 'st wk  b ' + pick(a.filter(b => isSpin(b.style)).concat(a)).name,
];

/* Fill a card with a total. Used wherever an innings has to exist without
   being played: a plausible spread down the order, everybody who batted with
   balls against his name, the men who never got in down as did not bat, and
   the column adding up to the number at the top. */
function fillCard(card, total, wickets, attack) {
  card.forEach(c => { c.runs = 0; c.balls = 0; c.out = false; c.how = 'dnb'; });
  const n = clamp(wickets + 2, 2, 11);
  let pot = total;
  for (let i = 0; i < n; i++) {
    const c = card[i];
    const take = i === n - 1 ? pot : Math.round(pot * rnd(0.10, 0.40));
    c.runs = clamp(take, 0, pot);
    c.balls = Math.max(2, Math.round(c.runs * rnd(0.8, 2.0)));
    c.out = i < wickets;
    c.how = c.out ? pick(HOW_OUT)(attack) : 'not out';
    pot -= c.runs;
  }
  if (pot !== 0) {                       // whatever is left goes to the last man in
    const c = card[n - 1];
    c.runs += pot; c.balls += Math.max(0, pot);
  }
}

/* Whichever of your side you are bowling as. */
function youAs() { return M.bowlerAs || { name: Save.data.player.name || 'YOU' }; }

/* The overs you do not bowl yourself. Your team-mates get through them at
   their own rate, and their figures go on the card like anybody's. */
/* The overs you do not bowl yourself, played out rather than resolved.
   Jumping from the last ball of your spell to the result screen threw away
   the only part of the match with any suspense left in it, so the rest of
   the innings is simmed into a list of overs and then revealed one at a
   time, with the score moving and the chase closing. */
Match.simRestOfSpell = function () {
  const b = M.bowl;
  const overs = [];
  while (b.balls < b.overs * 6 && b.wickets < b.maxWickets
         && !(b.target > 0 && b.runs >= b.target)) {
    const man = M.myAttack[1 + ((b.balls / 6) | 0) % (M.myAttack.length - 1)];
    const line = { who: man.name, runs: 0, wickets: 0, gone: [] };
    for (let i = 0; i < 6 && b.balls < b.overs * 6; i++) {
      const r = Math.random();
      const runs = r < 0.34 ? 0 : r < 0.62 ? 1 : r < 0.76 ? 2 : r < 0.92 ? 4 : 6;
      const wicket = Math.random() < 0.045;
      b.balls++; b.runs += runs;
      man.balls++; man.runs += runs;
      line.runs += runs;
      const bat = M.theirBatter();
      if (bat) {
        bat.balls++; bat.runs += runs;
        if (wicket) {
          bat.out = true;
          bat.how = 'b ' + man.name;
          M.theirOut++; b.wickets++; man.wickets++;
          line.wickets++; line.gone.push(bat.name);
          M.theirNextBatter();
        } else if (runs % 2 === 1) { M.theirSwap(); }
      }
      if (b.balls % 6 === 0) M.theirSwap();
      if (b.wickets >= b.maxWickets) break;
      if (b.target > 0 && b.runs >= b.target) break;
    }
    line.at = b.runs + '-' + b.wickets;
    line.over = Math.ceil(b.balls / 6);
    overs.push(line);
  }
  Match.runOut = { overs: overs, shown: 0, t: 0 };
  Match.screen = 'runout';
};

function selectorNote() {
  const b = Match.myInnings(), w = M.bowl;
  const wkts = M.log.filter(e => e.side === 'them').length ? M.myAttack[0].wickets : w.wickets;
  if (b.runs === 0 && b.balls <= 1) return '"Everyone gets one of those. Not everyone gets two."';
  if (M.bat.sixes >= 2) return '"He didn\'t look at the bowler once. Not once."';
  if (wkts >= 3) return '"Bowled like he meant it. Keep him on."';
  if (b.runs >= 40) return '"Made it look like a different game."';
  if (b.runs < 8 && wkts === 0) return '"Quiet day. There\'s a fixture next week."';
  return '"Useful. We\'ll see him again."';
}
/* ===================== SCENE ===================== */
function drawLengthMarker(x, z, colour, alpha, w, len) {
  const hw = w || 0.60, hl = len || 0.45;
  const a = proj(x - hl, 0.012, z - hw), b = proj(x + hl, 0.012, z - hw);
  const c = proj(x + hl, 0.012, z + hw), d = proj(x - hl, 0.012, z + hw);
  if (a.behind || b.behind || c.behind || d.behind) return;
  ctx.globalAlpha = alpha === undefined ? 0.75 : alpha;
  Art.poly([a, b, c, d], colour);
  ctx.globalAlpha = 1;
}

/* The fan. Drawn in screen space around the striker, because from behind
   him half the field is off the edge of the picture and a fan painted on
   the grass would put CUT and GLANCE behind the lens. What you flick is
   exactly what you see. */
function drawShotFan(active, dim, aimDeg) {
  const b = batterScreen();
  if (aimDeg !== undefined && !dim) {    // where you are actually pointing
    const a = deg(aimDeg);
    const dx = Math.sin(a), dy = -Math.cos(a);
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 20; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(b.x + dx * 60, b.y + dy * 60);
    ctx.lineTo(b.x + dx * 200, b.y + dy * 200);
    ctx.stroke();
  }
  for (let i = 0; i < 6; i++) {
    const a = deg(SHOTS[i].sdeg);
    const dx = Math.sin(a), dy = -Math.cos(a);
    const on = i === active;
    const r0 = 66, r1 = on ? 186 : 148;
    ctx.globalAlpha = (on ? 0.95 : 0.30) * (dim ? 0.45 : 1);
    ctx.strokeStyle = on ? PAL.gold : 'rgba(255,255,255,0.8)';
    ctx.lineWidth = on ? 8 : 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(b.x + dx * r0, b.y + dy * r0);
    ctx.lineTo(b.x + dx * r1, b.y + dy * r1);
    ctx.stroke();
    if (on) {
      const tx = b.x + dx * (r1 + 34), ty = b.y + dy * (r1 + 34) + 7;
      Art.poly([
        { x: b.x + dx * r1, y: b.y + dy * r1 },
        { x: b.x + dx * (r1 - 22) - dy * 11, y: b.y + dy * (r1 - 22) + dx * 11 },
        { x: b.x + dx * (r1 - 22) + dy * 11, y: b.y + dy * (r1 - 22) - dx * 11 },
      ], PAL.gold);
      Art.text(SHOTS[i].name, clamp(tx, 70, VW - 70), clamp(ty, 40, VH - 120), 22, PAL.gold);
    }
    ctx.globalAlpha = 1;
  }
}

/* ===================== POWER =====================
   Hold time is intent — tap for control, hold to attack, hold from before he
   lets go to premeditate — and until now none of that was visible. You found
   out how hard you had swung by getting caught at midwicket.

   Three segments because there are three shot types, and the two boundaries
   are the exact thresholds the swing reads, so what the bar shows is what the
   game does. It only exists while the thumb is down. */
const POWER = { control: 0.15, attack: 0.42, max: 0.58 };

function powerBand(held, early) {
  if (early) return { name: 'PREMEDITATED', col: '#e05a2b', i: 2 };
  if (held > POWER.attack) return { name: 'BIG SHOT', col: '#e05a2b', i: 2 };
  if (held > POWER.control) return { name: 'ATTACK', col: PAL.gold, i: 1 };
  return { name: 'CONTROL', col: '#dfe6ea', i: 0 };
}

function drawPowerMeter() {
  if (M.phase !== 'bat' || Match.screen !== 'match') return;

  // It stays on screen whether or not the thumb is down. A meter that only
  // exists while you are already holding teaches nothing to somebody who has
  // not worked out that holding is a thing.
  const live = Input.charging() && !Bat.swung
            && (Bat.phase === 'runup' || Bat.phase === 'flight');
  const early = live && Bat.earlyHold;
  const held = live ? clamp(Input.heldFor(), 0, POWER.max) : 0;
  const band = live ? powerBand(held, early)
                    : { name: 'HOLD FOR POWER', col: 'rgba(255,255,255,0.55)', i: 0 };
  // Above the ticker, on one line with its own name, and clear of the fan.
  const w = 236, h = 16, x = VW / 2 - w / 2, y = VH - TICKER.h - 26;

  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(x - 3, y - 3, w + 6, h + 6);
  ctx.fillStyle = 'rgba(255,255,255,0.14)';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = band.col;
  if (live) ctx.fillRect(x, y, w * (early ? 1 : held / POWER.max), h);

  // the two thresholds, drawn where they actually are
  ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 2;
  [POWER.control, POWER.attack].forEach(t => {
    const tx = x + w * (t / POWER.max);
    ctx.beginPath(); ctx.moveTo(tx, y); ctx.lineTo(tx, y + h); ctx.stroke();
  });
  ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 2;
  ctx.strokeRect(x, y, w, h);
  Art.text(band.name, x - 12, y + 13, 17, band.col, 'right');
}

/* Intended against actual, so error is attributable to the input. */
function drawGhost(g) {
  if (!g) return;
  const from = proj(CONTACT_X, 0.5, 0);
  if (from.behind) return;
  const draw = (angDeg, colour, dash) => {
    const a = deg(angDeg);
    const to = proj(CONTACT_X - Math.cos(a) * 26, 0.5, -Math.sin(a) * 26);
    if (to.behind) return;
    ctx.save();
    ctx.setLineDash(dash ? [10, 8] : []);
    ctx.strokeStyle = colour; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y); ctx.stroke();
    ctx.restore();
  };
  draw(g.intended, 'rgba(255,255,255,0.5)', true);
  draw(g.actual, 'rgba(232,185,35,0.85)', false);
}

/* The bowler, seen head on as he runs at you. Legs scissor, and in the
   last stretch the arm goes over the top — with no faces and no fingers
   that arm and the seam on the ball are the whole tell. */
const BOWLER_Z = 0.45;
/* How long the walk back and in takes when you are the one bowling. It used
   to be 1.6s, which was longer than anybody waits before tapping the beat,
   so the tap almost always caught him a long way back. */
const RUNUP_T = 1.15;
const markX = awayFromCamera => (awayFromCamera ? -7.0 : -8.0);
const runupX = (p, awayFromCamera) => lerp(markX(awayFromCamera), RELEASE_X, Math.pow(p, 0.85));

function drawBowlerRunup(p, shirt, style, awayFromCamera) {
  const x = runupX(p, awayFromCamera);
  const cyc = Math.sin(p * (isSpin(style) ? 26 : 36)) * 30;
  const del = clamp((p - 0.80) / 0.20, 0, 1);
  // the arm sweeps up behind, over the top, and through
  const armOver = lerp(-40, -300, del);
  Art.shadow(x, BOWLER_Z, 0.42, 0.2);
  const f = drawFigure(x, BOWLER_Z, {
    view: 'front', shirt: shirt, cap: 'cap',
    legL: 16 + cyc, legR: 16 - cyc,
    armL: del > 0 ? armOver : -34 + cyc * 0.9,
    armR: 30 - cyc * 0.7,
    lean: (awayFromCamera ? -1 : 1) * (0.8 + p * 1.6),
    tilt: -del * 2,
  });
  if (del < 0.9) drawBallInHand(f, 9);    // seam showing, the only tell there is
  return f;
}

/* The follow-through. A bowler does not stop dead at the crease — he runs on
   down the pitch, veers off it and lets the arm come across, and cutting
   from the delivery stride to a standing figure was the most obviously wrong
   second in the game. Timing the beat early made it worse: the run-up was
   abandoned wherever the tap caught him and the next frame painted him at
   the crease. He now covers the last of the ground in a stride and then
   follows through, and the reaction pose picks him up where it leaves him. */
const FOLLOW_X = 4.6, FOLLOW_Z = 1.10, FOLLOW_T = 1.05, CATCHUP_T = 0.26;
const followEase = u => 1 - Math.pow(1 - clamp(u, 0, 1), 2.1);
const followX = u => lerp(RELEASE_X, FOLLOW_X, followEase(u));
const followZ = u => lerp(BOWLER_Z, FOLLOW_Z, followEase(u));

function drawBowlerFollow(u, shirt, style, awayFromCamera) {
  u = clamp(u, 0, 1);
  const x = followX(u), z = followZ(u);
  const cyc = Math.sin(u * 13 + 1.1) * 26 * (1 - u * 0.8);
  const arm = lerp(-300, -408, followEase(u));   // over the top and across
  Art.shadow(x, z, 0.42, 0.2);
  return drawFigure(x, z, {
    view: 'front', shirt: shirt, cap: 'cap',
    legL: 15 + cyc, legR: 15 - cyc,
    armL: arm, armR: 26 - cyc * 0.6,
    lean: (awayFromCamera ? -1 : 1) * (2.2 - u * 1.7),
    tilt: -2 + u * 1.5,
  });
}

/* Wherever the tap caught him, through the crease, and out the other side.
   `from` is how far into the run-up he had got when the ball left his hand,
   `t` how long ago that was. */
function drawBowlerDelivery(from, t, shirt, style, awayFromCamera, place) {
  const rest = (1 - from) * CATCHUP_T;
  if (t < rest) {
    const q = clamp(from + (t / Math.max(0.001, rest)) * (1 - from), 0, 1);
    place(runupX(q, awayFromCamera), BOWLER_Z,
          () => drawBowlerRunup(q, shirt, style, awayFromCamera));
    return;
  }
  const u = clamp((t - rest) / FOLLOW_T, 0, 1);
  place(followX(u), followZ(u), () => drawBowlerFollow(u, shirt, style, awayFromCamera));
}

/* The ball turning over in his hand. */
function drawBallInHand(f, spin) {
  if (!f) return;
  const r = Math.max(1.6, f.u * 0.085);
  Art.disc(f.handL, r, PAL.ball);
  ctx.save();
  ctx.translate(f.handL.x, f.handL.y); ctx.rotate(now() * spin);
  ctx.strokeStyle = PAL.white; ctx.lineWidth = Math.max(1, r * 0.35);
  ctx.beginPath(); ctx.moveTo(-r * 0.9, 0); ctx.lineTo(r * 0.9, 0); ctx.stroke();
  ctx.restore();
}

/* Waiting to bowl. He walks back from his follow-through to the top of his
   mark and stands there turning the ball over — which is where a bowler is
   while the field is being set, rather than standing on a length halfway
   down the pitch, which is where he used to be drawn. */
function bowlerWaitX(t) {
  const u = clamp(t / 1.4, 0, 1);
  return lerp(RELEASE_X, markX(true), u * u * (3 - 2 * u));
}
function drawBowlerWaiting(t, shirt) {
  const u = clamp(t / 1.4, 0, 1);
  const x = bowlerWaitX(t);
  const cyc = u < 1 ? Math.sin(t * 8.5) * 15 : 0;
  const idle = Math.sin(now() * 1.3) * 2.5;
  Art.shadow(x, BOWLER_Z, 0.42, 0.2);
  const f = drawFigure(x, BOWLER_Z, {
    view: 'front', shirt: shirt, cap: 'cap',
    legL: 11 + cyc, legR: 11 - cyc,
    armL: -20 - cyc * 0.5 + idle, armR: 20 + cyc * 0.5,
    lean: u < 1 ? 0.7 : 0,
  });
  drawBallInHand(f, u < 1 ? 5 : 2.2);
}

/* He reacts, visibly, every ball. Beating an opponent is more fun than
   beating a difficulty curve. */
const REACTION_X = FOLLOW_X, REACTION_Z = FOLLOW_Z;
function drawBowlerReaction(mood, shirt) {
  const x = REACTION_X, z = REACTION_Z;
  Art.shadow(x, z, 0.42, 0.2);
  const base = { view: 'front', shirt: shirt, cap: 'cap' };
  if (mood > 0.35) {                     // hands on head
    drawFigure(x, z, Object.assign({}, base, { armL: -168, armR: 168, legL: 10, legR: 10 }));
  } else if (mood < -0.3) {              // a stare down the pitch
    drawFigure(x, z, Object.assign({}, base, { armL: -8, armR: 8, legL: 22, legR: 22, lean: 1.6 }));
  } else {
    drawFigure(x, z, Object.assign({}, base, { armL: 16, armR: 16, legL: 13, legR: 13 }));
  }
}

/* The striker, from behind. His stance is the Swagger readout — pure
   feedback, no mechanical effect, and it is the thing players talk about. */
const STRIKER_X = CREASE_X + 0.45, STRIKER_Z = -0.72;

/* What your side is wearing, and what theirs is. Yours is the kit you picked
   on the player screen; theirs is their nation's, unless that would put two
   near-identical shirts on the same field. */
function myKit() {
  const k = M.format && M.format.whites ? kitByKey('whites') : kitByKey(Save.data.player.kit);
  return { shirt: k.shirt, trim: k.trim, pads: k.pads, cap: k.trim,
           skin: SKINS[clamp(Save.data.player.skin | 0, 0, SKINS.length - 1)] };
}
function theirKit() {
  const n = M.oppo || NATIONS[0];
  if (M.format && M.format.whites) {
    return { shirt: '#e7e1cf', trim: n.cap, pads: '#f6f2e6', cap: n.cap, skin: SKINS[3] };
  }
  const mine = kitByKey(Save.data.player.kit);
  const shirt = n.kit === mine.shirt ? '#3b3f45' : n.kit;
  return { shirt: shirt, trim: '#f2ecdc', pads: '#f2ecdc', cap: n.cap, skin: SKINS[3] };
}

/* The whole shot, as a pose. Stance and pick-up when he is waiting, then
   the swing runs on its own clock from the moment he commits: down through
   the line, out the far side, and held there. The hold is the point — a
   stroke you watch finish reads as a stroke, and a bat that snaps back to
   the stance reads as a sprite. */
function strikerPose(zone, swingT, info, shirt, cap, face) {
  const sw = M.swagger;
  const viewBack = face > 0;             // the striker; the other end mirrors
  const o = {
    view: 'side', face: face, shirt: shirt, pads: true, bat: true, cap: cap,
    legF: STANCE.legFront + sw * 3, legB: -STANCE.legBack - sw * 2,
    armF: STANCE.handFront, armB: STANCE.handBack,
    lean: -0.6 + sw * 1.6, crouch: STANCE.crouch,
    batAng: STANCE.batRest, blur: 0, zone: zone, stride: 0,
  };

  const t = swingT > 0 ? now() - swingT : -1;
  if (!info || t < 0 || t > 1.15) {
    // --- waiting ---
    // the bat taps, and it taps lazier the further Swagger has come
    const rate = STANCE.tapEvery * (1 - sw * 0.45);
    const ph = (now() * rate) % 1;
    const tap = ph < 0.18 ? Math.sin(ph / 0.18 * Math.PI) * 15 : 0;
    o.batAng = STANCE.batRest + sw * 18 + tap;

    if (viewBack) {
      // the trigger: a small press back and across as the bowler loads up,
      // and the pick-up going up with it. Every ball, not only the ones you
      // have already decided about.
      const load = Bat.phase === 'runup'
        ? clamp((Bat.t - (Bat.runup - STANCE.trigger)) / STANCE.trigger, 0, 1)
        : (Bat.phase === 'flight' ? 1 : 0);
      if (load > 0) {
        const e = load * load * (3 - 2 * load);
        o.batAng = lerp(o.batAng, STANCE.pickup, e);
        o.armF = STANCE.handFront + STANCE.handLift * e;
        o.armB = STANCE.handBack + STANCE.handLift * e;
        o.crouch = STANCE.crouch + e * 0.35;
        o.lean = lerp(o.lean, -1.5, e);
        o.stride = -e * 0.14;            // back and across
        o.legB = lerp(o.legB, -STANCE.legBack - 5, e);
      }
      // committing early lifts it higher still, which is the tell
      if (Input.charging() && Bat.phase !== 'result') {
        o.batAng = STANCE.pickupHeld;
        o.armF = STANCE.handFront + STANCE.handLift * 1.8;
        o.armB = STANCE.handBack + STANCE.handLift * 1.8;
        o.lean = -1.9;
      }
    }
    return o;
  }

  // --- playing it ---
  const A = SHOT_ANIM[zone];
  const beaten = info.quality === 'miss';
  const finish = beaten ? A.finish - 40 : A.finish;
  let ang;
  if (t < SWING_DOWN) {
    // the downswing accelerates: `whip` is how much of it is bottom hand, so
    // a flick through midwicket snaps late where a cover drive swings evenly
    ang = lerp(A.lift, A.contact, Math.pow(t / SWING_DOWN, A.whip));
    o.blur = 1;
  } else if (t < SWING_DOWN + SWING_THROUGH) {
    const p = (t - SWING_DOWN) / SWING_THROUGH;
    ang = lerp(A.contact, finish, 1 - Math.pow(1 - p, 2));
    o.blur = 1 - p;
  } else {
    const rel = clamp((t - SWING_DOWN - SWING_THROUGH - A.hold) / 0.30, 0, 1);
    ang = lerp(finish, STANCE.batRest + sw * 18, rel * rel);
  }

  const k = clamp(t / (SWING_DOWN + SWING_THROUGH), 0, 1);
  const settle = clamp((t - SWING_DOWN - SWING_THROUGH - A.hold) / 0.30, 0, 1);
  const w = k * (1 - settle);            // how far into the stroke he still is
  o.batAng = ang;
  o.lean = lerp(o.lean, A.lean + (beaten ? -1.8 : 0), w);
  o.crouch = lerp(STANCE.crouch, A.crouch, w);
  // the hands finally leave the hip: through the ball the arms extend
  o.armF = lerp(STANCE.handFront, A.back ? 52 : 74, w);
  o.armB = lerp(STANCE.handBack, A.back ? 42 : 62, w);
  // the front leg strides into a front-foot shot; a back-foot one plants the
  // back leg and drops on to it, and the hips open through both
  o.legF = STANCE.legFront + (A.back ? -10 : 20) * w;
  o.legB = -STANCE.legBack - (A.back ? 17 : 5) * w - A.open * 3 * w;
  // and he actually moves: the stride is a metre of pitch, not a lean
  o.stride = A.stride * w;
  return o;
}

/* The bat drawn back along its own arc, so a middled shot is a wedge rather
   than a stick that teleported. */
function drawBatBlur(anchors, o) {
  if (!anchors || o.blur < 0.06) return;
  const dir = o.view === 'side' ? o.face : 1;
  for (let i = 1; i <= 3; i++) {
    ctx.globalAlpha = 0.22 * o.blur * (4 - i) / 3;
    drawBat(anchors.handF, o.batAng + i * 19, anchors.H, dir, '#efe3c0');
  }
  ctx.globalAlpha = 1;
}

/* Side on, as a batter stands. From behind the striker the off side is to
   the right, so he turns that way and the swing table's angles — which are
   already screen angles — carry straight over. At the other end the camera
   has the off side on the left, so that batter is the same rig mirrored, and
   his cut still goes to the off. */
function drawStriker() {
  const K = myKit();
  // The cap is your player's choice, so it is on your player's head and
  // nobody else's — which only shows up once you are batting all eleven.
  const lid = M.striker().you && M.gear === 'cap' ? 'cap' : 'helmet';
  const o = strikerPose(Bat.zone, Bat.swung ? Bat.swingT : -1, Bat.swingInfo,
                        K.shirt, lid, 1);
  o.trim = K.trim; o.padCol = K.pads; o.capCol = K.cap; o.skin = K.skin;
  const x = STRIKER_X - o.stride;        // down the pitch is decreasing x
  Art.shadow(x, STRIKER_Z, 0.44, 0.26);
  drawBatBlur(drawFigure(x, STRIKER_Z, o), o);
}

/* The batter you are bowling at, seen from behind your own arm. */
/* The batter you are bowling at, seen from behind your own arm. He plays
